name: 下载优化第四批

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  optimize:
    name: 下载优化第四批
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 检查第三批基础
        shell: bash
        run: |
          test -f app/src/main/kotlin/com/yunx/app/data/download/CloudDownloadSource.kt
          test -f app/src/main/kotlin/com/yunx/app/data/download/DownloadSourceRefresh.kt
          grep -q "version = 16" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt
          grep -q "sourceContext" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskEntity.kt
          grep -q "sourceRefresher" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "consumeSourceExpiryFailure" app/src/main/kotlin/com/yunx/app/data/download/ChunkDownloader.kt

      - name: 检查关键资源
        shell: bash
        run: |
          test -s app/src/main/res/drawable/icon.png
          test -s app/src/main/res/drawable/icon2.png
          test -s app/src/main/res/drawable/weixin.png

      - name: 应用第四批下载优化
        shell: bash
        run: python3 .github/scripts/apply-download-batch4.py

      - name: 检查修改
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat
          grep -q "REFRESH_SKEW_MS" app/src/main/kotlin/com/yunx/app/data/download/DownloadSourceRefresh.kt
          grep -q 'tryRefreshSource(id, "redownload")' app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q 'dao.updateManualPaused(id, false)' app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "proactivelyRefreshesNearExpiry" app/src/test/kotlin/com/yunx/app/data/download/DownloadSourceRefreshPolicyTest.kt

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: 生成结果说明
        shell: bash
        run: |
          mkdir -p batch4-result
          cp app/build/outputs/apk/debug/app-debug.apk batch4-result/星辰助手-下载优化第四批-test.apk
          cat > batch4-result/REPORT.md <<'EOF'
          # 星辰助手下载优化第四批

          本批重点完善“恢复 / 重新下载 / 临时直链将过期”场景：

          - 已完成任务点击“重新下载”时，个人网盘旧直链失效会自动重新取链
          - 已知过期时间的临时直链提前 60 秒刷新，减少刚开始分片就 403 的情况
          - 用户点击开始/恢复时清除 manualPaused，避免暂停状态残留
          - 开始/恢复时清除旧 errorMsg，避免任务已经正常运行仍显示上一次错误
          - 自动刷新仍只用于 sourceType=cloud 的个人网盘来源
          - 分享链接缺少完整分享会话时保持安全失败，不冒险重建
          - 延续第三批的刷新次数上限、文件大小一致性保护和断点续传

          单元测试、Lint、Debug APK 构建全部通过后才会提交。
          EOF

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Download-Optimization-Batch4
          path: batch4-result/**
          if-no-files-found: error
          retention-days: 14

      - name: 提交修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main app/src/test

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "feat: harden cloud download resume and redownload"
          git push origin HEAD:main
