name: Apply Second Batch Optimizations

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: apply-second-batch-optimizations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply account health and history management
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, found {count}"
                  )

              print(f"OK: {label}")

              return text.replace(
                  old,
                  new,
                  1
              )

          def replace_regex(
              text,
              pattern,
              replacement,
              label,
              flags=0
          ):
              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=flags
              )

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, found {count}"
                  )

              print(f"OK: {label}")

              return updated

          # ============================================================
          # 1. 解析历史：
          #    - 最多 30 条
          #    - 支持单条删除
          # ============================================================

          history_path = Path(
              "app/src/main/kotlin/com/yunx/app/data/prefs/"
              "ResolveHistoryRepository.kt"
          )

          history = history_path.read_text(
              encoding="utf-8"
          )

          history = replace_regex(
              history,
              r'''
              (\n\s*fun\s+clear\(\)\s*\{)
              ''',
              '''
              \n    fun remove(
                  item: ResolveHistoryItem
              ): List<ResolveHistoryItem> {
                  val updated = load().filterNot {
                      it.platformName == item.platformName &&
                          it.shareId == item.shareId
                  }

                  save(updated)

                  return updated
              }

              \\1
              ''',
              "Add history remove()",
              re.VERBOSE
          )

          history = replace_regex(
              history,
              r'''
              const\s+val\s+MAX_HISTORY\s*=\s*
              10
              ''',
              '''const val MAX_HISTORY =
                      30''',
              "Increase history limit to 30",
              re.VERBOSE
          )

          history_path.write_text(
              history,
              encoding="utf-8"
          )

          # ============================================================
          # 2. DriveQuotaViewModel：
          #    使用现有容量接口检测账号健康状态
          # ============================================================

          quota_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
              "DriveQuotaViewModel.kt"
          )

          quota_code = r'''package com.yunx.app.ui.viewmodel

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.viewModelScope
          import com.yunx.app.data.network.BaiduApi
          import com.yunx.app.data.network.C139Api
          import com.yunx.app.data.network.Pan123Api
          import com.yunx.app.data.network.QuarkApi
          import com.yunx.app.data.network.UCApi
          import com.yunx.app.data.network.XunleiApi
          import com.yunx.app.data.network.model.QuotaInfo
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch

          /**
           * 已保存登录凭证的检测状态。
           *
           * SUSPECT 表示接口检测失败。
           * 可能是登录凭证失效，也可能只是临时网络或网盘接口异常，
           * 因此不会自动删除账号或退出登录。
           */
          enum class DriveLoginState {
              LOGGED_OUT,
              CHECKING,
              HEALTHY,
              SUSPECT
          }

          /**
           * 网盘容量与账号健康检测。
           *
           * 六个平台并发检测，互不阻塞。
           */
          class DriveQuotaViewModel(
              private val quarkApi: QuarkApi,
              private val quarkCookie: suspend () -> String?,
              private val ucApi: UCApi,
              private val ucCookie: suspend () -> String?,
              private val xunleiApi: XunleiApi,
              private val xunleiToken: suspend () -> String?,
              private val xunleiDeviceId: suspend () -> String?,
              private val xunleiCaptcha: suspend () -> String?,
              private val baiduApi: BaiduApi,
              private val baiduCookie: suspend () -> String?,
              private val c139Api: C139Api,
              private val c139Cookie: suspend () -> String?,
              private val pan123Api: Pan123Api,
              private val pan123Token: suspend () -> String?
          ) : ViewModel() {

              private val _quarkQuota =
                  MutableStateFlow<QuotaInfo?>(null)

              val quarkQuota: StateFlow<QuotaInfo?> =
                  _quarkQuota.asStateFlow()

              private val _ucQuota =
                  MutableStateFlow<QuotaInfo?>(null)

              val ucQuota: StateFlow<QuotaInfo?> =
                  _ucQuota.asStateFlow()

              private val _xunleiQuota =
                  MutableStateFlow<QuotaInfo?>(null)

              val xunleiQuota: StateFlow<QuotaInfo?> =
                  _xunleiQuota.asStateFlow()

              private val _baiduQuota =
                  MutableStateFlow<QuotaInfo?>(null)

              val baiduQuota: StateFlow<QuotaInfo?> =
                  _baiduQuota.asStateFlow()

              private val _c139Quota =
                  MutableStateFlow<QuotaInfo?>(null)

              val c139Quota: StateFlow<QuotaInfo?> =
                  _c139Quota.asStateFlow()

              private val _pan123Quota =
                  MutableStateFlow<QuotaInfo?>(null)

              val pan123Quota: StateFlow<QuotaInfo?> =
                  _pan123Quota.asStateFlow()

              private val _quarkLoginState =
                  MutableStateFlow(
                      DriveLoginState.LOGGED_OUT
                  )

              val quarkLoginState =
                  _quarkLoginState.asStateFlow()

              private val _ucLoginState =
                  MutableStateFlow(
                      DriveLoginState.LOGGED_OUT
                  )

              val ucLoginState =
                  _ucLoginState.asStateFlow()

              private val _xunleiLoginState =
                  MutableStateFlow(
                      DriveLoginState.LOGGED_OUT
                  )

              val xunleiLoginState =
                  _xunleiLoginState.asStateFlow()

              private val _baiduLoginState =
                  MutableStateFlow(
                      DriveLoginState.LOGGED_OUT
                  )

              val baiduLoginState =
                  _baiduLoginState.asStateFlow()

              private val _c139LoginState =
                  MutableStateFlow(
                      DriveLoginState.LOGGED_OUT
                  )

              val c139LoginState =
                  _c139LoginState.asStateFlow()

              private val _pan123LoginState =
                  MutableStateFlow(
                      DriveLoginState.LOGGED_OUT
                  )

              val pan123LoginState =
                  _pan123LoginState.asStateFlow()

              /** 是否正在刷新。 */
              val loading =
                  MutableStateFlow(false)

              /**
               * 并发检测全部平台。
               *
               * 没有保存凭证的平台显示未登录；
               * 有凭证但接口调用失败的平台显示“登录可能已失效”。
               */
              fun loadAll() {
                  if (loading.value) {
                      return
                  }

                  loading.value = true

                  viewModelScope.launch {
                      try {
                          coroutineScope {
                              // 夸克
                              launch {
                                  val cookie =
                                      runCatching {
                                          quarkCookie()
                                      }.getOrNull()

                                  if (cookie.isNullOrBlank()) {
                                      _quarkQuota.value =
                                          null

                                      _quarkLoginState.value =
                                          DriveLoginState.LOGGED_OUT

                                      return@launch
                                  }

                                  _quarkLoginState.value =
                                      DriveLoginState.CHECKING

                                  runCatching {
                                      quarkApi.getQuota(
                                          cookie
                                      )
                                  }.onSuccess {
                                      _quarkQuota.value =
                                          it

                                      _quarkLoginState.value =
                                          DriveLoginState.HEALTHY
                                  }.onFailure {
                                      _quarkQuota.value =
                                          null

                                      _quarkLoginState.value =
                                          DriveLoginState.SUSPECT
                                  }
                              }

                              // UC
                              launch {
                                  val cookie =
                                      runCatching {
                                          ucCookie()
                                      }.getOrNull()

                                  if (cookie.isNullOrBlank()) {
                                      _ucQuota.value =
                                          null

                                      _ucLoginState.value =
                                          DriveLoginState.LOGGED_OUT

                                      return@launch
                                  }

                                  _ucLoginState.value =
                                      DriveLoginState.CHECKING

                                  runCatching {
                                      ucApi.getQuota(
                                          cookie
                                      )
                                  }.onSuccess {
                                      _ucQuota.value =
                                          it

                                      _ucLoginState.value =
                                          DriveLoginState.HEALTHY
                                  }.onFailure {
                                      _ucQuota.value =
                                          null

                                      _ucLoginState.value =
                                          DriveLoginState.SUSPECT
                                  }
                              }

                              // 迅雷
                              launch {
                                  val token =
                                      runCatching {
                                          xunleiToken()
                                      }.getOrNull()

                                  if (token.isNullOrBlank()) {
                                      _xunleiQuota.value =
                                          null

                                      _xunleiLoginState.value =
                                          DriveLoginState.LOGGED_OUT

                                      return@launch
                                  }

                                  _xunleiLoginState.value =
                                      DriveLoginState.CHECKING

                                  val deviceId =
                                      runCatching {
                                          xunleiDeviceId()
                                      }.getOrNull()
                                          .orEmpty()

                                  val captcha =
                                      runCatching {
                                          xunleiCaptcha()
                                      }.getOrNull()
                                          .orEmpty()

                                  runCatching {
                                      xunleiApi.getQuota(
                                          token,
                                          deviceId,
                                          captcha
                                      )
                                  }.onSuccess {
                                      _xunleiQuota.value =
                                          it

                                      _xunleiLoginState.value =
                                          DriveLoginState.HEALTHY
                                  }.onFailure {
                                      _xunleiQuota.value =
                                          null

                                      _xunleiLoginState.value =
                                          DriveLoginState.SUSPECT
                                  }
                              }

                              // 百度
                              launch {
                                  val cookie =
                                      runCatching {
                                          baiduCookie()
                                      }.getOrNull()

                                  if (cookie.isNullOrBlank()) {
                                      _baiduQuota.value =
                                          null

                                      _baiduLoginState.value =
                                          DriveLoginState.LOGGED_OUT

                                      return@launch
                                  }

                                  _baiduLoginState.value =
                                      DriveLoginState.CHECKING

                                  runCatching {
                                      baiduApi.getQuota(
                                          cookie
                                      )
                                  }.onSuccess {
                                      _baiduQuota.value =
                                          it

                                      _baiduLoginState.value =
                                          DriveLoginState.HEALTHY
                                  }.onFailure {
                                      _baiduQuota.value =
                                          null

                                      _baiduLoginState.value =
                                          DriveLoginState.SUSPECT
                                  }
                              }

                              // 移动云盘
                              launch {
                                  val cookie =
                                      runCatching {
                                          c139Cookie()
                                      }.getOrNull()

                                  if (cookie.isNullOrBlank()) {
                                      _c139Quota.value =
                                          null

                                      _c139LoginState.value =
                                          DriveLoginState.LOGGED_OUT

                                      return@launch
                                  }

                                  _c139LoginState.value =
                                      DriveLoginState.CHECKING

                                  runCatching {
                                      c139Api.getQuota(
                                          cookie
                                      )
                                  }.onSuccess {
                                      _c139Quota.value =
                                          it

                                      _c139LoginState.value =
                                          DriveLoginState.HEALTHY
                                  }.onFailure {
                                      _c139Quota.value =
                                          null

                                      _c139LoginState.value =
                                          DriveLoginState.SUSPECT
                                  }
                              }

                              // 123 云盘
                              launch {
                                  val token =
                                      runCatching {
                                          pan123Token()
                                      }.getOrNull()

                                  if (token.isNullOrBlank()) {
                                      _pan123Quota.value =
                                          null

                                      _pan123LoginState.value =
                                          DriveLoginState.LOGGED_OUT

                                      return@launch
                                  }

                                  _pan123LoginState.value =
                                      DriveLoginState.CHECKING

                                  runCatching {
                                      pan123Api.getQuota(
                                          token
                                      )
                                  }.onSuccess {
                                      _pan123Quota.value =
                                          it

                                      _pan123LoginState.value =
                                          DriveLoginState.HEALTHY
                                  }.onFailure {
                                      _pan123Quota.value =
                                          null

                                      _pan123LoginState.value =
                                          DriveLoginState.SUSPECT
                                  }
                              }
                          }
                      } finally {
                          loading.value =
                              false
                      }
                  }
              }

              class Factory(
                  private val quarkApi: QuarkApi,
                  private val quarkCookie:
                      suspend () -> String?,
                  private val ucApi: UCApi,
                  private val ucCookie:
                      suspend () -> String?,
                  private val xunleiApi: XunleiApi,
                  private val xunleiToken:
                      suspend () -> String?,
                  private val xunleiDeviceId:
                      suspend () -> String?,
                  private val xunleiCaptcha:
                      suspend () -> String?,
                  private val baiduApi: BaiduApi,
                  private val baiduCookie:
                      suspend () -> String?,
                  private val c139Api: C139Api,
                  private val c139Cookie:
                      suspend () -> String?,
                  private val pan123Api: Pan123Api,
                  private val pan123Token:
                      suspend () -> String?
              ) : ViewModelProvider.Factory {

                  @Suppress("UNCHECKED_CAST")
                  override fun <T : ViewModel> create(
                      modelClass: Class<T>
                  ): T =
                      DriveQuotaViewModel(
                          quarkApi,
                          quarkCookie,
                          ucApi,
                          ucCookie,
                          xunleiApi,
                          xunleiToken,
                          xunleiDeviceId,
                          xunleiCaptcha,
                          baiduApi,
                          baiduCookie,
                          c139Api,
                          c139Cookie,
                          pan123Api,
                          pan123Token
                      ) as T
              }
          }
          '''

          quota_path.write_text(
              quota_code,
              encoding="utf-8"
          )

          print(
              "OK: DriveQuotaViewModel account health"
          )

          # ============================================================
          # 3. DriveScreen：
          #    卡片显示 检测中 / 状态正常 / 登录可能已失效
          # ============================================================

          drive_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "DriveScreen.kt"
          )

          drive = drive_path.read_text(
              encoding="utf-8"
          )

          drive = replace_exact(
              drive,
              "import com.yunx.app.ui.viewmodel.DriveQuotaViewModel\n",
              "import com.yunx.app.ui.viewmodel.DriveLoginState\n"
              "import com.yunx.app.ui.viewmodel.DriveQuotaViewModel\n",
              "Import DriveLoginState"
          )

          refresh_anchor = (
              "    val isRefreshing by "
              "driveQuotaViewModel.loading.collectAsState()\n"
          )

          health_collectors = r'''

              val quarkLoginState by
                  driveQuotaViewModel
                      .quarkLoginState
                      .collectAsState()

              val ucLoginState by
                  driveQuotaViewModel
                      .ucLoginState
                      .collectAsState()

              val xunleiLoginState by
                  driveQuotaViewModel
                      .xunleiLoginState
                      .collectAsState()

              val baiduLoginState by
                  driveQuotaViewModel
                      .baiduLoginState
                      .collectAsState()

              val c139LoginState by
                  driveQuotaViewModel
                      .c139LoginState
                      .collectAsState()

              val pan123LoginState by
                  driveQuotaViewModel
                      .pan123LoginState
                      .collectAsState()
          '''

          drive = replace_exact(
              drive,
              refresh_anchor,
              refresh_anchor +
                  health_collectors,
              "Collect account health states"
          )

          quota_state_pairs = {
              "quarkQuota": "quarkLoginState",
              "ucQuota": "ucLoginState",
              "xunleiQuota": "xunleiLoginState",
              "baiduQuota": "baiduLoginState",
              "c139Quota": "c139LoginState",
              "pan123Quota": "pan123LoginState",
          }

          for quota_name, state_name in quota_state_pairs.items():
              pattern = (
                  rf'(?P<indent>[ \t]*)'
                  rf'quota\s*=\s*'
                  rf'driveQuotaViewModel\.'
                  rf'{quota_name}'
                  rf'\.collectAsState\(\)\.value,'
              )

              replacement = (
                  rf'\g<indent>quota = '
                  rf'driveQuotaViewModel.'
                  rf'{quota_name}'
                  rf'.collectAsState().value,\n'
                  rf'\g<indent>loginState = '
                  rf'{state_name},'
              )

              drive = replace_regex(
                  drive,
                  pattern,
                  replacement,
                  f"Inject {state_name}"
              )

          # DriveAccountCard 增加 loginState 参数
          drive = replace_regex(
              drive,
              r'''
              (private\s+fun\s+DriveAccountCard\(
              \s*account:\s*DriveAccount,
              [\s\S]*?
              \s*quota:\s*QuotaInfo\?\s*=\s*null,)
              ''',
              r'''\1
              loginState: DriveLoginState =
                  if (account.isLoggedIn) {
                      DriveLoginState.CHECKING
                  } else {
                      DriveLoginState.LOGGED_OUT
                  },''',
              "DriveAccountCard loginState parameter",
              re.VERBOSE
          )

          # 向 DriveAccountCardContent 传递 loginState
          drive = replace_regex(
              drive,
              r'''
              (
              DriveAccountCardContent\(
              \s*account\s*=\s*account,
              \s*quota\s*=\s*quota,
              )
              ''',
              r'''\1
                  loginState = loginState,''',
              "Pass loginState to DriveAccountCardContent",
              re.VERBOSE
          )

          # DriveAccountCardContent 增加参数
          drive = replace_regex(
              drive,
              r'''
              (
              private\s+fun\s+DriveAccountCardContent\(
              \s*account:\s*DriveAccount,
              \s*quota:\s*QuotaInfo\?\s*=\s*null,
              )
              ''',
              r'''\1
              loginState: DriveLoginState,''',
              "DriveAccountCardContent loginState parameter",
              re.VERBOSE
          )

          # 在账号描述后加入健康状态
          description_pattern = r'''
              (
              Text\(
              \s*text\s*=\s*account\.description,
              \s*style\s*=\s*
                  MaterialTheme\.typography\.bodyMedium,
              \s*color\s*=\s*
                  MaterialTheme\.colorScheme\.onSurfaceVariant
              \s*\)
              )
              (?P<after>
              \s*//\s*已登录且有空间数据
              )
          '''

          health_ui = r'''\1

              if (account.isLoggedIn) {
                  Spacer(
                      modifier =
                          Modifier.height(3.dp)
                  )

                  val healthText =
                      when (loginState) {
                          DriveLoginState.CHECKING ->
                              "● 检测中"

                          DriveLoginState.HEALTHY ->
                              "● 状态正常"

                          DriveLoginState.SUSPECT ->
                              "● 登录可能已失效"

                          DriveLoginState.LOGGED_OUT ->
                              "● 未登录"
                      }

                  Text(
                      text = healthText,
                      style =
                          MaterialTheme
                              .typography
                              .labelSmall,
                      color =
                          when (loginState) {
                              DriveLoginState.HEALTHY ->
                                  MaterialTheme
                                      .colorScheme
                                      .primary

                              DriveLoginState.SUSPECT ->
                                  MaterialTheme
                                      .colorScheme
                                      .error

                              else ->
                                  MaterialTheme
                                      .colorScheme
                                      .onSurfaceVariant
                          }
                  )
              }
              \g<after>'''

          drive = replace_regex(
              drive,
              description_pattern,
              health_ui,
              "Add account health UI",
              re.VERBOSE
          )

          drive_path.write_text(
              drive,
              encoding="utf-8"
          )

          # ============================================================
          # 4. ResolveScreen：
          #    - 查看全部
          #    - 搜索历史
          #    - 单条删除
          #    - 再次解析
          #    - 清空全部
          # ============================================================

          resolve_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "ResolveScreen.kt"
          )

          resolve = resolve_path.read_text(
              encoding="utf-8"
          )

          # heightIn
          resolve = replace_exact(
              resolve,
              "import androidx.compose.foundation.layout.height\n",
              "import androidx.compose.foundation.layout.height\n"
              "import androidx.compose.foundation.layout.heightIn\n",
              "Import heightIn"
          )

          # 图标
          resolve = replace_exact(
              resolve,
              "import androidx.compose.material.icons.outlined.ContentPaste\n"
              "import androidx.compose.material.icons.outlined.ErrorOutline\n",
              "import androidx.compose.material.icons.outlined.ContentPaste\n"
              "import androidx.compose.material.icons.outlined.Delete\n"
              "import androidx.compose.material.icons.outlined.ErrorOutline\n"
              "import androidx.compose.material.icons.outlined.Search\n",
              "Import history icons"
          )

          # 历史管理窗口状态
          resolve = replace_regex(
              resolve,
              r'''
              (
              var\s+recentHistory\s+by\s+remember\s*\{
              \s*mutableStateOf\(
              \s*historyRepository\.load\(\)
              \s*\)
              \s*\}
              )
              ''',
              r'''\1

              var showHistoryManager by remember {
                  mutableStateOf(false)
              }''',
              "Add history manager state",
              re.VERBOSE
          )

          # ResolveInputContent 调用处增加 onShowAllHistory
          resolve = replace_regex(
              resolve,
              r'''
              (
              \s*onClearHistory\s*=\s*\{
              \s*historyRepository\.clear\(\)
              )
              ''',
              r'''
                          onShowAllHistory = {
                              showHistoryManager = true
                          },

              \1''',
              "Pass onShowAllHistory",
              re.VERBOSE
          )

          # 函数参数增加 onShowAllHistory
          resolve = replace_regex(
              resolve,
              r'''
              (
              onHistorySelect:\s*\(
              \s*ResolveHistoryItem
              \s*\)\s*->\s*Unit,
              )
              (
              \s*onClearHistory:\s*\(\)\s*->\s*Unit
              )
              ''',
              r'''\1

              onShowAllHistory: () -> Unit,
              \2''',
              "ResolveInputContent onShowAllHistory parameter",
              re.VERBOSE
          )

          # “最近解析”右侧增加查看全部
          clear_button = r'''
              (
              \s*TextButton\(
              \s*onClick\s*=
              \s*onClearHistory
              \s*\)\s*\{
              \s*Text\(
              \s*"清空"
              \s*\)
              \s*\}
              )
          '''

          resolve = replace_regex(
              resolve,
              clear_button,
              r'''
                      TextButton(
                          onClick =
                              onShowAllHistory
                      ) {
                          Text(
                              "查看全部"
                          )
                      }

              \1''',
              "Add View All history button",
              re.VERBOSE
          )

          # 删除旧的“仅显示最近3条”文字
          resolve = replace_regex(
              resolve,
              r'''
              \s*if\s*\(
              \s*recentHistory\.size\s*>\s*3
              \s*\)\s*\{
              \s*Text\(
              \s*text\s*=
              \s*"仅显示最近\s+3\s+条，共\s+\$\{recentHistory\.size\}\s+条记录",
              [\s\S]*?
              \s*\)
              \s*\}
              ''',
              "\n",
              "Remove old recent-history hint",
              re.VERBOSE
          )

          # 在获取下载链接弹窗之前挂载历史管理窗口
          load_dialog_marker = r'''
              // -----------------------------
              // 获取下载链接加载弹窗
              // -----------------------------
          '''

          history_manager_call = r'''    if (showHistoryManager) {
              HistoryManagerDialog(
                  items = recentHistory,

                  onSelect = { item ->
                      showHistoryManager =
                          false

                      link =
                          item.link

                      pwd =
                          item.password

                      pwdEdited =
