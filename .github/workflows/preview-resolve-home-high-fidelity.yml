name: Preview Resolve Home High Fidelity

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  apply:
    name: Apply high fidelity resolve home
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Redesign resolve home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------
          # Imports
          # --------------------------------------------------

          extra_icon_imports = (
              "import androidx.compose.material.icons.outlined.ChevronRight\n"
              "import androidx.compose.material.icons.outlined.History\n"
              "import androidx.compose.material.icons.outlined.Lock\n"
          )

          if (
              "import androidx.compose.material.icons.outlined.History\n"
              not in text
          ):
              anchor = (
                  "import androidx.compose.material.icons.outlined.Link\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "Link icon import not found"
                  )

              text = text.replace(
                  anchor,
                  anchor + extra_icon_imports,
                  1,
              )

          if (
              "import androidx.compose.material3.HorizontalDivider\n"
              not in text
          ):
              anchor = (
                  "import androidx.compose.material3.IconButton\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "IconButton import not found"
                  )

              text = text.replace(
                  anchor,
                  anchor
                  + "import androidx.compose.material3.HorizontalDivider\n",
                  1,
              )

          if (
              "import androidx.compose.foundation.shape.RoundedCornerShape\n"
              not in text
          ):
              anchor = (
                  "import androidx.compose.foundation.rememberScrollState\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "rememberScrollState import not found"
                  )

              text = text.replace(
                  anchor,
                  anchor
                  + "import androidx.compose.foundation.shape.RoundedCornerShape\n",
                  1,
              )

          # --------------------------------------------------
          # Replace ResolveInputContent
          # --------------------------------------------------

          start_marker = (
              "@OptIn(ExperimentalMaterial3Api::class)\n"
              "@Composable\n"
              "private fun ResolveInputContent("
          )

          end_marker = (
              "/**\n"
              " * 将解析时间转换为简短的相对时间。\n"
              " */"
          )

          if start_marker not in text:
              raise SystemExit(
                  "ResolveInputContent start marker not found"
              )

          if end_marker not in text:
              raise SystemExit(
                  "ResolveInputContent end marker not found"
              )

          start = text.index(start_marker)
          end = text.index(
              end_marker,
              start,
          )

          new_input = textwrap.dedent(
              r'''
              @Suppress("UNUSED_PARAMETER")
              @OptIn(ExperimentalMaterial3Api::class)
              @Composable
              private fun ResolveInputContent(
                  scrollBehavior: TopAppBarScrollBehavior,
                  state: ResolveUiState,

                  link: String,
                  onLinkChange: (String) -> Unit,

                  pwd: String,
                  onPwdChange: (String) -> Unit,

                  onClearLink: () -> Unit,
                  onClearPwd: () -> Unit,

                  onPasteClipboard: () -> Unit,

                  recentHistory: List<ResolveHistoryItem>,

                  onStartResolve: (
                      String,
                      String?
                  ) -> Unit,

                  onHistorySelect: (
                      ResolveHistoryItem
                  ) -> Unit,

                  onShowAllHistory: () -> Unit,

                  onClearHistory: () -> Unit
              ) {
                  val isLoading =
                      state is ResolveUiState.Loading

                  Column(
                      modifier =
                          Modifier
                              .fillMaxSize()
                              .nestedScroll(
                                  scrollBehavior
                                      .nestedScrollConnection
                              )
                              .verticalScroll(
                                  rememberScrollState()
                              )
                              .padding(
                                  horizontal = 16.dp,
                                  vertical = 14.dp
                              ),

                      verticalArrangement =
                          Arrangement.spacedBy(
                              20.dp
                          )
                  ) {

                      // ==================================================
                      // 主解析卡片
                      // ==================================================

                      Card(
                          modifier =
                              Modifier.fillMaxWidth(),

                          shape =
                              RoundedCornerShape(
                                  28.dp
                              ),

                          colors =
                              CardDefaults.cardColors(
                                  containerColor =
                                      MaterialTheme
                                          .colorScheme
                                          .surfaceContainerLow
                              ),

                          elevation =
                              CardDefaults.cardElevation(
                                  defaultElevation =
                                      2.dp
                              )
                      ) {
                          Column(
                              modifier =
                                  Modifier.padding(
                                      horizontal = 18.dp,
                                      vertical = 20.dp
                                  ),

                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      16.dp
                                  )
                          ) {

                              // ------------------------------------------
                              // 分享链接标题
                              // ------------------------------------------

                              Row(
                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  verticalAlignment =
                                      Alignment.CenterVertically
                              ) {

                                  Box(
                                      modifier =
                                          Modifier.size(
                                              42.dp
                                          ),

                                      contentAlignment =
                                          Alignment.Center
                                  ) {
                                      Card(
                                          shape =
                                              RoundedCornerShape(
                                                  14.dp
                                              ),

                                          colors =
                                              CardDefaults.cardColors(
                                                  containerColor =
                                                      MaterialTheme
                                                          .colorScheme
                                                          .primaryContainer
                                              )
                                      ) {
                                          Box(
                                              modifier =
                                                  Modifier.size(
                                                      42.dp
                                                  ),

                                              contentAlignment =
                                                  Alignment.Center
                                          ) {
                                              Icon(
                                                  imageVector =
                                                      Icons.Outlined.Link,

                                                  contentDescription =
                                                      null,

                                                  tint =
                                                      MaterialTheme
                                                          .colorScheme
                                                          .primary,

                                                  modifier =
                                                      Modifier.size(
                                                          23.dp
                                                      )
                                              )
                                          }
                                      }
                                  }

                                  Spacer(
                                      modifier =
                                          Modifier.width(
                                              12.dp
                                          )
                                  )

                                  Text(
                                      text =
                                          "分享链接",

                                      style =
                                          MaterialTheme
                                              .typography
                                              .titleLarge,

                                      fontWeight =
                                          FontWeight.SemiBold
                                  )
                              }

                              // ------------------------------------------
                              // 链接大输入区
                              // ------------------------------------------

                              Box(
                                  modifier =
                                      Modifier.fillMaxWidth()
                              ) {
                                  OutlinedTextField(
                                      value =
                                          link,

                                      onValueChange =
                                          onLinkChange,

                                      modifier =
                                          Modifier
                                              .fillMaxWidth()
                                              .heightIn(
                                                  min = 160.dp
                                              ),

                                      placeholder = {
                                          Text(
                                              text =
                                                  "粘贴网盘分享链接……",

                                              style =
                                                  MaterialTheme
                                                      .typography
                                                      .bodyLarge,

                                              color =
                                                  MaterialTheme
                                                      .colorScheme
                                                      .onSurfaceVariant
                                          )
                                      },

                                      trailingIcon = {
                                          if (
                                              link.isNotEmpty()
                                          ) {
                                              IconButton(
                                                  onClick =
                                                      onClearLink
                                              ) {
                                                  Icon(
                                                      imageVector =
                                                          Icons.Filled.Close,

                                                      contentDescription =
                                                          "清空链接"
                                                  )
                                              }
                                          }
                                      },

                                      minLines = 5,
                                      maxLines = 7,

                                      shape =
                                          RoundedCornerShape(
                                              22.dp
                                          )
                                  )
                              }

                              // ------------------------------------------
                              // 粘贴按钮
                              // ------------------------------------------

                              Row(
                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  horizontalArrangement =
                                      Arrangement.End,

                                  verticalAlignment =
                                      Alignment.CenterVertically
                              ) {
                                  FilledTonalButton(
                                      onClick =
                                          onPasteClipboard,

                                      shape =
                                          RoundedCornerShape(
                                              18.dp
                                          )
                                  ) {
                                      Icon(
                                          imageVector =
                                              Icons.Outlined.ContentPaste,

                                          contentDescription =
                                              null,

                                          modifier =
                                              Modifier.size(
                                                  18.dp
                                              )
                                      )

                                      Spacer(
                                          modifier =
                                              Modifier.width(
                                                  6.dp
                                              )
                                      )

                                      Text(
                                          text =
                                              "粘贴",

                                          fontWeight =
                                              FontWeight.Medium
                                      )
                                  }
                              }

                              // ------------------------------------------
                              // 提取码
                              // ------------------------------------------

                              OutlinedTextField(
                                  value =
                                      pwd,

                                  onValueChange =
                                      onPwdChange,

                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  leadingIcon = {
                                      Icon(
                                          imageVector =
                                              Icons.Outlined.Lock,

                                          contentDescription =
                                              null
                                      )
                                  },

                                  label = {
                                      Text(
                                          "提取码（可选）"
                                      )
                                  },

                                  placeholder = {
                                      Text(
                                          "自动识别，可手动修改"
                                      )
                                  },

                                  trailingIcon = {
                                      if (
                                          pwd.isNotEmpty()
                                      ) {
                                          IconButton(
                                              onClick =
                                                  onClearPwd
                                          ) {
                                              Icon(
                                                  imageVector =
                                                      Icons.Filled.Close,

                                                  contentDescription =
                                                      "清空提取码"
                                              )
                                          }
                                      }
                                  },

                                  singleLine = true,

                                  shape =
                                      RoundedCornerShape(
                                          20.dp
                                      )
                              )

                              // ------------------------------------------
                              // 开始解析
                              // ------------------------------------------

                              Button(
                                  onClick = {
                                      onStartResolve(
                                          link,
                                          pwd.ifBlank {
                                              null
                                          }
                                      )
                                  },

                                  modifier =
                                      Modifier
                                          .fillMaxWidth()
                                          .height(
                                              58.dp
                                          ),

                                  enabled =
                                      link.isNotBlank() &&
                                          !isLoading,

                                  shape =
                                      RoundedCornerShape(
                                          20.dp
                                      )
                              ) {
                                  if (
                                      isLoading
                                  ) {
                                      CircularProgressIndicator(
                                          modifier =
                                              Modifier.size(
                                                  20.dp
                                              ),

                                          strokeWidth =
                                              2.dp
                                      )

                                      Spacer(
                                          modifier =
                                              Modifier.width(
                                                  10.dp
                                              )
                                      )

                                      Text(
                                          text =
                                              "解析中…",

                                          style =
                                              MaterialTheme
                                                  .typography
                                                  .titleMedium,

                                          fontWeight =
                                              FontWeight.SemiBold
                                      )
                                  } else {
                                      Text(
                                          text =
                                              "开始解析",

                                          style =
                                              MaterialTheme
                                                  .typography
                                                  .titleMedium,

                                          fontWeight =
                                              FontWeight.SemiBold
                                      )

                                      Spacer(
                                          modifier =
                                              Modifier.width(
                                                  8.dp
                                              )
                                      )

                                      Text(
                                          text =
                                              "→",

                                          style =
                                              MaterialTheme
                                                  .typography
                                                  .titleLarge
                                      )
                                  }
                              }
                          }
                      }

                      // ==================================================
                      // 错误提示
                      // ==================================================

                      if (
                          state is
                              ResolveUiState.Error
                      ) {
                          Card(
                              modifier =
                                  Modifier.fillMaxWidth(),

                              shape =
                                  RoundedCornerShape(
                                      20.dp
                                  ),

                              colors =
                                  CardDefaults.cardColors(
                                      containerColor =
                                          MaterialTheme
                                              .colorScheme
                                              .errorContainer
                                  )
                          ) {
                              Row(
                                  modifier =
                                      Modifier.padding(
                                          14.dp
                                      ),

                                  verticalAlignment =
                                      Alignment.CenterVertically
                              ) {
                                  Icon(
                                      imageVector =
                                          Icons.Outlined.ErrorOutline,

                                      contentDescription =
                                          null,

                                      tint =
                                          MaterialTheme
                                              .colorScheme
                                              .onErrorContainer
                                  )

                                  Spacer(
                                      modifier =
                                          Modifier.width(
                                              10.dp
                                          )
                                  )

                                  Text(
                                      text =
                                          state.message,

                                      style =
                                          MaterialTheme
                                              .typography
                                              .bodyMedium,

                                      color =
                                          MaterialTheme
                                              .colorScheme
                                              .onErrorContainer
                                  )
                              }
                          }
                      }

                      // ==================================================
                      // 最近解析
                      // ==================================================

                      if (
                          recentHistory.isNotEmpty()
                      ) {

                          Column(
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      10.dp
                                  )
                          ) {

                              Row(
                                  modifier =
                                      Modifier.fillMaxWidth(),

                                  verticalAlignment =
                                      Alignment.CenterVertically
                              ) {

                                  Icon(
                                      imageVector =
                                          Icons.Outlined.History,

                                      contentDescription =
                                          null,

                                      tint =
                                          MaterialTheme
                                              .colorScheme
                                              .onSurfaceVariant,

                                      modifier =
                                          Modifier.size(
                                              23.dp
                                          )
                                  )

                                  Spacer(
                                      modifier =
                                          Modifier.width(
                                              9.dp
                                          )
                                  )

                                  Text(
                                      text =
                                          "最近解析",

                                      modifier =
                                          Modifier.weight(
                                              1f
                                          ),

                                      style =
                                          MaterialTheme
                                              .typography
                                              .titleLarge,

                                      fontWeight =
                                          FontWeight.SemiBold
                                  )

                                  TextButton(
                                      onClick =
                                          onShowAllHistory
                                  ) {
                                      Text(
                                          text =
                                              "查看全部",

                                          fontWeight =
                                              FontWeight.Medium
                                      )

                                      Spacer(
                                          modifier =
                                              Modifier.width(
                                                  2.dp
                                              )
                                      )

                                      Icon(
                                          imageVector =
                                              Icons.Outlined.ChevronRight,

                                          contentDescription =
                                              null,

                                          modifier =
                                              Modifier.size(
                                                  18.dp
                                              )
                                      )
                                  }
                              }

                              RecentHistoryCard(
                                  items =
                                      recentHistory.take(
                                          2
                                      ),

                                  onItemClick =
                                      onHistorySelect
                              )
                          }
                      } else {

                          // 没有历史时保持干净，不再展示支持平台卡片
                          Text(
                              text =
                                  "解析过的分享链接会显示在这里",

                              style =
                                  MaterialTheme
                                      .typography
                                      .bodySmall,

                              color =
                                  MaterialTheme
                                      .colorScheme
                                      .onSurfaceVariant,

                              modifier =
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(
                                          horizontal = 4.dp,
                                          vertical = 2.dp
                                      )
                          )
                      }

                      Spacer(
                          modifier =
                              Modifier.height(
                                  8.dp
                              )
                      )
                  }
              }


              @Composable
              private fun RecentHistoryCard(
                  items: List<ResolveHistoryItem>,
                  onItemClick: (
                      ResolveHistoryItem
                  ) -> Unit
              ) {
                  Card(
                      modifier =
                          Modifier.fillMaxWidth(),

                      shape =
                          RoundedCornerShape(
                              26.dp
                          ),

                      colors =
                          CardDefaults.cardColors(
                              containerColor =
                                  MaterialTheme
                                      .colorScheme
                                      .surfaceContainerLow
                          ),

                      elevation =
                          CardDefaults.cardElevation(
                              defaultElevation =
                                  1.dp
                          )
                  ) {
                      Column(
                          modifier =
                              Modifier.fillMaxWidth()
                      ) {
                          items.forEachIndexed {
                                  index,
                                  item ->

                              RecentHistoryRow(
                                  item =
                                      item,

                                  onClick = {
                                      onItemClick(
                                          item
                                      )
                                  }
                              )

                              if (
                                  index <
                                      items.lastIndex
                              ) {
                                  HorizontalDivider(
                                      modifier =
                                          Modifier.padding(
                                              start = 68.dp,
                                              end = 16.dp
                                          ),

                                      color =
                                          MaterialTheme
                                              .colorScheme
                                              .outlineVariant
                                  )
                              }
                          }
                      }
                  }
              }


              @Composable
              private fun RecentHistoryRow(
                  item: ResolveHistoryItem,
                  onClick: () -> Unit
              ) {
                  Card(
                      onClick =
                          onClick,

                      modifier =
                          Modifier.fillMaxWidth(),

                      shape =
                          RoundedCornerShape(
                              0.dp
                          ),

                      colors =
                          CardDefaults.cardColors(
                              containerColor =
                                  MaterialTheme
                                      .colorScheme
                                      .surfaceContainerLow
                          ),

                      elevation =
                          CardDefaults.cardElevation(
                              defaultElevation =
                                  0.dp
                          )
                  ) {
                      Row(
                          modifier =
                              Modifier
                                  .fillMaxWidth()
                                  .padding(
                                      horizontal = 16.dp,
                                      vertical = 15.dp
                                  ),

                          verticalAlignment =
                              Alignment.CenterVertically
                      ) {

                          Card(
                              shape =
                                  RoundedCornerShape(
                                      16.dp
                                  ),

                              colors =
                                  CardDefaults.cardColors(
                                      containerColor =
                                          MaterialTheme
                                              .colorScheme
                                              .primaryContainer
                                  )
                          ) {
                              Box(
                                  modifier =
                                      Modifier.size(
                                          46.dp
                                      ),

                                  contentAlignment =
                                      Alignment.Center
                              ) {
                                  Icon(
                                      imageVector =
                                          Icons.Outlined.Link,

                                      contentDescription =
                                          null,

                                      tint =
                                          MaterialTheme
                                              .colorScheme
                                              .primary,

                                      modifier =
                                          Modifier.size(
                                              24.dp
                                          )
                                  )
                              }
                          }

                          Spacer(
                              modifier =
                                  Modifier.width(
                                      12.dp
                                  )
                          )

                          Column(
                              modifier =
                                  Modifier.weight(
                                      1f
                                  ),

                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      3.dp
                                  )
                          ) {

                              Text(
                                  text =
                                      buildString {
                                          append(
                                              item.platformName
                                          )

                                          if (
                                              item.password
                                                  .isNotBlank()
                                          ) {
                                              append(
                                                  " · "
                                              )

                                              append(
                                                  item.password
                                              )
                                          }
                                      },

                                  style =
                                      MaterialTheme
                                          .typography
                                          .titleSmall,

                                  fontWeight =
                                      FontWeight.SemiBold,

                                  maxLines = 1,

                                  overflow =
                                      TextOverflow.Ellipsis
                              )

                              Text(
                                  text =
                                      item.link,

                                  style =
                                      MaterialTheme
                                          .typography
                                          .bodySmall,

                                  color =
                                      MaterialTheme
                                          .colorScheme
                                          .onSurfaceVariant,

                                  maxLines = 1,

                                  overflow =
                                      TextOverflow.Ellipsis
                              )

                              val historyTime =
                                  formatHistoryTime(
                                      item.timestamp
                                  )

                              if (
                                  historyTime.isNotBlank()
                              ) {
                                  Text(
                                      text =
                                          historyTime,

                                      style =
                                          MaterialTheme
                                              .typography
                                              .labelSmall,

                                      color =
                                          MaterialTheme
                                              .colorScheme
                                              .outline
                                  )
                              }
                          }

                          Spacer(
                              modifier =
                                  Modifier.width(
                                      8.dp
                                  )
                          )

                          Icon(
                              imageVector =
                                  Icons.Outlined.ChevronRight,

                              contentDescription =
                                  null,

                              tint =
                                  MaterialTheme
                                      .colorScheme
                                      .onSurfaceVariant,

                              modifier =
                                  Modifier.size(
                                      22.dp
                                  )
                          )
                      }
                  }
              }


              '''
          )

          text = (
              text[:start]
              + new_input
              + text[end:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify source diff
        shell: bash
        run: |
          git diff --check

          git diff -- \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Run Android Lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Build preview APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Preview APK:"
          ls -lh "$APK"

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Assistant-Resolve-High-Fidelity
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit redesign
        shell: bash
        run: |
          if git diff --quiet -- \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          then
            echo "No source changes to commit"
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

          git commit \
            -m "style: high fidelity resolve home redesign"

          git push \
            origin \
            HEAD:main
