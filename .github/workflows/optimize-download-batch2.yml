name: 下载优化第二批

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  optimize:
    name: 下载优化第二批
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 应用第二批下载优化
        shell: bash
        run: python3 .github/scripts/apply-download-batch2.py

      - name: 检查修改
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain             -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2"             testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain             -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2"             lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain             -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2"             assembleDebug

      - name: 生成结果说明
        shell: bash
        run: |
          mkdir -p batch2-result
          cp app/build/outputs/apk/debug/app-debug.apk batch2-result/星辰助手-下载优化第二批-test.apk
          cat > batch2-result/REPORT.md <<'EOF'
          # 星辰助手下载优化第二批

          已自动验证：
          - 解析页分享下载保存 sourceFileId + sourceType=share
          - 六个网盘页直接下载保存 sourceFileId + sourceType=cloud
          - 单文件下载确认弹窗不再丢失 fileId
          - 文件夹下载、批量下载均保存 fileId
          - 单元测试、Lint、Debug 构建全部通过后才提交

          本批完成下载任务身份链。
          下一批实现临时直链失效后的受控重新取链与恢复。
          EOF

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Download-Optimization-Batch2
          path: batch2-result/**
          if-no-files-found: error
          retention-days: 14

      - name: 提交修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/kotlin/com/yunx/app/data/download/CloudDownloadSource.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/PendingDownload.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/ResolveViewModel.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/QuarkCloudViewModel.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/UCCoudViewModel.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/XunleiCloudViewModel.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/BaiduCloudViewModel.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/C139CloudViewModel.kt             app/src/main/kotlin/com/yunx/app/ui/viewmodel/Pan123CloudViewModel.kt             app/src/test/kotlin/com/yunx/app/data/download/DownloadSourceTypeTest.kt

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "feat: persist provider file identity for downloads"
          git push origin HEAD:main
