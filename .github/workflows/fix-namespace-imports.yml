name: Fix namespace imports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update generated resource and activity imports
        shell: bash
        run: |
          find app/src -type f -name '*.kt' -exec sed -i \
            -e 's/import com\.yunx\.app\.MainActivity/import com.xingchen.assistant.MainActivity/g' \
            -e 's/import com\.yunx\.app\.R/import com.xingchen.assistant.R/g' {} +

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git commit -m "Fix imports after namespace migration"
          git push origin main
