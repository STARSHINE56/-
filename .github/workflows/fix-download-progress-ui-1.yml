name: 修复下载进度重复显示

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  fix-download-progress-ui:
    name: 修复下载进度重复 UI
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 检查当前 UI 基线
        shell: bash
        run: |
          FILE="app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          test -f "$FILE"
          grep -q 'private fun DownloadTaskCard' "$FILE"
          grep -q 'private fun taskStatusLine' "$FILE"
          grep -q 'private fun progressText' "$FILE"
          grep -q '已完成 ·' "$FILE"

      - name: 修复下载进度重复显示
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              text = text.replace(old, new, 1)

          old_status = '''private fun taskStatusLine(
              task: DownloadTaskEntity
          ): String {
              val status = when (task.status) {
                  DownloadTaskEntity.STATUS_PENDING ->
                      "等待中 · 等待其他任务"

                  DownloadTaskEntity.STATUS_PAUSED ->
                      "已暂停"

                  DownloadTaskEntity.STATUS_FAILED ->
                      "失败"

                  else ->
                      DownloadTaskEntity.statusText(
                          task.status
                      )
              }

              return if (task.totalSize > 0) {
                  // 显示值钳制到 total，避免恢复竞态导致显示超过总大小。
                  val shown = minOf(
                      task.downloadedSize,
                      task.totalSize
                  )

                  "$status · ${formatSize(shown)} / ${formatSize(task.totalSize)}"
              } else {
                  status
              }
          }
          '''

          new_status = '''private fun taskStatusLine(
              task: DownloadTaskEntity
          ): String =
              when (task.status) {
                  DownloadTaskEntity.STATUS_PENDING ->
                      "等待中 · 等待其他任务"

                  DownloadTaskEntity.STATUS_PAUSED ->
                      "已暂停"

                  DownloadTaskEntity.STATUS_FAILED ->
                      "失败"

                  else ->
                      DownloadTaskEntity.statusText(
                          task.status
                      )
              }
          '''

          replace_once(old_status, new_status, "taskStatusLine")

          old_progress = '''private fun progressText(task: DownloadTaskEntity): String {
              if (task.totalSize <= 0) return ""
              // 显示值钳制到 total（防恢复竞态残留导致显示超总大小）
              val shown = minOf(task.downloadedSize, task.totalSize)
              val percent = (shown * 100 / task.totalSize).toInt().coerceIn(0, 100)
              return "已下载 ${formatSize(shown)} / ${formatSize(task.totalSize)} · $percent%"
          }
          '''

          new_progress = '''private fun progressText(task: DownloadTaskEntity): String {
              if (task.totalSize <= 0) return ""
              val shown = minOf(task.downloadedSize, task.totalSize)
              return "${formatSize(shown)} / ${formatSize(task.totalSize)}"
          }

          private fun progressPercentText(task: DownloadTaskEntity): String {
              if (task.totalSize <= 0) return ""
              val shown = minOf(task.downloadedSize, task.totalSize)
              val percent = (shown * 100 / task.totalSize).toInt().coerceIn(0, 100)
              return "$percent%"
          }
          '''

          replace_once(old_progress, new_progress, "progressText")

          # 精确定位主任务卡底部 Row：从“已完成 · 文件大小”这段开始，直到长按菜单注释前。
          pattern = re.compile(
              r'''(?P<row>
              \s*Row\(
                  \s*modifier = Modifier\.fillMaxWidth\(\),
                  \s*verticalAlignment = Alignment\.CenterVertically
              \s*\) \{
                  \s*Text\(
                      \s*text = if \(task\.status == DownloadTaskEntity\.STATUS_COMPLETED\) \{
                          \s*"已完成 · \$\{formatSize\(task\.totalSize\)\}"
                      \s*\} else \{
                          \s*progressText\(task\)
                      \s*\},
                      \s*style = MaterialTheme\.typography\.labelSmall,
                      \s*color = MaterialTheme\.colorScheme\.onSurfaceVariant,
                      \s*modifier = Modifier\.weight\(1f\)
                  \s*\)
              \s*\})
              (?=\s*\}\s*\n\s*// 长按任务卡弹出操作菜单)
              ''',
              re.VERBOSE | re.DOTALL,
          )

          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise RuntimeError(
                  f"main task progress row regex: expected exactly 1 match, got {len(matches)}"
              )

          replacement = '''            Row(
                  modifier = Modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(
                      text = if (task.status == DownloadTaskEntity.STATUS_COMPLETED) {
                          "已完成 · ${formatSize(task.totalSize)}"
                      } else {
                          progressText(task)
                      },
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      modifier = Modifier.weight(1f)
                  )

                  if (
                      task.status != DownloadTaskEntity.STATUS_COMPLETED &&
                      task.totalSize > 0
                  ) {
                      Text(
                          text = progressPercentText(task),
                          style = MaterialTheme.typography.labelSmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                  }
              }'''

          text = pattern.sub(replacement, text, count=1)

          path.write_text(text, encoding="utf-8")
          print("Download progress UI patch applied")
          PY

      - name: 检查修改范围
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"

          if [ "$CHANGED" != "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt" ]; then
            echo "错误：本工作流只允许修改 DownloadScreen.kt"
            exit 1
          fi

          FILE="app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          grep -q 'private fun progressPercentText' "$FILE"
          grep -q 'text = progressPercentText(task)' "$FILE"
          grep -q 'return "${formatSize(shown)} / ${formatSize(task.totalSize)}"' "$FILE"

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: 上传测试 APK
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Download-Progress-UI-Fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 提交修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "fix: remove duplicated download progress UI"
          git push origin HEAD:main
