name: Migrate YunX 2026-09-04 Features

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-yunx-20260904.yml"

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout XingChen Assistant
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Fetch YunX upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote remove yunx-upstream 2>/dev/null || true
          git remote add yunx-upstream https://github.com/CYQawa/YunX.git
          git fetch --no-tags yunx-upstream edd29c107ec0272d82fc93011e113b3b837cb3ce

      - name: Migrate file browsing features
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA="edd29c107ec0272d82fc93011e113b3b837cb3ce"

          files=(
            "app/src/main/kotlin/com/yunx/app/data/network/BaiduApi.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/C139Api.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/Pan123Api.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/Pan123Constants.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/QuarkApi.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/QuarkConstants.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/UCApi.kt"
            "app/src/main/kotlin/com/yunx/app/data/network/XunleiApi.kt"
            "app/src/main/kotlin/com/yunx/app/data/repository/Pan123AccountRepository.kt"
            "app/src/main/kotlin/com/yunx/app/data/repository/Pan123ResolveRepository.kt"
            "app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt"
            "app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/BaiduCloudScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/BookmarkScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/C139CloudScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/CloudDriveScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/CloudFileSheets.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/Pan123CloudScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/UCCoudScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/screens/XunleiCloudScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/viewmodel/C139CloudViewModel.kt"
            "app/src/main/kotlin/com/yunx/app/ui/login/Pan123LoginScreen.kt"
            "app/src/main/kotlin/com/yunx/app/ui/login/WebLoginAutoDetect.kt"
            "app/src/main/kotlin/com/yunx/app/ui/viewmodel/Pan123AccountViewModel.kt"
            "app/src/main/kotlin/com/yunx/app/ui/viewmodel/Pan123CloudViewModel.kt"
          )

          git checkout "$UPSTREAM_SHA" -- "${files[@]}"

          grep -q "searchQuery" app/src/main/kotlin/com/yunx/app/ui/screens/BaiduCloudScreen.kt
          grep -q "searchQuery" app/src/main/kotlin/com/yunx/app/ui/screens/C139CloudScreen.kt
          grep -q "searchQuery" app/src/main/kotlin/com/yunx/app/ui/screens/Pan123CloudScreen.kt
          grep -q "searchQuery" app/src/main/kotlin/com/yunx/app/ui/screens/CloudDriveScreen.kt
          grep -q "searchQuery" app/src/main/kotlin/com/yunx/app/ui/screens/UCCoudScreen.kt
          grep -q "searchQuery" app/src/main/kotlin/com/yunx/app/ui/screens/XunleiCloudScreen.kt

      - name: Patch MainScreen compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt")
          text = path.read_text(encoding="utf-8")

          if "import kotlinx.coroutines.flow.map" not in text:
              anchor = "import kotlinx.coroutines.withContext\n"
              if anchor not in text:
                  raise SystemExit("MainScreen import anchor not found")
              text = text.replace(anchor, anchor + "import kotlinx.coroutines.flow.map\n", 1)

          state_anchor = (
              "    val pan123ViewModel: Pan123AccountViewModel = viewModel(\n"
              "        factory = Pan123AccountViewModel.Factory(pan123Repository)\n"
              "    )\n"
          )
          state_replacement = (
              state_anchor
              + "    val c139LoginState = remember { c139Repository.observeAccount().map { it != null } }\n"
              + "    val pan123LoginState = remember { pan123Repository.observeAccount().map { it != null } }\n"
          )

          if "val c139LoginState =" not in text:
              if state_anchor not in text:
                  raise SystemExit("MainScreen login-state anchor not found")
              text = text.replace(state_anchor, state_replacement, 1)

          c139_old = (
              "        factory = C139CloudViewModel.Factory(\n"
              "            c139Api,\n"
              "            { c139Repository.getAccount()?.cookie },\n"
              "            downloadManager\n"
              "        )\n"
          )
          c139_new = (
              "        factory = C139CloudViewModel.Factory(\n"
              "            c139Api,\n"
              "            { c139Repository.getAccount()?.cookie },\n"
              "            downloadManager,\n"
              "            loginState = c139LoginState\n"
              "        )\n"
          )

          if c139_old in text:
              text = text.replace(c139_old, c139_new, 1)
          elif "loginState = c139LoginState" not in text:
              raise SystemExit("C139 factory anchor not found")

          pan_old = (
              "        factory = Pan123CloudViewModel.Factory(\n"
              "            pan123Api,\n"
              "            { pan123Repository.getAccount()?.accessToken },\n"
              "            downloadManager\n"
              "        )\n"
          )
          pan_new = (
              "        factory = Pan123CloudViewModel.Factory(\n"
              "            pan123Api,\n"
              "            { pan123Repository.getAccount()?.accessToken },\n"
              "            downloadManager,\n"
              "            loginState = pan123LoginState\n"
              "        )\n"
          )

          if pan_old in text:
              text = text.replace(pan_old, pan_new, 1)
          elif "loginState = pan123LoginState" not in text:
              raise SystemExit("Pan123 factory anchor not found")

          path.write_text(text, encoding="utf-8")
          PY

          grep -q "loginState = c139LoginState" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt
          grep -q "loginState = pan123LoginState" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt
          grep -q "suspend fun saveToken" app/src/main/kotlin/com/yunx/app/data/repository/Pan123AccountRepository.kt

      - name: Configure debug build
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          export GRADLE_USER_HOME="$HOME/.gradle"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x gradlew

      - name: Build verification
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$HOME/.gradle"

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest \
            assembleDebug

      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/migrate-yunx-20260904.yml
          rm -f local.properties

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: migrate YunX 2026-09-04 browsing updates"
          git push origin HEAD:main
