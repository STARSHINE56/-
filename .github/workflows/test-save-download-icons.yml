name: 测试保存与下载图标

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 修改图标并构建测试 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 修改保存与下载图标
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # 1. 增加 CloudUpload 图标 import
          # ---------------------------------------------------------
          old = """import androidx.compose.material.icons.outlined.ChevronRight
          import androidx.compose.material.icons.outlined.Folder"""

          new = """import androidx.compose.material.icons.outlined.ChevronRight
          import androidx.compose.material.icons.outlined.CloudUpload
          import androidx.compose.material.icons.outlined.Folder"""

          if old not in text:
              raise RuntimeError("找不到 ChevronRight import，源码结构可能已经变化")

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # 2. 给 ShareFileRow 增加单独的下载回调
          # ---------------------------------------------------------
          old = """    /** 非空时行尾显示「转存」按钮 */
              onSave: (() -> Unit)? = null,
              /** 非空时行尾显示「更多」按钮（打开文件操作菜单） */"""

          new = """    /** 非空时行尾显示「转存」按钮 */
              onSave: (() -> Unit)? = null,
              /** 非空时行尾显示「下载」按钮；文件夹不显示 */
              onDownload: (() -> Unit)? = null,
              /** 非空时行尾显示「更多」按钮（打开文件操作菜单） */"""

          if old not in text:
              raise RuntimeError("找不到 ShareFileRow onSave 参数位置")

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # 3. 调用 ShareFileRow 时给普通文件传入下载动作
          # ---------------------------------------------------------
          old = """                    onSave = if (!viewModel.multiSelectMode && viewModel.canSave) {
                              { viewModel.requestSave(file) }
                          } else {
                              null
                          },
                          onLongClick = if (!viewModel.multiSelectMode) {"""

          new = """                    onSave = if (!viewModel.multiSelectMode && viewModel.canSave) {
                              { viewModel.requestSave(file) }
                          } else {
                              null
                          },
                          onDownload = if (!viewModel.multiSelectMode && !file.isdir) {
                              {
                                  checkBaiduLimit(file) {
                                      viewModel.fetchDownloadLink(file)
                                  }
                              }
                          } else {
                              null
                          },
                          onLongClick = if (!viewModel.multiSelectMode) {"""

          if old not in text:
              raise RuntimeError("找不到 ShareFileRow 调用位置")

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # 4. 保存到网盘按钮：SaveAlt -> CloudUpload
          # ---------------------------------------------------------
          old = """                IconButton(onClick = onSave, modifier = Modifier.size(36.dp)) {
                          Icon(
                              imageVector = Icons.Outlined.SaveAlt,
                              contentDescription = "转存",
                              modifier = Modifier.size(18.dp),
                              tint = MaterialTheme.colorScheme.primary
                          )
                      }"""

          new = """                IconButton(onClick = onSave, modifier = Modifier.size(40.dp)) {
                          Icon(
                              imageVector = Icons.Outlined.CloudUpload,
                              contentDescription = "保存到网盘",
                              modifier = Modifier.size(21.dp),
                              tint = MaterialTheme.colorScheme.primary
                          )
                      }"""

          if old not in text:
              raise RuntimeError("找不到原保存按钮")

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # 5. 替换最右侧固定 >
          #
          # 文件夹：仍然显示 >
          # 普通文件：显示下载按钮
          # ---------------------------------------------------------
          old = """            Icon(
                      imageVector = Icons.Outlined.ChevronRight,
                      contentDescription = null,
                      tint = MaterialTheme.colorScheme.outline
                  )
              }
          }
          }

          internal fun formatSize"""

          new = """            if (file.isdir) {
                      Icon(
                          imageVector = Icons.Outlined.ChevronRight,
                          contentDescription = "进入文件夹",
                          tint = MaterialTheme.colorScheme.outline
                      )
                  } else if (onDownload != null) {
                      IconButton(
                          onClick = onDownload,
                          modifier = Modifier.size(40.dp)
                      ) {
                          Icon(
                              imageVector = Icons.Outlined.Download,
                              contentDescription = "下载",
                              modifier = Modifier.size(21.dp),
                              tint = MaterialTheme.colorScheme.primary
                          )
                      }
                  }
              }
          }
          }

          internal fun formatSize"""

          if old not in text:
              raise RuntimeError("找不到 ShareFileRow 最右侧 ChevronRight")

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("✅ ShareDetailScreen.kt 修改完成")
          print("✅ 保存到网盘：CloudUpload")
          print("✅ 普通文件：Download")
          print("✅ 文件夹：ChevronRight")
          PY

      - name: 检查修改结果
        shell: bash
        run: |
          echo "====== CloudUpload ======"
          grep -n "CloudUpload" \
            app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

          echo ""
          echo "====== Download ======"
          grep -n "Icons.Outlined.Download" \
            app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

          echo ""
          echo "====== onDownload ======"
          grep -n "onDownload" \
            app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

      - name: 设置 Gradle 权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: 整理 APK
        shell: bash
        run: |
          mkdir -p output

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "❌ 没找到 APK"
            exit 1
          fi

          cp "$APK" \
            output/StarAssistant-save-download-icons-test.apk

          echo "APK=$APK"
          ls -lh output/

      - name: 上传测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: StarAssistant-save-download-icons-test
          path: output/StarAssistant-save-download-icons-test.apk
          retention-days: 7
