name: 下载优化第六批

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  optimize:
    name: 下载优化第六批
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 检查第五批基础
        shell: bash
        run: |
          echo "检查第五批关键标记，防止在被 MT 覆盖的旧源码上继续..."
          test -f app/src/main/kotlin/com/yunx/app/data/download/DownloadFailurePolicy.kt
          grep -q "recoverInterruptedTasks" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "awaitNetworkIfNeeded" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "ensureTempSpace" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "getInterruptedTasks" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskDao.kt
          grep -q "ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml
          grep -q "REFRESH_SKEW_MS" app/src/main/kotlin/com/yunx/app/data/download/DownloadSourceRefresh.kt
          grep -q "version = 16" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt

      - name: 检查关键资源未被 MT 插件删除
        shell: bash
        run: |
          test -s app/src/main/res/drawable/icon.png
          test -s app/src/main/res/drawable/icon2.png
          test -s app/src/main/res/drawable/weixin.png

      - name: 应用第六批下载优化
        shell: bash
        run: python3 .github/scripts/apply-download-batch6.py

      - name: 静态检查修改
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat
          grep -q "wifiOnlyDownload" app/src/main/kotlin/com/yunx/app/data/prefs/SettingsRepository.kt
          grep -q "仅 Wi-Fi 下载" app/src/main/kotlin/com/yunx/app/ui/screens/SettingsScreen.kt
          grep -q 'val phase: String' app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "等待队列" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "等待 Wi-Fi" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "重新获取链接" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "合并中" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "保存中" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "cleanupOrphanTempFiles" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "notifyCompleted" app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt
          grep -q "wifiOnlyProvider" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: 生成结果说明
        shell: bash
        run: |
          mkdir -p batch6-result
          cp app/build/outputs/apk/debug/app-debug.apk batch6-result/星辰助手-下载优化第六批-test.apk
          cat > batch6-result/REPORT.md <<'EOF'
          # 星辰助手下载优化第六批

          本批从“稳定能下”继续提升到“成熟下载器体验”：

          - 新增“仅 Wi-Fi 下载”开关
          - 开启后移动网络不继续下载，切回 Wi-Fi 自动断点续传
          - 下载状态细化：等待队列 / 等待网络 / 等待 Wi-Fi / 检查下载源 / 重新获取链接 / 下载中 / 合并中 / 保存中
          - 下载页实时显示当前阶段
          - 保留现有最大并发任务限制，并明确显示排队状态
          - App 启动恢复任务时保守清理已不存在任务对应的孤儿 part/merged/hls 缓存
          - 下载完成后发送非持续通知，点击通知返回应用
          - 不修改 Room 数据库版本，不重写成熟的分片/断点续传核心
          - 延续第五批重启恢复、断网等待、空间预检查和错误中文化

          安全保护：
          - 工作流先验证第五批关键代码与第四批直链刷新能力仍存在
          - icon.png / icon2.png / weixin.png 缺失立即停止
          - 不从旧提交自动覆盖整个源码
          - 所有补丁采用精确匹配，源码结构不符时立即失败
          - 单元测试、Lint、Debug APK 全部通过后才提交 main
          - 普通 git push，不使用 force
          EOF

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Download-Optimization-Batch6
          path: batch6-result/**
          if-no-files-found: error
          retention-days: 14

      - name: 提交修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main app/src/test

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "feat: improve download queue wifi policy and status UX"
          git push origin HEAD:main
