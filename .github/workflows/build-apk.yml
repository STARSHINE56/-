name: Build and Release Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Restore release signing key
        shell: bash
        run: |
          test -n "$SIGNING_KEY_BASE64" || { echo "SIGNING_KEY_BASE64 secret is missing"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "RELEASE_STORE_PASSWORD secret is missing"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "RELEASE_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "RELEASE_KEY_PASSWORD secret is missing"; exit 1; }
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore
      - name: Configure release signing
        shell: bash
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$GITHUB_WORKSPACE/release.keystore"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
            printf 'VERSION_NAME=%s\n' "${GITHUB_REF_NAME#v}"
          } > "$GRADLE_USER_HOME/gradle.properties"
          chmod +x gradlew
      - name: Build signed APK and AAB
        run: ./gradlew --no-daemon --console=plain clean assembleRelease bundleRelease
      - name: Verify signature and collect files
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p output
          cp "$APK" "output/星辰助手-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "output/星辰助手-${GITHUB_REF_NAME}.aab"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" output/* --generate-notes --verify-tag

