name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      YUNX_USE_MIRROR: "false"

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore original signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          with zipfile.ZipFile("YunX-1.2.6.zip") as archive:
              matches = [
                  name for name in archive.namelist()
                  if name.endswith("/debug.keystore")
                  or name == "debug.keystore"
              ]

              if len(matches) != 1:
                  raise RuntimeError("无法找到唯一的原始 debug.keystore")

              Path("debug.keystore").write_bytes(
                  archive.read(matches[0])
              )

          print("已恢复原始签名文件")
          PY

      - name: Prepare project
        run: |
          test -f gradlew
          test -f app/build.gradle.kts
          sed -i '/^[[:space:]]*android.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew --no-daemon --console=plain clean :app:assembleDebug

      - name: Verify and collect APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p output
          cp "$apk" "output/星辰助手.apk"

      - name: Save APK for download
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
