name: Apply First Batch Optimizations

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: apply-first-batch-optimizations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify optimizations
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          ROOT = Path(".")

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")

              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly 1 match in {path}, found {count}"
                  )

              path.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8"
              )

              print(f"OK: {label}")

          # ------------------------------------------------------------
          # 1. 统一用户可见的“139 网盘”文案为“移动云盘”
          # ------------------------------------------------------------

          replacements = (
              ("139网盘", "移动云盘"),
              ("139 网盘", "移动云盘"),
              ("139云盘", "移动云盘"),
              ("139 云盘", "移动云盘"),
          )

          text_files = []

          app_dir = ROOT / "app" / "src"

          for suffix in ("*.kt", "*.xml"):
              text_files.extend(
                  app_dir.rglob(suffix)
              )

          for extra in (
              ROOT / "README.md",
              ROOT / "NOTICE",
              ROOT / "NOTICE.md",
          ):
              if extra.exists():
                  text_files.append(extra)

          changed_mobile_cloud = []

          for path in text_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              updated = text

              for old, new in replacements:
                  updated = updated.replace(
                      old,
                      new
                  )

              if updated != text:
                  path.write_text(
                      updated,
                      encoding="utf-8"
                  )

                  changed_mobile_cloud.append(
                      str(path)
                  )

          print(
              "Mobile cloud wording updated in:",
              *changed_mobile_cloud,
              sep="\n- "
          )

          # ------------------------------------------------------------
          # 2. DownloadViewModel：
          #    重试全部失败 + 清除已完成
          # ------------------------------------------------------------

          vm_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
              "DownloadViewModel.kt"
          )

          vm_old = '''    /** 全部开始：恢复所有已暂停/失败的任务（断点续传） */
              fun resumeAll() {
                  tasks.value.filter {
                      it.status == DownloadTaskEntity.STATUS_PAUSED ||
                          it.status == DownloadTaskEntity.STATUS_FAILED
                  }.forEach { manager.start(it.id) }
              }

              /** 删除全部任务（可同时删除已保存到本地的文件） */
          '''

          vm_new = '''    /** 全部开始：恢复所有已暂停/失败的任务（断点续传） */
              fun resumeAll() {
                  tasks.value.filter {
                      it.status == DownloadTaskEntity.STATUS_PAUSED ||
                          it.status == DownloadTaskEntity.STATUS_FAILED
                  }.forEach { manager.start(it.id) }
              }

              /** 仅重试全部失败任务，不影响已暂停任务。 */
              fun retryFailed() {
                  tasks.value
                      .filter {
                          it.status ==
                              DownloadTaskEntity.STATUS_FAILED
                      }
                      .forEach {
                          manager.start(it.id)
                      }
              }

              /**
               * 清除全部已完成任务记录。
               *
               * 不删除已经保存到本地的文件。
               */
              fun clearCompleted() {
                  tasks.value
                      .filter {
                          it.status ==
                              DownloadTaskEntity.STATUS_COMPLETED
                      }
                      .forEach {
                          manager.remove(
                              it.id,
                              deleteLocal = false
                          )
                      }
              }

              /** 删除全部任务（可同时删除已保存到本地的文件） */
          '''

          replace_once(
              vm_path,
              vm_old,
              vm_new,
              "DownloadViewModel batch actions"
          )

          # ------------------------------------------------------------
          # 3. DownloadScreen 顶部批量操作入口
          # ------------------------------------------------------------

          screen_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "DownloadScreen.kt"
          )

          screen = screen_path.read_text(
              encoding="utf-8"
          )

          caller_old = '''                DownloadBatchBar(
                              hasActive = tasks.any {
                                  it.status == DownloadTaskEntity.STATUS_DOWNLOADING ||
                                      it.status == DownloadTaskEntity.STATUS_PENDING
                              },
                              hasResumable = tasks.any {
                                  it.status == DownloadTaskEntity.STATUS_PAUSED ||
                                      it.status == DownloadTaskEntity.STATUS_FAILED
                              },
                              onPauseAll = { viewModel.pauseAll() },
                              onResumeAll = { viewModel.resumeAll() },
                              onDeleteAll = { showDeleteAllConfirm = true }
                          )
          '''

          caller_new = '''                DownloadBatchBar(
                              hasActive = tasks.any {
                                  it.status == DownloadTaskEntity.STATUS_DOWNLOADING ||
                                      it.status == DownloadTaskEntity.STATUS_PENDING
                              },
                              hasResumable = tasks.any {
                                  it.status == DownloadTaskEntity.STATUS_PAUSED ||
                                      it.status == DownloadTaskEntity.STATUS_FAILED
                              },
                              hasFailed = tasks.any {
                                  it.status == DownloadTaskEntity.STATUS_FAILED
                              },
                              hasCompleted = tasks.any {
                                  it.status == DownloadTaskEntity.STATUS_COMPLETED
                              },
                              onPauseAll = { viewModel.pauseAll() },
                              onResumeAll = { viewModel.resumeAll() },
                              onRetryFailed = { viewModel.retryFailed() },
                              onClearCompleted = { viewModel.clearCompleted() },
                              onDeleteAll = { showDeleteAllConfirm = true }
                          )
          '''

          if screen.count(caller_old) != 1:
              raise RuntimeError(
                  "DownloadBatchBar caller: "
                  f"expected 1 match, found {screen.count(caller_old)}"
              )

          screen = screen.replace(
              caller_old,
              caller_new,
              1
          )

          # ------------------------------------------------------------
          # 4. 重写顶部批量操作栏，避免窄屏按钮挤在一排
          # ------------------------------------------------------------

          start_marker = '''@Composable
          private fun DownloadBatchBar(
          '''

          end_marker = '''@Composable
          private fun DeleteConfirmDialog(
          '''

          start = screen.find(start_marker)
          end = screen.find(
              end_marker,
              start
          )

          if start == -1 or end == -1:
              raise RuntimeError(
                  "Unable to locate DownloadBatchBar function"
              )

          new_batch_bar = '''@Composable
          private fun DownloadBatchBar(
              hasActive: Boolean,
              hasResumable: Boolean,
              hasFailed: Boolean,
              hasCompleted: Boolean,
              onPauseAll: () -> Unit,
              onResumeAll: () -> Unit,
              onRetryFailed: () -> Unit,
              onClearCompleted: () -> Unit,
              onDeleteAll: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          horizontal = 12.dp,
                          vertical = 2.dp
                      )
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment =
                          Alignment.CenterVertically
                  ) {
                      TextButton(
                          onClick = onPauseAll,
                          enabled = hasActive
                      ) {
                          Icon(
                              imageVector =
                                  Icons.Outlined.Pause,
                              contentDescription = null,
                              modifier =
                                  Modifier.size(16.dp)
                          )

                          Spacer(
                              modifier =
                                  Modifier.width(4.dp)
                          )

                          Text("全部暂停")
                      }

                      TextButton(
                          onClick = onResumeAll,
                          enabled = hasResumable
                      ) {
                          Icon(
                              imageVector =
                                  Icons.Outlined.PlayArrow,
                              contentDescription = null,
                              modifier =
                                  Modifier.size(16.dp)
                          )

                          Spacer(
                              modifier =
                                  Modifier.width(4.dp)
                          )

                          Text("全部开始")
                      }

                      Spacer(
                          modifier =
                              Modifier.weight(1f)
                      )

                      TextButton(
                          onClick = onDeleteAll
                      ) {
                          Icon(
                              imageVector =
                                  Icons.Outlined.Delete,
                              contentDescription = null,
                              modifier =
                                  Modifier.size(16.dp),
                              tint =
                                  MaterialTheme
                                      .colorScheme
                                      .error
                          )

                          Spacer(
                              modifier =
                                  Modifier.width(4.dp)
                          )

                          Text(
                              text = "删除全部",
                              color =
                                  MaterialTheme
                                      .colorScheme
                                      .error
                          )
                      }
                  }

                  if (
                      hasFailed ||
                      hasCompleted
                  ) {
                      Row(
                          modifier =
                              Modifier.fillMaxWidth(),
                          verticalAlignment =
                              Alignment.CenterVertically
                      ) {
                          if (hasFailed) {
                              TextButton(
                                  onClick =
                                      onRetryFailed
                              ) {
                                  Icon(
                                      imageVector =
                                          Icons.Outlined.Refresh,
                                      contentDescription =
                                          null,
                                      modifier =
                                          Modifier.size(16.dp)
                                  )

                                  Spacer(
                                      modifier =
                                          Modifier.width(4.dp)
                                  )

                                  Text(
                                      "重试全部失败"
                                  )
                              }
                          }

                          if (
                              hasFailed &&
                              hasCompleted
                          ) {
                              Spacer(
                                  modifier =
                                      Modifier.width(4.dp)
                              )
                          }

                          if (hasCompleted) {
                              TextButton(
                                  onClick =
                                      onClearCompleted
                              ) {
                                  Icon(
                                      imageVector =
                                          Icons.Outlined.Delete,
                                      contentDescription =
                                          null,
                                      modifier =
                                          Modifier.size(16.dp)
                                  )

                                  Spacer(
                                      modifier =
                                          Modifier.width(4.dp)
                                  )

                                  Text(
                                      "清除已完成"
                                  )
                              }
                          }
                      }
                  }
              }
          }

          '''

          screen = (
              screen[:start] +
              new_batch_bar +
              screen[end:]
          )

          # ------------------------------------------------------------
          # 5. 文件夹下载组显示失败数量
          # ------------------------------------------------------------

          old_completed = '''    val completed = tasks.count { it.status == DownloadTaskEntity.STATUS_COMPLETED }
              val totalSize = tasks.sumOf { it.totalSize }
          '''

          new_completed = '''    val completed = tasks.count { it.status == DownloadTaskEntity.STATUS_COMPLETED }
              val failed = tasks.count { it.status == DownloadTaskEntity.STATUS_FAILED }
              val totalSize = tasks.sumOf { it.totalSize }
          '''

          if screen.count(old_completed) != 1:
              raise RuntimeError(
                  "Folder failed-count insertion point not found"
              )

          screen = screen.replace(
              old_completed,
              new_completed,
              1
          )

          old_folder_text = '''                        text = "${completed}/${tasks.size} 个文件 · ${formatSize(downloaded)} / ${formatSize(totalSize)}",
          '''

          new_folder_text = '''                        text = buildString {
                                      append("${completed}/${tasks.size} 个文件")

                                      if (failed > 0) {
                                          append(" · $failed 个失败")
                                      }

                                      append(
                                          " · ${formatSize(downloaded)} / ${formatSize(totalSize)}"
                                      )
                                  },
          '''

          if screen.count(old_folder_text) != 1:
              raise RuntimeError(
                  "Folder summary text not found"
              )

          screen = screen.replace(
              old_folder_text,
              new_folder_text,
              1
          )

          # ------------------------------------------------------------
          # 6. 子任务：速度 + 剩余时间 + 线程 + 失败原因
          # ------------------------------------------------------------

          old_sub_status = '''                        text = when {
                                      isDownloading && stats != null && stats.speed > 0 ->
                                          "${DownloadTaskEntity.statusText(task.status)} · ${formatSpeed(stats.speed)}"
                                      task.status == DownloadTaskEntity.STATUS_COMPLETED && task.avgSpeed > 0 ->
                                          "${DownloadTaskEntity.statusText(task.status)} · 平均 ${formatSpeed(task.avgSpeed)}"
                                      else -> taskStatusLine(task)
                                  },
          '''

          new_sub_status = '''                        text = when {
                                      isDownloading &&
                                          stats != null &&
                                          stats.speed > 0 -> {
                                          "${DownloadTaskEntity.statusText(task.status)} · " +
                                              "${formatSpeed(stats.speed)} · " +
                                              "剩余 ${formatRemain(stats.remainMillis)} · " +
                                              "${stats.chunkCount} 线程"
                                      }

                                      task.status ==
                                          DownloadTaskEntity.STATUS_FAILED &&
                                          task.errorMsg.isNotBlank() -> {
                                          "失败 · ${task.errorMsg}"
                                      }

                                      task.status ==
                                          DownloadTaskEntity.STATUS_COMPLETED &&
                                          task.avgSpeed > 0 -> {
                                          "${DownloadTaskEntity.statusText(task.status)} · " +
                                              "平均 ${formatSpeed(task.avgSpeed)}"
                                      }

                                      else ->
                                          taskStatusLine(task)
                                  },
          '''

          if screen.count(old_sub_status) != 1:
              raise RuntimeError(
                  "Download sub-task status block not found"
              )

          screen = screen.replace(
              old_sub_status,
              new_sub_status,
              1
          )

          # ------------------------------------------------------------
          # 7. 等待 / 暂停状态文案
          # ------------------------------------------------------------

          old_status_helper = '''private fun taskStatusLine(task: DownloadTaskEntity): String {
              val status = DownloadTaskEntity.statusText(task.status)
              return if (task.totalSize > 0) {
                  // 显示值钳制到 total（防恢复竞态残留导致显示超总大小）
                  val shown = minOf(task.downloadedSize, task.totalSize)
                  "$status · ${formatSize(shown)} / ${formatSize(task.totalSize)}"
              } else {
                  status
              }
          }
          '''

          new_status_helper = '''private fun taskStatusLine(
              task: DownloadTaskEntity
          ): String {
              val status = when (task.status) {
                  DownloadTaskEntity.STATUS_PENDING ->
                      "等待中 · 等待其他任务"

                  DownloadTaskEntity.STATUS_PAUSED ->
                      "已暂停"

                  DownloadTaskEntity.STATUS_FAILED ->
                      "失败"

                  else ->
                      DownloadTaskEntity.statusText(
                          task.status
                      )
              }

              return if (task.totalSize > 0) {
                  // 显示值钳制到 total，避免恢复竞态导致显示超过总大小。
                  val shown = minOf(
                      task.downloadedSize,
                      task.totalSize
                  )

                  "$status · ${formatSize(shown)} / ${formatSize(task.totalSize)}"
              } else {
                  status
              }
          }
          '''

          if screen.count(old_status_helper) != 1:
              raise RuntimeError(
                  "taskStatusLine helper not found"
              )

          screen = screen.replace(
              old_status_helper,
              new_status_helper,
              1
          )

          screen_path.write_text(
              screen,
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # 8. 最终检查：应用源码里不能再出现旧 139 网盘显示名
          # ------------------------------------------------------------

          bad = []

          for path in app_dir.rglob("*.kt"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for old, _ in replacements:
                  if old in text:
                      bad.append(
                          f"{path}: {old}"
                      )

          for path in app_dir.rglob("*.xml"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for old, _ in replacements:
                  if old in text:
                      bad.append(
                          f"{path}: {old}"
                      )

          if bad:
              raise RuntimeError(
                  "Remaining old mobile-cloud wording:\n" +
                  "\n".join(bad)
              )

          print(
              "All first-batch source changes applied successfully."
          )
          PY

      - name: Show changed files
        shell: bash
        run: |
          git status --short
          echo
          git diff --stat
          echo
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure debug build
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-first-batch.yml

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat: improve download status and mobile cloud labels"

          git push origin HEAD:main
