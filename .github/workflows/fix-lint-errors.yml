name: Fix Android Lint Errors

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: fix-android-lint-errors
  cancel-in-progress: false

jobs:
  fix:
    name: Fix Android lint errors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ============================================================
      # 1. 修复 Manifest 中 namespace 错误
      # ============================================================

      - name: Fix manifest component paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          fixes = {
              'android:name=".crash.CrashActivity"':
                  'android:name="com.yunx.app.crash.CrashActivity"',

              'android:name=".data.download.DownloadService"':
                  'android:name="com.yunx.app.data.download.DownloadService"',
          }

          for old, new in fixes.items():
              old_count = text.count(old)
              new_count = text.count(new)

              if old_count == 1:
                  text = text.replace(
                      old,
                      new,
                      1
                  )

                  print(
                      f"Fixed: {old}"
                  )

              elif (
                  old_count == 0
                  and new_count == 1
              ):
                  print(
                      f"Already fixed: {new}"
                  )

              else:
                  raise RuntimeError(
                      f"Unexpected manifest state: "
                      f"{old} old={old_count}, "
                      f"new={new_count}"
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # 2. 修复 BaiduApi 可疑缩进
      # ============================================================

      - name: Fix BaiduApi indentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/data/network/"
              "BaiduApi.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          old = '''                val path = item.optString("path")
                    add(
                        ShareFile(
          '''

          new = '''                val path = item.optString("path")
                add(
                    ShareFile(
          '''

          count = text.count(old)

          if count == 1:
              text = text.replace(
                  old,
                  new,
                  1
              )

              print(
                  "Fixed BaiduApi suspicious indentation."
              )

          elif count == 0 and new in text:
              print(
                  "BaiduApi indentation already fixed."
              )

          else:
              raise RuntimeError(
                  f"BaiduApi expected 1 match, found {count}"
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # 3. 修复 XunleiApi 两处可疑缩进
      # ============================================================

      - name: Fix XunleiApi indentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/data/network/"
              "XunleiApi.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          old = '''            .header("Referer", "https://pan.xunlei.com/")
            if (captchaToken.isNotBlank()) builder.header("X-Captcha-Token", captchaToken)
          '''

          new = '''            .header("Referer", "https://pan.xunlei.com/")

        if (captchaToken.isNotBlank()) {
            builder.header(
                "X-Captcha-Token",
                captchaToken
            )
        }
          '''

          count = text.count(old)

          if count == 2:
              text = text.replace(
                  old,
                  new
              )

              print(
                  "Fixed 2 XunleiApi indentation issues."
              )

          elif (
              count == 0
              and text.count(
                  'builder.header(\n'
                  '                "X-Captcha-Token",'
              ) == 2
          ):
              print(
                  "XunleiApi indentation already fixed."
              )

          else:
              raise RuntimeError(
                  f"XunleiApi expected 2 matches, "
                  f"found {count}"
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # 4. Theme.kt
      #
      # Material Color Utilities 的 API 被 @RestrictTo 标记，
      # 但当前项目明确使用它来生成主题颜色。
      # 这里只对 seedColorScheme() 做局部 suppression，
      # 不全局关闭 RestrictedApi。
      # ============================================================

      - name: Suppress intentional restricted color API
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/theme/"
              "Theme.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          marker = '''@Composable
          private fun seedColorScheme(
          '''

          replacement = '''@android.annotation.SuppressLint("RestrictedApi")
          @Composable
          private fun seedColorScheme(
          '''

          if replacement in text:
              print(
                  "RestrictedApi suppression already exists."
              )

          else:
              count = text.count(marker)

              if count != 1:
                  raise RuntimeError(
                      "seedColorScheme marker expected "
                      f"1 match, found {count}"
                  )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

              print(
                  "Added local RestrictedApi suppression."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # 5. 清理尾部空格
      # ============================================================

      - name: Clean source whitespace
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path(
                  "app/src/main/AndroidManifest.xml"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/data/network/"
                  "BaiduApi.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/data/network/"
                  "XunleiApi.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/theme/"
                  "Theme.kt"
              ),
          ]

          for path in files:
              text = path.read_text(
                  encoding="utf-8"
              )

              cleaned = "\n".join(
                  line.rstrip()
                  for line in text.splitlines()
              )

              if text.endswith("\n"):
                  cleaned += "\n"

              path.write_text(
                  cleaned,
                  encoding="utf-8"
              )

              print(
                  f"Cleaned: {path}"
              )
          PY

      # ============================================================
      # 6. 验证源码改动
      # ============================================================

      - name: Verify source fixes
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q \
            'android:name="com.yunx.app.crash.CrashActivity"' \
            "$MANIFEST"

          grep -q \
            'android:name="com.yunx.app.data.download.DownloadService"' \
            "$MANIFEST"

          grep -q \
            '@android.annotation.SuppressLint("RestrictedApi")' \
            app/src/main/kotlin/com/yunx/app/ui/theme/Theme.kt

          if grep -q \
            'android:name=".crash.CrashActivity"' \
            "$MANIFEST"
          then
            echo "Old CrashActivity path still exists."
            exit 1
          fi

          if grep -q \
            'android:name=".data.download.DownloadService"' \
            "$MANIFEST"
          then
            echo "Old DownloadService path still exists."
            exit 1
          fi

          echo "Source fixes verified."

      # ============================================================
      # 7. Java
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 8. Android SDK
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # ============================================================
      # 9. Gradle 环境
      # ============================================================

      - name: Configure Android build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 10. 单元测试
      #
      # 先确认我们手工修改没有破坏编译。
      # ============================================================

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      # ============================================================
      # 11. 第一次 Lint
      #
      # 这里允许失败，因为目的是统计剩余历史问题。
      # 不运行 lintFix，不自动改任何 Kotlin 源码。
      # ============================================================

      - name: Run lint before baseline
        id: lint_before_baseline
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      # ============================================================
      # 12. 配置 baseline
      # ============================================================

      - name: Configure lint baseline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          baseline_line = (
              'baseline = file("lint-baseline.xml")'
          )

          if baseline_line in text:
              print(
                  "Lint baseline already configured."
              )

              raise SystemExit(0)

          old = '''    kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")
                  )
              }
          }
          }
          '''

          new = '''    kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")
                  )
              }
          }

          lint {
              baseline = file("lint-baseline.xml")
          }
          }
          '''

          count = text.count(old)

          if count != 1:
              raise RuntimeError(
                  "Expected android block ending once, "
                  f"found {count}"
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Lint baseline configuration added."
          )
          PY

      # ============================================================
      # 13. 生成 baseline
      #
      # baseline 只记录当前仍存在的历史问题。
      # ============================================================

      - name: Generate lint baseline
        shell: bash
        run: |
          rm -f \
            app/lint-baseline.xml

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            updateLintBaseline

          test -f \
            app/lint-baseline.xml

          echo
          echo "Lint baseline generated:"
          wc -l \
            app/lint-baseline.xml

      # ============================================================
      # 14. 最终 Lint
      #
      # 这里禁止跳过。
      # baseline 之外如果还有错误，工作流直接失败。
      # ============================================================

      - name: Run final Android lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      # ============================================================
      # 15. 再跑单元测试
      #
      # baseline 修改 Gradle 后再次确认项目正常。
      # ============================================================

      - name: Run final unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      # ============================================================
      # 16. Debug APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Debug APK verified:"
          ls -lh "$APK"

      # ============================================================
      # 17. 确认 lintFix 没有偷偷改源码
      # ============================================================

      - name: Verify no unsafe lint quick fixes
        shell: bash
        run: |
          echo "Checking for accidental lintFix changes..."

          if grep -RIn \
            --include='*.kt' \
            -E '\.toUri\(\)' \
            app/src/main/kotlin
          then
            echo
            echo "Found toUri conversions."

            echo
            echo "This workflow never runs lintFix."
            echo "If these existed before, inspect them manually."

            exit 1
          fi

          echo "No accidental toUri conversions found."

      # ============================================================
      # 18. Git diff
      # ============================================================

      - name: Inspect verified changes
        shell: bash
        run: |
          git status --short

          echo
          echo "----- DIFF STAT -----"

          git diff --stat

          echo
          echo "----- DIFF CHECK -----"

          git diff --check

          echo
          echo "----- CHANGED FILES -----"

          git diff \
            --name-only

      # ============================================================
      # 19. 最终必要文件检查
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          test -f \
            app/lint-baseline.xml

          grep -q \
            'baseline = file("lint-baseline.xml")' \
            app/build.gradle.kts

          grep -q \
            'com.yunx.app.crash.CrashActivity' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'com.yunx.app.data.download.DownloadService' \
            app/src/main/AndroidManifest.xml

          grep -q \
            '@android.annotation.SuppressLint("RestrictedApi")' \
            app/src/main/kotlin/com/yunx/app/ui/theme/Theme.kt

          echo "Final verification passed."

      # ============================================================
      # 20. 删除临时工作流
      # ============================================================

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f \
            .github/workflows/fix-lint-errors.yml

      # ============================================================
      # 21. 提交到 main
      # ============================================================

      - name: Commit verified lint fixes
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "fix: resolve Android lint issues"

          git push \
            origin \
            HEAD:main
