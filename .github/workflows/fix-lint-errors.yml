name: Fix Android Lint Errors

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  fix-lint:
    name: Fix Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix known source issues
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # =========================================================
          # AndroidManifest.xml
          # =========================================================

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          manifest_fixes = {
              'android:name=".crash.CrashActivity"':
                  'android:name="com.yunx.app.crash.CrashActivity"',

              'android:name=".data.download.DownloadService"':
                  'android:name="com.yunx.app.data.download.DownloadService"',
          }

          for old, new in manifest_fixes.items():
              if old in manifest:
                  manifest = manifest.replace(
                      old,
                      new,
                      1
                  )
                  print("Fixed:", old)

              elif new in manifest:
                  print("Already fixed:", new)

              else:
                  raise RuntimeError(
                      "Cannot find manifest component: "
                      + old
                  )

          manifest_path.write_text(
              manifest,
              encoding="utf-8"
          )

          # =========================================================
          # BaiduApi.kt
          # =========================================================

          baidu_path = Path(
              "app/src/main/kotlin/com/yunx/app/data/network/"
              "BaiduApi.kt"
          )

          baidu = baidu_path.read_text(
              encoding="utf-8"
          )

          old_baidu = '''                val path = item.optString("path")
                    add(
                        ShareFile(
          '''

          new_baidu = '''                val path = item.optString("path")
                add(
                    ShareFile(
          '''

          if old_baidu in baidu:
              baidu = baidu.replace(
                  old_baidu,
                  new_baidu,
                  1
              )
              print("Fixed BaiduApi indentation")

          else:
              print(
                  "BaiduApi indentation already fixed "
                  "or source changed"
              )

          baidu_path.write_text(
              baidu,
              encoding="utf-8"
          )

          # =========================================================
          # XunleiApi.kt
          # =========================================================

          xunlei_path = Path(
              "app/src/main/kotlin/com/yunx/app/data/network/"
              "XunleiApi.kt"
          )

          xunlei = xunlei_path.read_text(
              encoding="utf-8"
          )

          old_xunlei = '''            .header("Referer", "https://pan.xunlei.com/")
            if (captchaToken.isNotBlank()) builder.header("X-Captcha-Token", captchaToken)
          '''

          new_xunlei = '''            .header("Referer", "https://pan.xunlei.com/")

        if (captchaToken.isNotBlank()) {
            builder.header(
                "X-Captcha-Token",
                captchaToken
            )
        }
          '''

          count = xunlei.count(
              old_xunlei
          )

          if count:
              xunlei = xunlei.replace(
                  old_xunlei,
                  new_xunlei
              )
              print(
                  f"Fixed XunleiApi indentation: {count}"
              )

          else:
              print(
                  "XunleiApi indentation already fixed "
                  "or source changed"
              )

          xunlei_path.write_text(
              xunlei,
              encoding="utf-8"
          )

          # =========================================================
          # Theme.kt
          # 仅针对明确使用的 Material Color Utilities API
          # =========================================================

          theme_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/theme/"
              "Theme.kt"
          )

          theme = theme_path.read_text(
              encoding="utf-8"
          )

          annotation = (
              '@android.annotation.SuppressLint("RestrictedApi")'
          )

          function_marker = (
              "@Composable\n"
              "private fun seedColorScheme("
          )

          annotated_marker = (
              annotation
              + "\n"
              + function_marker
          )

          if annotated_marker in theme:
              print(
                  "Theme RestrictedApi suppression "
                  "already exists"
              )

          elif function_marker in theme:
              theme = theme.replace(
                  function_marker,
                  annotated_marker,
                  1
              )

              print(
                  "Added local RestrictedApi suppression"
              )

          else:
              raise RuntimeError(
                  "seedColorScheme() not found"
              )

          theme_path.write_text(
              theme,
              encoding="utf-8"
          )

          print(
              "Known source fixes completed"
          )
          PY

      - name: Verify component classes
        shell: bash
        run: |
          test -f \
            app/src/main/kotlin/com/yunx/app/crash/CrashActivity.kt

          test -f \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt

          grep -q \
            '^package com.yunx.app.crash' \
            app/src/main/kotlin/com/yunx/app/crash/CrashActivity.kt

          grep -q \
            '^package com.yunx.app.data.download' \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt

          echo "Component classes verified"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Check source diff
        shell: bash
        run: |
          git diff --check

          echo
          echo "Changed files:"
          git diff --name-only

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      # 第一次 Lint 用来查看修复真实问题后还剩多少历史问题。
      # 这里只允许这一步失败，不修改源码。
      - name: Run lint before baseline
        id: lint_before
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Configure lint baseline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          baseline = (
              'baseline = file("lint-baseline.xml")'
          )

          if baseline in text:
              print(
                  "Lint baseline already configured"
              )
              raise SystemExit(0)

          marker = "\n}\n\ndependencies {"

          if marker not in text:
              raise RuntimeError(
                  "Cannot locate end of android block"
              )

          lint_block = '''
          
              lint {
                  baseline = file("lint-baseline.xml")
              }
          '''

          text = text.replace(
              marker,
              lint_block
              + "\n}\n\ndependencies {",
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Lint baseline configured"
          )
          PY

      - name: Generate lint baseline
        shell: bash
        run: |
          rm -f app/lint-baseline.xml

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            updateLintBaseline

          test -f app/lint-baseline.xml

          echo
          echo "Baseline created:"
          wc -l app/lint-baseline.xml

      # 这一遍不能失败。
      # baseline 之外出现任何新的 Lint 错误都会阻止提交。
      - name: Run final Android lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Run final unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK build successful:"
          ls -lh "$APK"

      - name: Final verification
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q \
            'com.yunx.app.crash.CrashActivity' \
            "$MANIFEST"

          grep -q \
            'com.yunx.app.data.download.DownloadService' \
            "$MANIFEST"

          grep -q \
            '@android.annotation.SuppressLint("RestrictedApi")' \
            app/src/main/kotlin/com/yunx/app/ui/theme/Theme.kt

          grep -q \
            'baseline = file("lint-baseline.xml")' \
            app/build.gradle.kts

          test -f app/lint-baseline.xml

          git diff --check

          echo
          echo "Final verification passed"

      # 只添加真正需要提交的源码。
      # 故意不使用 git add -A，
      # 也不修改任何 .github/workflows 文件。
      - name: Commit fixes
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/AndroidManifest.xml \
            app/src/main/kotlin/com/yunx/app/data/network/BaiduApi.kt \
            app/src/main/kotlin/com/yunx/app/data/network/XunleiApi.kt \
            app/src/main/kotlin/com/yunx/app/ui/theme/Theme.kt \
            app/build.gradle.kts \
            app/lint-baseline.xml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git diff --cached --check

          git status --short

          git commit \
            -m "fix: clean up Android lint issues"

          git push \
            origin \
            HEAD:main
