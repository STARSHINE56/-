name: Fix Android Lint Errors

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: fix-android-lint-errors
  cancel-in-progress: false

jobs:
  fix:
    name: Fix Android lint errors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ============================================================
      # 1. 修复 Manifest 中真实存在的包名错误
      # ============================================================

      - name: Fix manifest component paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")

          text = path.read_text(
              encoding="utf-8"
          )

          fixes = {
              'android:name=".crash.CrashActivity"':
                  'android:name="com.yunx.app.crash.CrashActivity"',

              'android:name=".data.download.DownloadService"':
                  'android:name="com.yunx.app.data.download.DownloadService"',
          }

          for old, new in fixes.items():
              count = text.count(old)

              if count == 1:
                  text = text.replace(
                      old,
                      new,
                      1
                  )

                  print(
                      f"Fixed: {old}"
                  )

              elif count == 0 and new in text:
                  print(
                      f"Already fixed: {new}"
                  )

              else:
                  raise RuntimeError(
                      f"Unexpected manifest match count "
                      f"for {old}: {count}"
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # 2. 检查真实类是否存在
      # ============================================================

      - name: Verify component classes
        shell: bash
        run: |
          test -f \
            app/src/main/kotlin/com/yunx/app/crash/CrashActivity.kt

          test -f \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt

          grep -q \
            '^package com.yunx.app.crash' \
            app/src/main/kotlin/com/yunx/app/crash/CrashActivity.kt

          grep -q \
            '^package com.yunx.app.data.download' \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt

          echo "Component classes verified."

      # ============================================================
      # 3. Java
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. Android SDK
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. 构建环境
      # ============================================================

      - name: Configure Android build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 6. 先确认修改后项目可以正常编译
      # ============================================================

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      # ============================================================
      # 7. Android Lint 自动修复
      #
      # lintFix 只能修 Android Lint 确认可以安全自动修改的问题。
      # 某些问题无法自动修，所以此步骤允许继续。
      # ============================================================

      - name: Apply safe Android lint fixes
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintFix

      # ============================================================
      # 8. 清理可能由 lintFix 产生的尾部空格
      # ============================================================

      - name: Clean modified source files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          extensions = {
              ".kt",
              ".java",
              ".xml",
              ".kts",
          }

          roots = [
              Path("app/src"),
              Path("app/build.gradle.kts"),
          ]

          for root in roots:
              if root.is_file():
                  files = [root]

              elif root.is_dir():
                  files = [
                      p
                      for p in root.rglob("*")
                      if (
                          p.is_file()
                          and p.suffix in extensions
                      )
                  ]

              else:
                  continue

              for path in files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

                  cleaned = "\n".join(
                      line.rstrip()
                      for line in text.splitlines()
                  )

                  if text.endswith("\n"):
                      cleaned += "\n"

                  if cleaned != text:
                      path.write_text(
                          cleaned,
                          encoding="utf-8"
                      )
          PY

      # ============================================================
      # 9. 第一次重新跑 Lint
      #
      # 这里先看看真正还剩多少旧问题。
      # ============================================================

      - name: Run lint after fixes
        id: lint_after_fix
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      # ============================================================
      # 10. 如果仍有大量历史 Lint，建立 baseline
      #
      # baseline 不会关闭 Lint。
      # 它只记录当前遗留问题。
      # 以后新产生的问题仍会导致 lintDebug 失败。
      # ============================================================

      - name: Configure lint baseline
        if: steps.lint_after_fix.outcome == 'failure'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          baseline_line = (
              'baseline = file("lint-baseline.xml")'
          )

          if baseline_line in text:
              print(
                  "Lint baseline configuration already exists."
              )

              raise SystemExit(0)

          # 找 android { ... } 块
          match = re.search(
              r'(?m)^android\s*\{',
              text
          )

          if not match:
              raise RuntimeError(
                  "android block not found "
                  "in app/build.gradle.kts"
              )

          start = match.end()

          lint_block = '''

              lint {
                  baseline = file("lint-baseline.xml")
              }
          '''

          text = (
              text[:start]
              + lint_block
              + text[start:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Added lint baseline configuration."
          )
          PY

      # ============================================================
      # 11. 生成 baseline
      # ============================================================

      - name: Generate lint baseline
        if: steps.lint_after_fix.outcome == 'failure'
        shell: bash
        run: |
          rm -f \
            app/lint-baseline.xml

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            updateLintBaseline

          test -f \
            app/lint-baseline.xml

          echo "Lint baseline generated."

          echo
          echo "Baseline size:"
          wc -l \
            app/lint-baseline.xml

      # ============================================================
      # 12. 最终 Lint
      #
      # 这里不再 continue-on-error。
      # 如果还有新的、baseline 外错误，就直接失败，不提交。
      # ============================================================

      - name: Run final Android lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      # ============================================================
      # 13. Debug APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK verified:"
          ls -lh "$APK"

      # ============================================================
      # 14. Manifest 最终验证
      # ============================================================

      - name: Verify manifest fixes
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q \
            'android:name="com.yunx.app.crash.CrashActivity"' \
            "$MANIFEST"

          grep -q \
            'android:name="com.yunx.app.data.download.DownloadService"' \
            "$MANIFEST"

          if grep -q \
            'android:name=".crash.CrashActivity"' \
            "$MANIFEST"
          then
            echo "Old CrashActivity path still exists."
            exit 1
          fi

          if grep -q \
            'android:name=".data.download.DownloadService"' \
            "$MANIFEST"
          then
            echo "Old DownloadService path still exists."
            exit 1
          fi

          echo "Manifest verification passed."

      # ============================================================
      # 15. Git 检查
      # ============================================================

      - name: Inspect changes
        shell: bash
        run: |
          git status --short

          echo
          echo "----- DIFF STAT -----"

          git diff --stat

          echo
          echo "----- DIFF CHECK -----"

          git diff --check

      # ============================================================
      # 16. 删除临时工作流
      # ============================================================

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f \
            .github/workflows/fix-lint-errors.yml

      # ============================================================
      # 17. 提交
      # ============================================================

      - name: Commit verified lint fixes
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "fix: resolve Android lint configuration issues"

          git push \
            origin \
            HEAD:main
