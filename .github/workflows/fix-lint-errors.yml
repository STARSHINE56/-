name: Fix Android Lint Errors

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  fix-lint:
    name: Fix Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix known source issues
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # =========================================================
          # AndroidManifest.xml
          # =========================================================

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          manifest_fixes = {
              'android:name=".crash.CrashActivity"':
                  'android:name="com.yunx.app.crash.CrashActivity"',

              'android:name=".data.download.DownloadService"':
                  'android:name="com.yunx.app.data.download.DownloadService"',
          }

          for old, new in manifest_fixes.items():
              if old in manifest:
                  manifest = manifest.replace(
                      old,
                      new,
                      1
                  )

                  print(
                      "Fixed:",
                      old
                  )

              elif new in manifest:
                  print(
                      "Already fixed:",
                      new
                  )

              else:
                  raise RuntimeError(
                      "Cannot find manifest component: "
                      + old
                  )

          manifest_path.write_text(
              manifest,
              encoding="utf-8"
          )

          # =========================================================
          # BaiduApi.kt
          # =========================================================

          baidu_path = Path(
              "app/src/main/kotlin/com/yunx/app/data/network/"
              "BaiduApi.kt"
          )

          baidu = baidu_path.read_text(
              encoding="utf-8"
          )

          old_baidu = (
              '                val path = item.optString("path")\n'
              '                    add(\n'
              '                        ShareFile(\n'
          )

          new_baidu = (
              '                val path = item.optString("path")\n'
              '                add(\n'
              '                    ShareFile(\n'
          )

          if old_baidu in baidu:
              baidu = baidu.replace(
                  old_baidu,
                  new_baidu,
                  1
              )

              print(
                  "Fixed BaiduApi indentation"
              )

          elif new_baidu in baidu:
              print(
                  "BaiduApi indentation already fixed"
              )

          else:
              print(
                  "BaiduApi target block not found; "
                  "source may already differ"
              )

          baidu_path.write_text(
              baidu,
              encoding="utf-8"
          )

          # =========================================================
          # XunleiApi.kt
          # =========================================================

          xunlei_path = Path(
              "app/src/main/kotlin/com/yunx/app/data/network/"
              "XunleiApi.kt"
          )

          xunlei = xunlei_path.read_text(
              encoding="utf-8"
          )

          old_xunlei = (
              '            .header("Referer", "https://pan.xunlei.com/")\n'
              '            if (captchaToken.isNotBlank()) '
              'builder.header("X-Captcha-Token", captchaToken)\n'
          )

          new_xunlei = (
              '            .header("Referer", "https://pan.xunlei.com/")\n'
              '\n'
              '        if (captchaToken.isNotBlank()) {\n'
              '            builder.header(\n'
              '                "X-Captcha-Token",\n'
              '                captchaToken\n'
              '            )\n'
              '        }\n'
          )

          xunlei_count = xunlei.count(
              old_xunlei
          )

          if xunlei_count > 0:
              xunlei = xunlei.replace(
                  old_xunlei,
                  new_xunlei
              )

              print(
                  "Fixed XunleiApi indentation:",
                  xunlei_count
              )

          elif (
              '"X-Captcha-Token",\n'
              '                captchaToken'
          ) in xunlei:
              print(
                  "XunleiApi indentation already fixed"
              )

          else:
              print(
                  "XunleiApi target blocks not found; "
                  "source may already differ"
              )

          xunlei_path.write_text(
              xunlei,
              encoding="utf-8"
          )

          # =========================================================
          # Theme.kt
          # RestrictedApi 只在 seedColorScheme() 局部忽略
          # =========================================================

          theme_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/theme/"
              "Theme.kt"
          )

          theme = theme_path.read_text(
              encoding="utf-8"
          )

          annotation = (
              '@android.annotation.SuppressLint("RestrictedApi")'
          )

          function_marker = (
              "@Composable\n"
              "private fun seedColorScheme("
          )

          annotated_marker = (
              annotation
              + "\n"
              + function_marker
          )

          if annotated_marker in theme:
              print(
                  "Theme RestrictedApi suppression already exists"
              )

          elif function_marker in theme:
              theme = theme.replace(
                  function_marker,
                  annotated_marker,
                  1
              )

              print(
                  "Added local RestrictedApi suppression"
              )

          else:
              raise RuntimeError(
                  "seedColorScheme() not found"
              )

          theme_path.write_text(
              theme,
              encoding="utf-8"
          )

          print(
              "Known source fixes completed"
          )
          PY

      - name: Verify component classes
        shell: bash
        run: |
          test -f \
            app/src/main/kotlin/com/yunx/app/crash/CrashActivity.kt

          test -f \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt

          grep -q \
            '^package com.yunx.app.crash' \
            app/src/main/kotlin/com/yunx/app/crash/CrashActivity.kt

          grep -q \
            '^package com.yunx.app.data.download' \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt

          echo "Component classes verified"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Check source diff
        shell: bash
        run: |
          git diff --check

          echo
          echo "Changed files:"

          git diff --name-only

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      # 第一次 Lint 只统计剩余历史问题。
      # 不执行 lintFix，也不会自动修改 Kotlin 源码。
      - name: Run lint before baseline
        id: lint_before
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Configure lint baseline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          baseline_line = (
              'baseline = file("lint-baseline.xml")'
          )

          if baseline_line in text:
              print(
                  "Lint baseline already configured"
              )

              raise SystemExit(0)

          marker = (
              "\n}\n\n"
              "dependencies {"
          )

          if marker not in text:
              raise RuntimeError(
                  "Cannot locate end of android block"
              )

          lint_block = (
              "\n"
              "    lint {\n"
              '        baseline = file("lint-baseline.xml")\n'
              "    }\n"
          )

          replacement = (
              lint_block
              + "\n}\n\n"
              + "dependencies {"
          )

          text = text.replace(
              marker,
              replacement,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Lint baseline configured"
          )
          PY

      - name: Verify Gradle syntax before baseline
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            tasks >/dev/null

          echo "Gradle configuration verified"

      - name: Generate lint baseline
        shell: bash
        run: |
          rm -f \
            app/lint-baseline.xml

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            updateLintBaseline

          test -f \
            app/lint-baseline.xml

          echo
          echo "Baseline created:"

          wc -l \
            app/lint-baseline.xml

      # 最终 Lint 不允许失败。
      # baseline 外的新错误仍会阻止提交。
      - name: Run final Android lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Run final unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK build successful:"

          ls -lh "$APK"

      - name: Final verification
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q \
            'android:name="com.yunx.app.crash.CrashActivity"' \
            "$MANIFEST"

          grep -q \
            'android:name="com.yunx.app.data.download.DownloadService"' \
            "$MANIFEST"

          if grep -q \
            'android:name=".crash.CrashActivity"' \
            "$MANIFEST"
          then
            echo "Old CrashActivity manifest path still exists"
            exit 1
          fi

          if grep -q \
            'android:name=".data.download.DownloadService"' \
            "$MANIFEST"
          then
            echo "Old DownloadService manifest path still exists"
            exit 1
          fi

          grep -q \
            '@android.annotation.SuppressLint("RestrictedApi")' \
            app/src/main/kotlin/com/yunx/app/ui/theme/Theme.kt

          grep -q \
            'baseline = file("lint-baseline.xml")' \
            app/build.gradle.kts

          test -f \
            app/lint-baseline.xml

          git diff --check

          echo
          echo "Final verification passed"

      - name: Show final changes
        shell: bash
        run: |
          echo "----- STATUS -----"
          git status --short

          echo
          echo "----- DIFF STAT -----"
          git diff --stat

          echo
          echo "----- CHANGED FILES -----"
          git diff --name-only

      # 只提交源码和 baseline。
      # 不修改、不删除任何 .github/workflows 文件。
      - name: Commit fixes
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/AndroidManifest.xml \
            app/src/main/kotlin/com/yunx/app/data/network/BaiduApi.kt \
            app/src/main/kotlin/com/yunx/app/data/network/XunleiApi.kt \
            app/src/main/kotlin/com/yunx/app/ui/theme/Theme.kt \
            app/build.gradle.kts \
            app/lint-baseline.xml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git diff --cached --check

          echo
          echo "Files to commit:"
          git diff --cached --name-only

          git commit \
            -m "fix: clean up Android lint issues"

          git push \
            origin \
            HEAD:main
