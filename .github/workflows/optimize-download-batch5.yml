name: 下载优化第五批

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  optimize:
    name: 下载优化第五批
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 防止在旧源码上继续修改
        shell: bash
        run: |
          echo "检查第四批成功后的关键标记..."
          test -f app/src/main/kotlin/com/yunx/app/data/download/DownloadSourceRefresh.kt
          grep -q "REFRESH_SKEW_MS" app/src/main/kotlin/com/yunx/app/data/download/DownloadSourceRefresh.kt
          grep -q 'tryRefreshSource(id, "redownload")' app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q 'dao.updateManualPaused(id, false)' app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "version = 16" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt

      - name: 检查关键资源未被覆盖或删除
        shell: bash
        run: |
          test -s app/src/main/res/drawable/icon.png
          test -s app/src/main/res/drawable/icon2.png
          test -s app/src/main/res/drawable/weixin.png

      - name: 应用第五批下载优化
        shell: bash
        run: python3 .github/scripts/apply-download-batch5.py

      - name: 静态检查修改
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat
          grep -q "ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml
          grep -q "getInterruptedTasks" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskDao.kt
          grep -q "recoverInterruptedTasks" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "awaitNetworkIfNeeded" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "ensureTempSpace" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "DownloadFailurePolicy.userMessage" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "LaunchedEffect(downloadManager)" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: 生成结果说明
        shell: bash
        run: |
          mkdir -p batch5-result
          cp app/build/outputs/apk/debug/app-debug.apk batch5-result/星辰助手-下载优化第五批-test.apk
          cat > batch5-result/REPORT.md <<'EOF'
          # 星辰助手下载优化第五批

          本批重点处理下载过程中最常见的意外情况：

          - App 被系统结束后，再次打开可恢复之前等待中/下载中的任务
          - 用户主动暂停的任务不会被恢复逻辑误启动
          - 网络断开时任务进入等待，网络恢复后从已有 part/seg 自动续传
          - 网络断开等待不消耗普通失败重试次数
          - 下载失败原因转换为用户可理解的中文提示
          - 区分网络异常、空间不足、权限、401/403、404/410、文件变化等情况
          - 已知文件大小时提前检查临时下载与合并空间，避免大文件下载到最后才因空间不足失败
          - 保持第四批个人网盘直链自动刷新、提前换链、断点续传保护
          - 保留现有最大同时下载任务数队列，不重写成熟的分片核心

          安全保护：
          - 工作流先检查第四批关键标记，不会在被 MT 插件覆盖后的旧源码上继续打补丁
          - 关键图标/二维码资源缺失会直接停止，不自动拿旧快照覆盖整个仓库
          - 单元测试、Lint、Debug APK 全部通过后才提交 main
          EOF

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Download-Optimization-Batch5
          path: batch5-result/**
          if-no-files-found: error
          retention-days: 14

      - name: 提交修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main app/src/test

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "feat: recover interrupted downloads and wait for network"
          git push origin HEAD:main
