name: 测试版 - Gopeed 风格本地下载页 9010

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starassistant-download-ui-9010
  cancel-in-progress: true

env:
  YUNX_USE_MIRROR: "false"

jobs:
  build:
    name: 构建下载页 9010 测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. 获取当前源码
      # ============================================================
      - name: 检出源码
        uses: actions/checkout@v7

      # ============================================================
      # 2. Java
      # ============================================================
      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 构建组件
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. Gradle
      # ============================================================
      - name: 配置 Gradle
        shell: bash
        run: |
          set -e

          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 5. 优化 DownloadScreen
      #
      # 不修改：
      # DownloadManager
      # ChunkDownloader
      # DownloadService
      # 数据库
      #
      # 只优化下载页面。
      # ============================================================
      - name: 应用 Gopeed 风格下载页
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # A. 加入 FilterChip
          # ========================================================
          if (
              "import androidx.compose.material3.FilterChip"
              not in text
          ):
              marker = (
                  "import androidx.compose.material3.FloatingActionButton\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "找不到 FloatingActionButton import"
                  )

              text = text.replace(
                  marker,
                  marker
                  + "import androidx.compose.material3.FilterChip\n",
                  1
              )

          # ========================================================
          # B. 添加页面分类状态
          # ========================================================
          old = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }"""

          new = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }

              // Gopeed 风格下载任务分类：
              // 0 = 进行中
              // 1 = 已完成
              var downloadCategory by remember {
                  mutableStateOf(0)
              }

              val activeTasks = tasks.filter {
                  it.status !=
                      DownloadTaskEntity.STATUS_COMPLETED
              }

              val completedTasks = tasks.filter {
                  it.status ==
                      DownloadTaskEntity.STATUS_COMPLETED
              }

              val visibleTasks =
                  if (downloadCategory == 0) {
                      activeTasks
                  } else {
                      completedTasks
                  }

              val totalRealtimeSpeed =
                  activeTasks.sumOf { task ->
                      stats[task.id]?.speed ?: 0L
                  }"""

          if old not in text:
              raise RuntimeError(
                  "找不到 DownloadScreen 状态区"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ========================================================
          # C. 下载列表顶部加入概览
          # ========================================================
          old = """            Column(modifier = Modifier.fillMaxSize()) {
                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          new = """            Column(modifier = Modifier.fillMaxSize()) {

                          DownloadOverviewHeader(
                              selectedCategory = downloadCategory,
                              activeCount = activeTasks.size,
                              completedCount = completedTasks.size,
                              totalSpeed = totalRealtimeSpeed,
                              onCategoryChange = {
                                  downloadCategory = it
                              }
                          )

                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          if old not in text:
              raise RuntimeError(
                  "找不到 DownloadBatchBar 插入位置"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ========================================================
          # D. 根目录任务改成当前分类
          # ========================================================
          old = """                    val rootTasks = tasks.filter { !it.fileName.contains('/') }"""

          new = """                    val rootTasks = visibleTasks.filter {
                                  !it.fileName.contains('/')
                              }"""

          if old not in text:
              raise RuntimeError(
                  "找不到 rootTasks"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ========================================================
          # E. 文件夹任务改成当前分类
          # ========================================================
          old = """                    val folderGroups = tasks.filter { it.fileName.contains('/') }
                              .groupBy { it.fileName.substringBefore('/') }"""

          new = """                    val folderGroups = visibleTasks.filter {
                                  it.fileName.contains('/')
                              }.groupBy {
                                  it.fileName.substringBefore('/')
                              }"""

          if old not in text:
              raise RuntimeError(
                  "找不到 folderGroups"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ========================================================
          # F. 分类为空时增加 Gopeed 风格空状态
          # ========================================================
          marker = """                    items(rootTasks, key = { it.id }) { task ->"""

          replacement = """                    if (visibleTasks.isEmpty()) {
                                  item(
                                      key = "download_category_empty"
                                  ) {
                                      DownloadCategoryEmptyState(
                                          completed =
                                              downloadCategory == 1
                                      )
                                  }
                              }

                              items(rootTasks, key = { it.id }) { task ->"""

          if marker not in text:
              raise RuntimeError(
                  "找不到任务列表 items"
              )

          text = text.replace(
              marker,
              replacement,
              1
          )

          # ========================================================
          # G. 在 DownloadBatchBar 前加入顶部概览组件
          # ========================================================
          marker = """@Composable
          private fun DownloadBatchBar("""

          overview = r'''@Composable
          private fun DownloadOverviewHeader(
              selectedCategory: Int,
              activeCount: Int,
              completedCount: Int,
              totalSpeed: Long,
              onCategoryChange: (Int) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          start = 16.dp,
                          end = 16.dp,
                          top = 8.dp,
                          bottom = 4.dp
                      )
              ) {
                  Row(
                      modifier =
                          Modifier.fillMaxWidth(),
                      verticalAlignment =
                          Alignment.CenterVertically
                  ) {
                      Column(
                          modifier =
                              Modifier.weight(1f)
                      ) {
                          Text(
                              text = "下载任务",
                              style =
                                  MaterialTheme.typography.titleLarge,
                              fontWeight =
                                  FontWeight.SemiBold
                          )

                          Spacer(
                              modifier =
                                  Modifier.height(3.dp)
                          )

                          Text(
                              text =
                                  when {
                                      activeCount == 0 ->
                                          "当前没有正在下载的任务"

                                      totalSpeed > 0 ->
                                          "$activeCount 个进行中 · ${formatSpeed(totalSpeed)}"

                                      else ->
                                          "$activeCount 个任务等待或暂停"
                                  },
                              style =
                                  MaterialTheme.typography.bodySmall,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }

                      if (
                          totalSpeed > 0
                      ) {
                          Surface(
                              shape =
                                  RoundedCornerShape(
                                      50
                                  ),
                              color =
                                  MaterialTheme.colorScheme.primaryContainer
                          ) {
                              Text(
                                  text =
                                      formatSpeed(
                                          totalSpeed
                                      ),
                                  modifier =
                                      Modifier.padding(
                                          horizontal = 10.dp,
                                          vertical = 6.dp
                                      ),
                                  style =
                                      MaterialTheme.typography.labelMedium,
                                  fontWeight =
                                      FontWeight.SemiBold,
                                  color =
                                      MaterialTheme.colorScheme.onPrimaryContainer
                              )
                          }
                      }
                  }

                  Spacer(
                      modifier =
                          Modifier.height(12.dp)
                  )

                  Row(
                      horizontalArrangement =
                          Arrangement.spacedBy(
                              8.dp
                          )
                  ) {
                      FilterChip(
                          selected =
                              selectedCategory == 0,
                          onClick = {
                              onCategoryChange(
                                  0
                              )
                          },
                          label = {
                              Text(
                                  "进行中 $activeCount"
                              )
                          }
                      )

                      FilterChip(
                          selected =
                              selectedCategory == 1,
                          onClick = {
                              onCategoryChange(
                                  1
                              )
                          },
                          label = {
                              Text(
                                  "已完成 $completedCount"
                              )
                          }
                      )
                  }
              }
          }


          @Composable
          private fun DownloadCategoryEmptyState(
              completed: Boolean
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          vertical = 48.dp,
                          horizontal = 24.dp
                      ),
                  horizontalAlignment =
                      Alignment.CenterHorizontally
              ) {
                  Surface(
                      modifier =
                          Modifier.size(56.dp),
                      shape =
                          CircleShape,
                      color =
                          MaterialTheme.colorScheme.surfaceContainerHighest
                  ) {
                      Box(
                          contentAlignment =
                              Alignment.Center
                      ) {
                          Icon(
                              imageVector =
                                  if (completed) {
                                      Icons.Outlined.InsertDriveFile
                                  } else {
                                      Icons.Outlined.Download
                                  },
                              contentDescription =
                                  null,
                              modifier =
                                  Modifier.size(
                                      26.dp
                                  ),
                              tint =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }

                  Spacer(
                      modifier =
                          Modifier.height(
                              14.dp
                          )
                  )

                  Text(
                      text =
                          if (completed) {
                              "暂无已完成任务"
                          } else {
                              "暂无进行中的下载"
                          },
                      style =
                          MaterialTheme.typography.titleMedium,
                      fontWeight =
                          FontWeight.Medium
                  )

                  Spacer(
                      modifier =
                          Modifier.height(
                              4.dp
                          )
                  )

                  Text(
                      text =
                          if (completed) {
                              "下载完成的文件会显示在这里"
                          } else {
                              "添加下载任务后会显示进度、速度和剩余时间"
                          },
                      style =
                          MaterialTheme.typography.bodySmall,
                      color =
                          MaterialTheme.colorScheme.onSurfaceVariant,
                      textAlign =
                          TextAlign.Center
                  )
              }
          }


          @Composable
          private fun DownloadBatchBar('''

          if marker not in text:
              raise RuntimeError(
                  "找不到 DownloadBatchBar 函数"
              )

          text = text.replace(
              marker,
              overview,
              1
          )

          # ========================================================
          # H. 任务卡视觉调整
          #
          # Gopeed 风格：
          # 稍紧凑
          # 减少无意义留白
          # ========================================================
          text = text.replace(
              """Column(modifier = Modifier.padding(14.dp)) {""",
              """Column(modifier = Modifier.padding(12.dp)) {""",
              1
          )

          # 主进度区上间距稍微缩小
          text = text.replace(
              """            Spacer(modifier = Modifier.height(12.dp))

                      // 失败原因""",
              """            Spacer(modifier = Modifier.height(9.dp))

                      // 失败原因""",
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadScreen 9010 优化完成"
          )
          PY

      # ============================================================
      # 6. 检查修改
      # ============================================================
      - name: 检查下载页修改
        shell: bash
        run: |
          set -e

          echo
          echo "================================"
          echo "修改文件"
          echo "================================"

          git status --short

          echo
          echo "================================"
          echo "修改统计"
          echo "================================"

          git diff --stat

          echo
          echo "================================"
          echo "9010 新增功能"
          echo "================================"

          grep -n \
            "DownloadOverviewHeader\|DownloadCategoryEmptyState\|进行中\|已完成\|totalRealtimeSpeed" \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt \
            | head -100

          echo
          echo "================================"
          echo "确认下载核心未修改"
          echo "================================"

          git status --short \
            app/src/main/kotlin/com/yunx/app/data/download/

          echo
          echo "================================"
          echo "diff check"
          echo "================================"

          git diff --check

      # ============================================================
      # 7. 单元测试
      # ============================================================
      - name: 运行单元测试
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-download-ui-test-9010" \
            -PVERSION_CODE="9010" \
            testDebugUnitTest

      # ============================================================
      # 8. Lint
      # ============================================================
      - name: 运行 Android Lint
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-download-ui-test-9010" \
            -PVERSION_CODE="9010" \
            lintDebug

      # ============================================================
      # 9. APK
      # ============================================================
      - name: 构建测试 APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-download-ui-test-9010" \
            -PVERSION_CODE="9010" \
            assembleDebug

      # ============================================================
      # 10. 整理 APK
      # ============================================================
      - name: 整理 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p output

          cp \
            "$APK" \
            "output/StarAssistant-DownloadUI-9010.apk"

          echo
          echo "APK 构建完成："
          ls -lh output/

      # ============================================================
      # 11. 上传
      # ============================================================
      - name: 上传测试 APK
        uses: actions/upload-artifact@v7
        with:
          name: StarAssistant-DownloadUI-9010
          path: output/StarAssistant-DownloadUI-9010.apk
          if-no-files-found: error
          retention-days: 7
