name: Polish Resolve Home UI

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  polish:
    name: Polish resolve home UI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Polish resolve home layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, name):
              global text
              if old not in text:
                  raise SystemExit(
                      f"Required block not found: {name}"
                  )
              text = text.replace(old, new, 1)

          # 页面边距
          replace_once(
              ".padding(\n"
              "                                  horizontal = 16.dp,\n"
              "                                  vertical = 14.dp\n"
              "                              ),\n"
              "\n"
              "                      verticalArrangement =\n"
              "                          Arrangement.spacedBy(\n"
              "                              20.dp\n"
              "                          )",
              ".padding(\n"
              "                                  horizontal = 18.dp,\n"
              "                                  vertical = 12.dp\n"
              "                              ),\n"
              "\n"
              "                      verticalArrangement =\n"
              "                          Arrangement.spacedBy(\n"
              "                              18.dp\n"
              "                          )",
              "page spacing",
          )

          # 主卡片圆角
          replace_once(
              "RoundedCornerShape(\n"
              "                                  28.dp\n"
              "                              )",
              "RoundedCornerShape(\n"
              "                                  24.dp\n"
              "                              )",
              "main card shape",
          )

          # 主卡片内边距
          replace_once(
              ".padding(\n"
              "                                      horizontal = 18.dp,\n"
              "                                      vertical = 20.dp\n"
              "                                  ),\n"
              "\n"
              "                              verticalArrangement =\n"
              "                                  Arrangement.spacedBy(\n"
              "                                      16.dp\n"
              "                                  )",
              ".padding(\n"
              "                                      horizontal = 16.dp,\n"
              "                                      vertical = 16.dp\n"
              "                                  ),\n"
              "\n"
              "                              verticalArrangement =\n"
              "                                  Arrangement.spacedBy(\n"
              "                                      13.dp\n"
              "                                  )",
              "main card padding",
          )

          # 标题图标区域缩小
          replace_once(
              "Modifier.size(\n"
              "                                              42.dp\n"
              "                                          )",
              "Modifier.size(\n"
              "                                              38.dp\n"
              "                                          )",
              "title icon outer size",
          )

          replace_once(
              "RoundedCornerShape(\n"
              "                                                  14.dp\n"
              "                                              )",
              "RoundedCornerShape(\n"
              "                                                  12.dp\n"
              "                                              )",
              "title icon shape",
          )

          replace_once(
              "Modifier.size(\n"
              "                                                      42.dp\n"
              "                                                  )",
              "Modifier.size(\n"
              "                                                      38.dp\n"
              "                                                  )",
              "title icon inner size",
          )

          replace_once(
              "Modifier.size(\n"
              "                                                          23.dp\n"
              "                                                      )",
              "Modifier.size(\n"
              "                                                          21.dp\n"
              "                                                      )",
              "title icon image size",
          )

          # 标题间距
          replace_once(
              "Modifier.width(\n"
              "                                              12.dp\n"
              "                                          )",
              "Modifier.width(\n"
              "                                              10.dp\n"
              "                                          )",
              "title spacing",
          )

          # 标题字号
          replace_once(
              "style =\n"
              "                                          MaterialTheme\n"
              "                                              .typography\n"
              "                                              .titleLarge,\n"
              "\n"
              "                                      fontWeight =\n"
              "                                          FontWeight.SemiBold",
              "style =\n"
              "                                          MaterialTheme\n"
              "                                              .typography\n"
              "                                              .titleMedium,\n"
              "\n"
              "                                      fontWeight =\n"
              "                                          FontWeight.SemiBold",
              "share title style",
          )

          # 链接框缩短
          replace_once(
              ".heightIn(\n"
              "                                                  min = 160.dp\n"
              "                                              )",
              ".heightIn(\n"
              "                                                  min = 145.dp\n"
              "                                              )",
              "link field height",
          )

          replace_once(
              "RoundedCornerShape(\n"
              "                                              22.dp\n"
              "                                          )",
              "RoundedCornerShape(\n"
              "                                              18.dp\n"
              "                                          )",
              "link field shape",
          )

          replace_once(
              "minLines = 5,\n"
              "                                      maxLines = 7,",
              "minLines = 4,\n"
              "                                      maxLines = 6,",
              "link field lines",
          )

          # 删除原来独立占一行的粘贴按钮
          paste_block = (
              "                              // ------------------------------------------\n"
              "                              // 粘贴按钮\n"
              "                              // ------------------------------------------\n"
              "\n"
              "                              Row(\n"
              "                                  modifier =\n"
              "                                      Modifier.fillMaxWidth(),\n"
              "\n"
              "                                  horizontalArrangement =\n"
              "                                      Arrangement.End,\n"
              "\n"
              "                                  verticalAlignment =\n"
              "                                      Alignment.CenterVertically\n"
              "                              ) {\n"
              "                                  FilledTonalButton(\n"
              "                                      onClick =\n"
              "                                          onPasteClipboard,\n"
              "\n"
              "                                      shape =\n"
              "                                          RoundedCornerShape(\n"
              "                                              18.dp\n"
              "                                          )\n"
              "                                  ) {\n"
              "                                      Icon(\n"
              "                                          imageVector =\n"
              "                                              Icons.Outlined.ContentPaste,\n"
              "\n"
              "                                          contentDescription =\n"
              "                                              null,\n"
              "\n"
              "                                          modifier =\n"
              "                                              Modifier.size(\n"
              "                                                  18.dp\n"
              "                                              )\n"
              "                                      )\n"
              "\n"
              "                                      Spacer(\n"
              "                                          modifier =\n"
              "                                              Modifier.width(\n"
              "                                                  6.dp\n"
              "                                              )\n"
              "                                      )\n"
              "\n"
              "                                      Text(\n"
              "                                          text =\n"
              "                                              \"粘贴\",\n"
              "\n"
              "                                          fontWeight =\n"
              "                                              FontWeight.Medium\n"
              "                                      )\n"
              "                                  }\n"
              "                              }\n"
              "\n"
          )

          replace_once(
              paste_block,
              "",
              "standalone paste button",
          )

          # 在链接输入框 Box 的右下角加入小粘贴按钮
          old_link_end = (
              "                                      shape =\n"
              "                                          RoundedCornerShape(\n"
              "                                              18.dp\n"
              "                                          )\n"
              "                                  )\n"
              "                              }\n"
              "\n"
              "                              // ------------------------------------------\n"
              "                              // 提取码\n"
          )

          new_link_end = (
              "                                      shape =\n"
              "                                          RoundedCornerShape(\n"
              "                                              18.dp\n"
              "                                          )\n"
              "                                  )\n"
              "\n"
              "                                  FilledTonalButton(\n"
              "                                      onClick = onPasteClipboard,\n"
              "                                      modifier =\n"
              "                                          Modifier\n"
              "                                              .align(Alignment.BottomEnd)\n"
              "                                              .padding(\n"
              "                                                  end = 10.dp,\n"
              "                                                  bottom = 10.dp\n"
              "                                              )\n"
              "                                              .height(36.dp),\n"
              "                                      shape =\n"
              "                                          RoundedCornerShape(12.dp),\n"
              "                                      contentPadding =\n"
              "                                          PaddingValues(\n"
              "                                              horizontal = 10.dp,\n"
              "                                              vertical = 0.dp\n"
              "                                          )\n"
              "                                  ) {\n"
              "                                      Icon(\n"
              "                                          imageVector =\n"
              "                                              Icons.Outlined.ContentPaste,\n"
              "                                          contentDescription = null,\n"
              "                                          modifier = Modifier.size(15.dp)\n"
              "                                      )\n"
              "\n"
              "                                      Spacer(\n"
              "                                          modifier = Modifier.width(4.dp)\n"
              "                                      )\n"
              "\n"
              "                                      Text(\n"
              "                                          text = \"粘贴\",\n"
              "                                          style =\n"
              "                                              MaterialTheme\n"
              "                                                  .typography\n"
              "                                                  .labelMedium,\n"
              "                                          fontWeight =\n"
              "                                              FontWeight.Medium\n"
              "                                      )\n"
              "                                  }\n"
              "                              }\n"
              "\n"
              "                              // ------------------------------------------\n"
              "                              // 提取码\n"
          )

          replace_once(
              old_link_end,
              new_link_end,
              "embedded paste button",
          )

          # 提取码稍微紧凑
          replace_once(
              "RoundedCornerShape(\n"
              "                                          20.dp\n"
              "                                      )",
              "RoundedCornerShape(\n"
              "                                          16.dp\n"
              "                                      )",
              "password field shape",
          )

          # 主按钮缩短
          replace_once(
              ".height(\n"
              "                                              58.dp\n"
              "                                          )",
              ".height(\n"
              "                                              54.dp\n"
              "                                          )",
              "resolve button height",
          )

          # 删除按钮末尾箭头
          arrow_block = (
              "                                      Spacer(\n"
              "                                          modifier =\n"
              "                                              Modifier.width(\n"
              "                                                  8.dp\n"
              "                                              )\n"
              "                                      )\n"
              "\n"
              "                                      Text(\n"
              "                                          text =\n"
              "                                              \"→\",\n"
              "\n"
              "                                          style =\n"
              "                                              MaterialTheme\n"
              "                                                  .typography\n"
              "                                                  .titleLarge\n"
              "                                      )\n"
          )

          replace_once(
              arrow_block,
              "",
              "resolve arrow",
          )

          # 空历史时完全不显示提示文字
          empty_history = (
              "                      } else {\n"
              "\n"
              "                          // 没有历史时保持干净，不再展示支持平台卡片\n"
              "                          Text(\n"
              "                              text =\n"
              "                                  \"解析过的分享链接会显示在这里\",\n"
              "\n"
              "                              style =\n"
              "                                  MaterialTheme\n"
              "                                      .typography\n"
              "                                      .bodySmall,\n"
              "\n"
              "                              color =\n"
              "                                  MaterialTheme\n"
              "                                      .colorScheme\n"
              "                                      .onSurfaceVariant,\n"
              "\n"
              "                              modifier =\n"
              "                                  Modifier\n"
              "                                      .fillMaxWidth()\n"
              "                                      .padding(\n"
              "                                          horizontal = 4.dp,\n"
              "                                          vertical = 2.dp\n"
              "                                      )\n"
              "                          )\n"
              "                      }\n"
              "\n"
              "                      Spacer(\n"
          )

          clean_history = (
              "                      }\n"
              "\n"
              "                      Spacer(\n"
          )

          replace_once(
              empty_history,
              clean_history,
              "empty history message",
          )

          # PaddingValues import
          padding_import = (
              "import androidx.compose.foundation.layout.PaddingValues\n"
          )

          if padding_import not in text:
              anchor = (
                  "import androidx.compose.foundation.layout.Column\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "Column import not found"
                  )

              text = text.replace(
                  anchor,
                  anchor + padding_import,
                  1,
              )

          path.write_text(
              text,
              encoding="utf-8",
          )
          PY

      - name: Verify source diff
        shell: bash
        run: |
          git diff --check

          git diff -- \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Run Android Lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Build preview APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Polished preview APK:"
          ls -lh "$APK"

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Assistant-Resolve-Polished
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit polished UI
        shell: bash
        run: |
          if git diff --quiet -- \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          then
            echo "No source changes to commit"
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

          git commit \
            -m "style: polish resolve home layout"

          git push \
            origin \
            HEAD:main
