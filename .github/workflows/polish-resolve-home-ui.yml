name: Polish Resolve Home UI

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  polish:
    name: Polish resolve home UI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Polish resolve home layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          # 只处理 ResolveInputContent 到 formatHistoryTime 之间，
          # 避免误改其他页面组件。
          start_marker = "private fun ResolveInputContent("
          end_marker = "/**\n * 将解析时间转换为简短的相对时间。"

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          prefix = text[:start]
          block = text[start:end]
          suffix = text[end:]

          # --------------------------------------------------
          # 页面整体更紧凑
          # --------------------------------------------------

          block = re.sub(
              r'horizontal\s*=\s*16\.dp,\s*'
              r'vertical\s*=\s*14\.dp',
              'horizontal = 18.dp,\n'
              '                    vertical = 12.dp',
              block,
              count=1,
          )

          block = re.sub(
              r'Arrangement\.spacedBy\(\s*20\.dp\s*\)',
              'Arrangement.spacedBy(\n'
              '                18.dp\n'
              '            )',
              block,
              count=1,
          )

          # --------------------------------------------------
          # 主卡片
          # --------------------------------------------------

          block = block.replace(
              "RoundedCornerShape(\n"
              "                    28.dp\n"
              "                )",
              "RoundedCornerShape(\n"
              "                    24.dp\n"
              "                )",
              1,
          )

          block = re.sub(
              r'horizontal\s*=\s*18\.dp,\s*'
              r'vertical\s*=\s*20\.dp',
              'horizontal = 16.dp,\n'
              '                        vertical = 16.dp',
              block,
              count=1,
          )

          block = re.sub(
              r'Arrangement\.spacedBy\(\s*16\.dp\s*\)',
              'Arrangement.spacedBy(\n'
              '                    13.dp\n'
              '                )',
              block,
              count=1,
          )

          # --------------------------------------------------
          # 分享链接标题区域稍微缩小
          # --------------------------------------------------

          block = block.replace(
              "Modifier.size(\n"
              "                            42.dp\n"
              "                        )",
              "Modifier.size(\n"
              "                            38.dp\n"
              "                        )",
              1,
          )

          block = block.replace(
              "RoundedCornerShape(\n"
              "                                14.dp\n"
              "                            )",
              "RoundedCornerShape(\n"
              "                                12.dp\n"
              "                            )",
              1,
          )

          block = block.replace(
              "Modifier.size(\n"
              "                                    42.dp\n"
              "                                )",
              "Modifier.size(\n"
              "                                    38.dp\n"
              "                                )",
              1,
          )

          block = block.replace(
              "Modifier.size(\n"
              "                                        23.dp\n"
              "                                    )",
              "Modifier.size(\n"
              "                                        21.dp\n"
              "                                    )",
              1,
          )

          # --------------------------------------------------
          # 链接输入框缩短
          # --------------------------------------------------

          block = re.sub(
              r'\.heightIn\(\s*min\s*=\s*160\.dp\s*\)',
              '.heightIn(\n'
              '                                min = 145.dp\n'
              '                            )',
              block,
              count=1,
          )

          block = block.replace(
              "minLines = 5,\n"
              "                        maxLines = 7,",
              "minLines = 4,\n"
              "                        maxLines = 6,",
              1,
          )

          # --------------------------------------------------
          # 找到原独立粘贴按钮并删除
          # --------------------------------------------------

          paste_comment = (
              "// ------------------------------------------\n"
              "                // 粘贴按钮\n"
              "                // ------------------------------------------"
          )

          paste_index = block.find(paste_comment)

          if paste_index == -1:
              # 兼容不同缩进
              match = re.search(
                  r'//\s*-+\s*\n'
                  r'\s*//\s*粘贴按钮\s*\n'
                  r'\s*//\s*-+',
                  block,
              )
              if not match:
                  raise SystemExit(
                      "Paste button section not found"
                  )
              paste_index = match.start()

          password_match = re.search(
              r'\n\s*//\s*-+\s*\n'
              r'\s*//\s*提取码\s*\n'
              r'\s*//\s*-+',
              block[paste_index:],
          )

          if not password_match:
              raise SystemExit(
                  "Password section not found"
              )

          password_index = (
              paste_index + password_match.start()
          )

          block = (
              block[:paste_index]
              + block[password_index:]
          )

          # --------------------------------------------------
          # 在链接输入框 Box 右下角放小粘贴按钮
          # --------------------------------------------------

          field_marker = 'placeholder = {'
          field_pos = block.find(field_marker)

          if field_pos == -1:
              raise SystemExit(
                  "Link field not found"
              )

          password_pos = block.find(
              "// 提取码",
              field_pos,
          )

          if password_pos == -1:
              raise SystemExit(
                  "Password marker not found"
              )

          before_password = block[:password_pos]

          # 找输入框外层 Box 关闭位置：
          # OutlinedTextField 结束后紧跟 Box 的 }
          matches = list(
              re.finditer(
                  r'\n\s*\)\s*\n\s*\}\s*\n',
                  before_password[field_pos:],
              )
          )

          if not matches:
              raise SystemExit(
                  "Link input box end not found"
              )

          m = matches[-1]

          insert_pos = (
              field_pos
              + m.start()
          )

          original_end = (
              before_password[
                  insert_pos:
                  field_pos + m.end()
              ]
          )

          paste_button = '''
                                  )

                                  FilledTonalButton(
                                      onClick = onPasteClipboard,
                                      modifier =
                                          Modifier
                                              .align(
                                                  Alignment.BottomEnd
                                              )
                                              .padding(
                                                  end = 10.dp,
                                                  bottom = 10.dp
                                              )
                                              .height(36.dp),
                                      shape =
                                          RoundedCornerShape(
                                              12.dp
                                          ),
                                      contentPadding =
                                          PaddingValues(
                                              horizontal = 10.dp,
                                              vertical = 0.dp
                                          )
                                  ) {
                                      Icon(
                                          imageVector =
                                              Icons.Outlined.ContentPaste,
                                          contentDescription = null,
                                          modifier =
                                              Modifier.size(15.dp)
                                      )

                                      Spacer(
                                          modifier =
                                              Modifier.width(4.dp)
                                      )

                                      Text(
                                          text = "粘贴",
                                          style =
                                              MaterialTheme
                                                  .typography
                                                  .labelMedium,
                                          fontWeight =
                                              FontWeight.Medium
                                      )
                                  }
                              }
          '''

          # 原位置只保留 OutlinedTextField 的 )，
          # 再插入按钮和 Box 的 }
          block = (
              block[:insert_pos]
              + paste_button
              + block[field_pos + m.end():]
          )

          # --------------------------------------------------
          # 提取码和主按钮更紧凑
          # --------------------------------------------------

          block = re.sub(
              r'RoundedCornerShape\(\s*20\.dp\s*\)',
              'RoundedCornerShape(\n'
              '                        16.dp\n'
              '                    )',
              block,
              count=1,
          )

          block = re.sub(
              r'\.height\(\s*58\.dp\s*\)',
              '.height(\n'
              '                            54.dp\n'
              '                        )',
              block,
              count=1,
          )

          # --------------------------------------------------
          # 删除“开始解析”后的箭头
          # --------------------------------------------------

          block = re.sub(
              r'\s*Spacer\(\s*'
              r'modifier\s*=\s*'
              r'Modifier\.width\(\s*8\.dp\s*\)\s*'
              r'\)\s*'
              r'Text\(\s*'
              r'text\s*=\s*"→",\s*'
              r'style\s*=\s*'
              r'MaterialTheme\s*'
              r'\.typography\s*'
              r'\.titleLarge\s*'
              r'\)',
              '',
              block,
              count=1,
              flags=re.S,
          )

          # --------------------------------------------------
          # 没历史记录时不显示提示
          # --------------------------------------------------

          block = re.sub(
              r'\}\s*else\s*\{\s*'
              r'//\s*没有历史时保持干净.*?'
              r'Text\(\s*'
              r'text\s*=\s*'
              r'"解析过的分享链接会显示在这里".*?'
              r'\)\s*'
              r'\}',
              '}',
              block,
              count=1,
              flags=re.S,
          )

          # --------------------------------------------------
          # PaddingValues import
          # --------------------------------------------------

          full = prefix + block + suffix

          padding_import = (
              "import androidx.compose.foundation.layout.PaddingValues\n"
          )

          if padding_import not in full:
              anchor = (
                  "import androidx.compose.foundation.layout.Column\n"
              )

              if anchor not in full:
                  raise SystemExit(
                      "Column import not found"
                  )

              full = full.replace(
                  anchor,
                  anchor + padding_import,
                  1,
              )

          path.write_text(
              full,
              encoding="utf-8",
          )
          PY

      - name: Verify source diff
        shell: bash
        run: |
          git diff --check

          git diff -- \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Run Android Lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Build preview APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Assistant-Resolve-Polished
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit polished UI
        shell: bash
        run: |
          git diff --check

          if git diff --quiet -- \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          then
            echo "No source changes to commit"
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

          git commit \
            -m "style: polish resolve home layout"

          git push \
            origin \
            HEAD:main
