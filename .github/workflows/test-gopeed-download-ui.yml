name: 测试版 - 下载页体验优化 9011

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starassistant-download-ui-9011
  cancel-in-progress: true

env:
  YUNX_USE_MIRROR: "false"

jobs:
  build:
    name: 构建下载页 9011 测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. 检出源码
      # ============================================================
      - name: 检出源码
        uses: actions/checkout@v7

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 构建组件
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. Gradle
      # ============================================================
      - name: 配置 Gradle
        shell: bash
        run: |
          set -e

          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 5. 优化本地下载页
      #
      # 只修改 DownloadScreen.kt
      #
      # 不修改：
      # DownloadManager
      # ChunkDownloader
      # DownloadService
      # 数据库
      # 各网盘下载逻辑
      # ============================================================
      - name: 应用下载页体验优化
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # 1. FilterChip import
          # ========================================================
          if (
              "import androidx.compose.material3.FilterChip"
              not in text
          ):
              marker = (
                  "import androidx.compose.material3.FloatingActionButton\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "找不到 FloatingActionButton import"
                  )

              text = text.replace(
                  marker,
                  marker
                  +
                  "import androidx.compose.material3.FilterChip\n",
                  1
              )

          # ========================================================
          # 2. 添加分类状态、总速度
          # ========================================================
          old_state = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }"""

          new_state = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }

              // 下载任务分类
              // 0 = 进行中
              // 1 = 已完成
              var downloadCategory by remember {
                  mutableStateOf(0)
              }

              val activeTasks = tasks.filter {
                  it.status !=
                      DownloadTaskEntity.STATUS_COMPLETED
              }

              val completedTasks = tasks.filter {
                  it.status ==
                      DownloadTaskEntity.STATUS_COMPLETED
              }

              val visibleTasks =
                  if (downloadCategory == 0) {
                      activeTasks
                  } else {
                      completedTasks
                  }

              val totalRealtimeSpeed =
                  activeTasks.sumOf { task ->
                      stats[task.id]?.speed ?: 0L
                  }"""

          if old_state not in text:
              raise RuntimeError(
                  "找不到 DownloadScreen 状态区"
              )

          text = text.replace(
              old_state,
              new_state,
              1
          )

          # ========================================================
          # 3. 顶部加入下载概览
          # ========================================================
          old_column = """            Column(modifier = Modifier.fillMaxSize()) {
                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          new_column = """            Column(modifier = Modifier.fillMaxSize()) {

                          DownloadOverviewHeader(
                              selectedCategory = downloadCategory,
                              activeCount = activeTasks.size,
                              completedCount = completedTasks.size,
                              totalSpeed = totalRealtimeSpeed,
                              onCategoryChange = {
                                  downloadCategory = it
                              }
                          )

                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          if old_column not in text:
              raise RuntimeError(
                  "找不到 DownloadBatchBar 插入位置"
              )

          text = text.replace(
              old_column,
              new_column,
              1
          )

          # ========================================================
          # 4. 当前分类过滤根目录任务
          # ========================================================
          old_root = (
              "val rootTasks = tasks.filter"
          )

          if old_root not in text:
              raise RuntimeError(
                  "找不到 rootTasks"
              )

          text = text.replace(
              old_root,
              "val rootTasks = visibleTasks.filter",
              1
          )

          # ========================================================
          # 5. 当前分类过滤文件夹任务
          #
          # 这里不再匹配完整多行代码，
          # 只替换关键部分。
          # ========================================================
          old_folder = (
              "val folderGroups = tasks.filter"
          )

          if old_folder not in text:
              raise RuntimeError(
                  "找不到 folderGroups"
              )

          text = text.replace(
              old_folder,
              "val folderGroups = visibleTasks.filter",
              1
          )

          # ========================================================
          # 6. 当前分类没有任务时显示空页面
          # ========================================================
          items_marker = (
              "                    items(rootTasks, key = { it.id }) { task ->"
          )

          items_new = """                    if (visibleTasks.isEmpty()) {
                                  item(
                                      key = "download_category_empty"
                                  ) {
                                      DownloadCategoryEmptyState(
                                          completed =
                                              downloadCategory == 1
                                      )
                                  }
                              }

                              items(rootTasks, key = { it.id }) { task ->"""

          if items_marker not in text:
              raise RuntimeError(
                  "找不到 rootTasks items"
              )

          text = text.replace(
              items_marker,
              items_new,
              1
          )

          # ========================================================
          # 7. 插入顶部组件
          # ========================================================
          function_marker = """@Composable
          private fun DownloadBatchBar("""

          component = r'''@Composable
          private fun DownloadOverviewHeader(
              selectedCategory: Int,
              activeCount: Int,
              completedCount: Int,
              totalSpeed: Long,
              onCategoryChange: (Int) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          start = 16.dp,
                          end = 16.dp,
                          top = 8.dp,
                          bottom = 4.dp
                      )
              ) {
                  Row(
                      modifier =
                          Modifier.fillMaxWidth(),
                      verticalAlignment =
                          Alignment.CenterVertically
                  ) {
                      Column(
                          modifier =
                              Modifier.weight(1f)
                      ) {
                          Text(
                              text = "下载任务",
                              style =
                                  MaterialTheme.typography.titleLarge,
                              fontWeight =
                                  FontWeight.SemiBold
                          )

                          Spacer(
                              modifier =
                                  Modifier.height(3.dp)
                          )

                          Text(
                              text =
                                  when {
                                      activeCount == 0 ->
                                          "当前没有正在下载的任务"

                                      totalSpeed > 0 ->
                                          "$activeCount 个进行中 · ${formatSpeed(totalSpeed)}"

                                      else ->
                                          "$activeCount 个任务等待、暂停或失败"
                                  },
                              style =
                                  MaterialTheme.typography.bodySmall,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }

                      if (totalSpeed > 0) {
                          Surface(
                              shape =
                                  RoundedCornerShape(50),
                              color =
                                  MaterialTheme.colorScheme.primaryContainer
                          ) {
                              Text(
                                  text =
                                      formatSpeed(totalSpeed),
                                  modifier =
                                      Modifier.padding(
                                          horizontal = 10.dp,
                                          vertical = 6.dp
                                      ),
                                  style =
                                      MaterialTheme.typography.labelMedium,
                                  fontWeight =
                                      FontWeight.SemiBold,
                                  color =
                                      MaterialTheme.colorScheme.onPrimaryContainer
                              )
                          }
                      }
                  }

                  Spacer(
                      modifier =
                          Modifier.height(12.dp)
                  )

                  Row(
                      horizontalArrangement =
                          Arrangement.spacedBy(8.dp)
                  ) {
                      FilterChip(
                          selected =
                              selectedCategory == 0,
                          onClick = {
                              onCategoryChange(0)
                          },
                          label = {
                              Text(
                                  "进行中 $activeCount"
                              )
                          }
                      )

                      FilterChip(
                          selected =
                              selectedCategory == 1,
                          onClick = {
                              onCategoryChange(1)
                          },
                          label = {
                              Text(
                                  "已完成 $completedCount"
                              )
                          }
                      )
                  }
              }
          }


          @Composable
          private fun DownloadCategoryEmptyState(
              completed: Boolean
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          vertical = 52.dp,
                          horizontal = 24.dp
                      ),
                  horizontalAlignment =
                      Alignment.CenterHorizontally
              ) {
                  Surface(
                      modifier =
                          Modifier.size(58.dp),
                      shape =
                          CircleShape,
                      color =
                          MaterialTheme.colorScheme.surfaceContainerHighest
                  ) {
                      Box(
                          contentAlignment =
                              Alignment.Center
                      ) {
                          Icon(
                              imageVector =
                                  if (completed) {
                                      Icons.Outlined.InsertDriveFile
                                  } else {
                                      Icons.Outlined.Download
                                  },
                              contentDescription =
                                  null,
                              modifier =
                                  Modifier.size(27.dp),
                              tint =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }

                  Spacer(
                      modifier =
                          Modifier.height(14.dp)
                  )

                  Text(
                      text =
                          if (completed) {
                              "暂无已完成任务"
                          } else {
                              "暂无进行中的下载"
                          },
                      style =
                          MaterialTheme.typography.titleMedium,
                      fontWeight =
                          FontWeight.Medium
                  )

                  Spacer(
                      modifier =
                          Modifier.height(5.dp)
                  )

                  Text(
                      text =
                          if (completed) {
                              "下载完成的文件会自动显示在这里"
                          } else {
                              "新任务会在这里显示进度、速度和剩余时间"
                          },
                      style =
                          MaterialTheme.typography.bodySmall,
                      color =
                          MaterialTheme.colorScheme.onSurfaceVariant,
                      textAlign =
                          TextAlign.Center
                  )
              }
          }


          @Composable
          private fun DownloadBatchBar('''

          if function_marker not in text:
              raise RuntimeError(
                  "找不到 DownloadBatchBar 函数"
              )

          text = text.replace(
              function_marker,
              component,
              1
          )

          # ========================================================
          # 8. 任务卡稍微紧凑
          # ========================================================
          text = text.replace(
              "Column(modifier = Modifier.padding(14.dp)) {",
              "Column(modifier = Modifier.padding(12.dp)) {",
              1
          )

          # ========================================================
          # 9. 保存
          # ========================================================
          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadScreen 9011 修改完成"
          )

          print(
              "rootTasks visible:",
              "val rootTasks = visibleTasks.filter"
              in text
          )

          print(
              "folderGroups visible:",
              "val folderGroups = visibleTasks.filter"
              in text
          )

          print(
              "overview:",
              "DownloadOverviewHeader("
              in text
          )
          PY

      # ============================================================
      # 6. 检查补丁
      # ============================================================
      - name: 检查下载页修改
        shell: bash
        run: |
          set -e

          echo
          echo "======================================"
          echo "修改文件"
          echo "======================================"

          git status --short

          echo
          echo "======================================"
          echo "修改统计"
          echo "======================================"

          git diff --stat

          echo
          echo "======================================"
          echo "分类过滤"
          echo "======================================"

          grep -n \
            "val rootTasks\|val folderGroups\|visibleTasks" \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt \
            | head -50

          echo
          echo "======================================"
          echo "顶部概览"
          echo "======================================"

          grep -n \
            "DownloadOverviewHeader\|totalRealtimeSpeed\|进行中\|已完成" \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt \
            | head -100

          echo
          echo "======================================"
          echo "确认下载核心未修改"
          echo "======================================"

          if git diff --name-only | \
             grep -q "app/src/main/kotlin/com/yunx/app/data/download"; then
            echo "错误：工作流修改了下载核心"
            exit 1
          else
            echo "OK：下载核心没有修改"
          fi

          echo
          echo "======================================"
          echo "diff check"
          echo "======================================"

          git diff --check

      # ============================================================
      # 7. 单元测试
      # ============================================================
      - name: 运行单元测试
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-download-ui-test-9011" \
            -PVERSION_CODE="9011" \
            testDebugUnitTest

      # ============================================================
      # 8. Android Lint
      # ============================================================
      - name: 运行 Android Lint
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-download-ui-test-9011" \
            -PVERSION_CODE="9011" \
            lintDebug

      # ============================================================
      # 9. 构建 Debug APK
      # ============================================================
      - name: 构建测试 APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-download-ui-test-9011" \
            -PVERSION_CODE="9011" \
            assembleDebug

      # ============================================================
      # 10. 整理 APK
      # ============================================================
      - name: 整理 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p output

          cp \
            "$APK" \
            "output/StarAssistant-DownloadUI-9011.apk"

          echo
          echo "======================================"
          echo "APK 构建完成"
          echo "======================================"

          ls -lh output/

      # ============================================================
      # 11. 上传 APK
      # ============================================================
      - name: 上传测试 APK
        uses: actions/upload-artifact@v7
        with:
          name: StarAssistant-DownloadUI-9011
          path: output/StarAssistant-DownloadUI-9011.apk
          if-no-files-found: error
          retention-days: 7
