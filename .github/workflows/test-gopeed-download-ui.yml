           * GNU Affero General Public License for more details.
           *
           * You should have received a copy of the GNU Affero General Public License
           * along with this program. If not, see <https://www.gnu.org/licenses/>.
           */

          package com.yunx.app.ui.resolve

          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.layout.width
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.Download
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import com.yunx.app.data.download.DownloadDispatchMode
          import com.yunx.app.data.network.model.DownloadLink

          @Composable
          fun DownloadLinkDialog(
              link: DownloadLink,
              onDownload: () -> Unit,
              onDismiss: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              AlertDialog(
                  onDismissRequest = {
                      DownloadDispatchMode.clear()
                      onDismiss()
                  },

                  title = {
                      Text(
                          text = link.filename,
                          style = MaterialTheme.typography.titleMedium,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                  },

                  text = {
                      Column {
                          Text(
                              text =
                                  "文件已准备好，可以开始下载。",
                              style =
                                  MaterialTheme.typography.bodyMedium,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )

                          if (
                              link.size > 0L
                          ) {
                              Text(
                                  text =
                                      "大小：${formatFileSize(link.size)}",
                                  modifier =
                                      Modifier.padding(
                                          top = 8.dp
                                      ),
                                  style =
                                      MaterialTheme.typography.bodySmall,
                                  color =
                                      MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }

                          Text(
                              text =
                                  "请选择本地下载或发送到 Gopeed。",
                              modifier =
                                  Modifier.padding(
                                      top = 12.dp
                                  ),
                              style =
                                  MaterialTheme.typography.bodySmall,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  },

                  confirmButton = {
                      Row {
                          TextButton(
                              onClick = {
                                  DownloadDispatchMode
                                      .requestGopeed()

                                  onDownload()
                              }
                          ) {
                              Text(
                                  "Gopeed"
                              )
                          }

                          Spacer(
                              modifier =
                                  Modifier.width(
                                      6.dp
                                  )
                          )

                          Button(
                              onClick = {
                                  DownloadDispatchMode
                                      .clear()

                                  onDownload()
                              }
                          ) {
                              Icon(
                                  imageVector =
                                      Icons.Outlined.Download,
                                  contentDescription =
                                      null,
                                  modifier =
                                      Modifier.size(
                                          16.dp
                                      )
                              )

                              Spacer(
                                  modifier =
                                      Modifier.width(
                                          6.dp
                                      )
                              )

                              Text(
                                  "本地下载"
                              )
                          }
                      }
                  },

                  dismissButton = {
                      TextButton(
                          onClick = {
                              DownloadDispatchMode
                                  .clear()

                              onDismiss()
                          }
                      ) {
                          Text(
                              "关闭"
                          )
                      }
                  },

                  modifier =
                      modifier
              )
          }

          private fun formatFileSize(
              bytes: Long
          ): String {

              if (
                  bytes <= 0L
              ) {
                  return "未知"
              }

              val units =
                  arrayOf(
                      "B",
                      "KB",
                      "MB",
                      "GB",
                      "TB"
                  )

              var value =
                  bytes.toDouble()

              var unit =
                  0

              while (
                  value >= 1024.0 &&
                  unit < units.lastIndex
              ) {
                  value /= 1024.0
                  unit++
              }

              return if (
                  unit == 0
              ) {
                  "$bytes ${units[unit]}"
              } else {
                  String.format(
                      java.util.Locale.US,
                      "%.2f %s",
                      value,
                      units[unit]
                  )
              }
          }
          EOF

      # ============================================================
      # 5. 本地下载页面继续保留 9005 的分类优化
      # ============================================================
      - name: 优化本地下载页面
        shell: bash
        run: |
