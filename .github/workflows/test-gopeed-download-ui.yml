name: 测试版 - Gopeed 下载选择 9005

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starassistant-gopeed-download-test
  cancel-in-progress: true

env:
  YUNX_USE_MIRROR: "false"

jobs:
  build:
    name: 构建 Gopeed 下载选择测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 构建组件
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置 Gradle
        shell: bash
        run: |
          set -e

          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 1. 添加 Gopeed 下载调度状态
      # ============================================================
      - name: 添加 Gopeed 下载调度
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadDispatchMode.kt \
            <<'EOF'
          package com.yunx.app.data.download

          import java.util.concurrent.atomic.AtomicLong

          object DownloadDispatchMode {

              private const val EXPIRE_MS =
                  15_000L

              private val gopeedRequestedAt =
                  AtomicLong(0L)

              fun requestGopeed() {
                  gopeedRequestedAt.set(
                      System.currentTimeMillis()
                  )
              }

              fun consumeGopeed(): Boolean {
                  val requestedAt =
                      gopeedRequestedAt.getAndSet(0L)

                  if (requestedAt <= 0L) {
                      return false
                  }

                  return (
                      System.currentTimeMillis() -
                          requestedAt
                      ) <= EXPIRE_MS
              }

              fun clear() {
                  gopeedRequestedAt.set(0L)
              }
          }
          EOF

      # ============================================================
      # 2. 修改 DownloadManager
      #
      # 优先：
      # ACTION_SEND + text/plain
      #
      # 回退：
      # ACTION_VIEW + */*
      # ============================================================
      - name: 接入 Gopeed
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          marker = """    /** 入队并立即开始下载 */
              suspend fun enqueue("""

          if marker not in text:
              raise RuntimeError(
                  "没有找到 DownloadManager.enqueue"
              )

          helper = r'''    /**
               * 将下载链接交给 Gopeed。
               *
               * 第一优先：
               * ACTION_SEND
               *
               * Gopeed Android 当前明确注册了：
               * android.intent.action.SEND
               *
               * 如果分享失败，
               * 再回退到带 MIME 的 ACTION_VIEW。
               */
              private fun sendToGopeed(
                  url: String
              ): Boolean {
                  if (url.isBlank()) {
                      return false
                  }

                  // --------------------------------------------
                  // 方式 1：
                  // ACTION_SEND
                  // --------------------------------------------
                  val sendIntent =
                      android.content.Intent(
                          android.content.Intent.ACTION_SEND
                      ).apply {
                          type = "text/plain"

                          putExtra(
                              android.content.Intent.EXTRA_TEXT,
                              url
                          )

                          setPackage(
                              "com.gopeed.gopeed"
                          )

                          addFlags(
                              android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                          )
                      }

                  try {
                      context.startActivity(
                          sendIntent
                      )

                      android.os.Handler(
                          context.mainLooper
                      ).post {
                          android.widget.Toast.makeText(
                              context,
                              "已发送到 Gopeed",
                              android.widget.Toast.LENGTH_SHORT
                          ).show()
                      }

                      return true
                  } catch (
                      e: Exception
                  ) {
                      android.util.Log.w(
                          "YunX-DL",
                          "Gopeed ACTION_SEND failed: ${e.message}"
                      )
                  }

                  // --------------------------------------------
                  // 方式 2：
                  // ACTION_VIEW
                  //
                  // Gopeed Manifest 的 HTTP/HTTPS intent-filter
                  // 同时声明了 mimeType="*/*"
                  // --------------------------------------------
                  val viewIntent =
                      android.content.Intent(
                          android.content.Intent.ACTION_VIEW
                      ).apply {
                          setDataAndType(
                              android.net.Uri.parse(url),
                              "*/*"
                          )

                          setPackage(
                              "com.gopeed.gopeed"
                          )

                          addFlags(
                              android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                          )
                      }

                  try {
                      context.startActivity(
                          viewIntent
                      )

                      android.os.Handler(
                          context.mainLooper
                      ).post {
                          android.widget.Toast.makeText(
                              context,
                              "已发送到 Gopeed",
                              android.widget.Toast.LENGTH_SHORT
                          ).show()
                      }

                      return true
                  } catch (
                      e: Exception
                  ) {
                      android.util.Log.w(
                          "YunX-DL",
                          "Gopeed ACTION_VIEW failed: ${e.message}"
                      )
                  }

                  android.os.Handler(
                      context.mainLooper
                  ).post {
                      android.widget.Toast.makeText(
                          context,
                          "无法打开 Gopeed，请确认已安装最新版 Gopeed",
                          android.widget.Toast.LENGTH_LONG
                      ).show()
                  }

                  return false
              }


              /** 入队并立即开始下载 */
              suspend fun enqueue('''

          text = text.replace(
              marker,
              helper,
              1
          )

          old = """): Long {
                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳
                  val safeName = fileName.ifBlank {"""

          new = """): Long {

                  /*
                   * 用户在确认弹窗选择 Gopeed 时，
                   * 本次不创建本地下载任务。
                   */
                  if (
                      DownloadDispatchMode.consumeGopeed()
                  ) {
                      sendToGopeed(url)

                      return -1L
                  }

                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳
                  val safeName = fileName.ifBlank {"""

          if old not in text:
              raise RuntimeError(
                  "没有找到 enqueue 函数体入口"
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadManager Gopeed 接入完成"
          )
          PY

      # ============================================================
      # 3. 直接覆盖下载确认弹窗
      # ============================================================
      - name: 更新下载确认弹窗
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt \
            <<'EOF'
          /*
           * YunX (云析) - A network drive share-link parser and high-speed downloader for Android.
           * Copyright (C) 2026 CYQawa
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU Affero General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the
           * GNU Affero General Public License for more details.
           *
           * You should have received a copy of the GNU Affero General Public License
           * along with this program. If not, see <https://www.gnu.org/licenses/>.
           */

          package com.yunx.app.ui.resolve

          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.layout.width
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.Download
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import com.yunx.app.data.download.DownloadDispatchMode
          import com.yunx.app.data.network.model.DownloadLink

          @Composable
          fun DownloadLinkDialog(
              link: DownloadLink,
              onDownload: () -> Unit,
              onDismiss: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              AlertDialog(
                  onDismissRequest = {
                      DownloadDispatchMode.clear()
                      onDismiss()
                  },

                  title = {
                      Text(
                          text = link.filename,
                          style = MaterialTheme.typography.titleMedium,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                  },

                  text = {
                      Column {
                          Text(
                              text = "文件已准备好，可以开始下载。",
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )

                          if (link.size > 0L) {
                              Text(
                                  text = "大小：${formatFileSize(link.size)}",
                                  modifier = Modifier.padding(top = 8.dp),
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }

                          Text(
                              text = "请选择下载方式。",
                              modifier = Modifier.padding(top = 12.dp),
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  },

                  confirmButton = {
                      Row {
                          TextButton(
                              onClick = {
                                  DownloadDispatchMode.requestGopeed()
                                  onDownload()
                              }
                          ) {
                              Text(
                                  "Gopeed"
                              )
                          }

                          Spacer(
                              modifier = Modifier.width(6.dp)
                          )

                          Button(
                              onClick = {
                                  DownloadDispatchMode.clear()
                                  onDownload()
                              }
                          ) {
                              Icon(
                                  imageVector = Icons.Outlined.Download,
                                  contentDescription = null,
                                  modifier = Modifier.size(16.dp)
                              )

                              Spacer(
                                  modifier = Modifier.width(6.dp)
                              )

                              Text(
                                  "本地下载"
                              )
                          }
                      }
                  },

                  dismissButton = {
                      TextButton(
                          onClick = {
                              DownloadDispatchMode.clear()
                              onDismiss()
                          }
                      ) {
                          Text(
                              "关闭"
                          )
                      }
                  },

                  modifier = modifier
              )
          }

          private fun formatFileSize(
              bytes: Long
          ): String {
              if (bytes <= 0L) {
                  return "未知"
              }

              val units = arrayOf(
                  "B",
                  "KB",
                  "MB",
                  "GB",
                  "TB"
              )

              var value =
                  bytes.toDouble()

              var unit =
                  0

              while (
                  value >= 1024.0 &&
                  unit < units.lastIndex
              ) {
                  value /= 1024.0
                  unit++
              }

              return if (
                  unit == 0
              ) {
                  "$bytes ${units[unit]}"
              } else {
                  String.format(
                      java.util.Locale.US,
                      "%.2f %s",
                      value,
                      units[unit]
                  )
              }
          }
          EOF

      # ============================================================
      # 4. 优化下载页面
      # ============================================================
      - name: 优化本地下载页面
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if (
              "import androidx.compose.material3.FilterChip"
              not in text
          ):
              marker = (
                  "import androidx.compose.material3.FloatingActionButton\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "无法找到 FloatingActionButton import"
                  )

              text = text.replace(
                  marker,
                  marker
                  +
                  "import androidx.compose.material3.FilterChip\n",
                  1
              )

          old = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }"""

          new = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }

              var downloadCategory by remember {
                  mutableStateOf(0)
              }

              val activeTasks = tasks.filter {
                  it.status != DownloadTaskEntity.STATUS_COMPLETED
              }

              val completedTasks = tasks.filter {
                  it.status == DownloadTaskEntity.STATUS_COMPLETED
              }

              val visibleTasks =
                  if (downloadCategory == 0) {
                      activeTasks
                  } else {
                      completedTasks
                  }"""

          if old not in text:
              raise RuntimeError(
                  "无法找到 DownloadScreen 状态区域"
              )

          text = text.replace(
              old,
              new,
              1
          )

          old = """            Column(modifier = Modifier.fillMaxSize()) {
                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          new = """            Column(modifier = Modifier.fillMaxSize()) {

                          DownloadCategoryBar(
                              selectedCategory = downloadCategory,
                              activeCount = activeTasks.size,
                              completedCount = completedTasks.size,
                              onCategoryChange = {
                                  downloadCategory = it
                              }
                          )

                          // 批量操作栏
                          DownloadBatchBar("""

          if old not in text:
              raise RuntimeError(
                  "无法找到 DownloadBatchBar 插入位置"
              )

          text = text.replace(
              old,
              new,
              1
          )

          text = text.replace(
              """val rootTasks = tasks.filter { !it.fileName.contains('/') }""",
              """val rootTasks = visibleTasks.filter { !it.fileName.contains('/') }""",
              1
          )

          text = text.replace(
              """val folderGroups = tasks.filter { it.fileName.contains('/') }""",
              """val folderGroups = visibleTasks.filter { it.fileName.contains('/') }""",
              1
          )

          marker = """@Composable
          private fun DownloadBatchBar("""

          component = r'''@Composable
          private fun DownloadCategoryBar(
              selectedCategory: Int,
              activeCount: Int,
              completedCount: Int,
              onCategoryChange: (Int) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          start = 16.dp,
                          end = 16.dp,
                          top = 8.dp,
                          bottom = 4.dp
                      )
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(
                          modifier = Modifier.weight(1f)
                      ) {
                          Text(
                              text = "下载任务",
                              style = MaterialTheme.typography.titleLarge,
                              fontWeight = FontWeight.SemiBold
                          )

                          Spacer(
                              modifier = Modifier.height(2.dp)
                          )

                          Text(
                              text =
                                  if (activeCount > 0) {
                                      "$activeCount 个任务正在等待或下载"
                                  } else {
                                      "当前没有进行中的下载"
                                  },
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }

                      if (activeCount > 0) {
                          Surface(
                              shape = RoundedCornerShape(50),
                              color = MaterialTheme.colorScheme.primaryContainer
                          ) {
                              Text(
                                  text = "$activeCount",
                                  style = MaterialTheme.typography.labelMedium,
                                  fontWeight = FontWeight.SemiBold,
                                  color = MaterialTheme.colorScheme.onPrimaryContainer,
                                  modifier = Modifier.padding(
                                      horizontal = 10.dp,
                                      vertical = 5.dp
                                  )
                              )
                          }
                      }
                  }

                  Spacer(
                      modifier = Modifier.height(12.dp)
                  )

                  Row(
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      FilterChip(
                          selected = selectedCategory == 0,
                          onClick = {
                              onCategoryChange(0)
                          },
                          label = {
                              Text(
                                  "进行中 $activeCount"
                              )
                          }
                      )

                      FilterChip(
                          selected = selectedCategory == 1,
                          onClick = {
                              onCategoryChange(1)
                          },
                          label = {
                              Text(
                                  "已完成 $completedCount"
                              )
                          }
                      )
                  }
              }
          }


          @Composable
          private fun DownloadBatchBar('''

          if marker not in text:
              raise RuntimeError(
                  "无法找到 DownloadBatchBar"
              )

          text = text.replace(
              marker,
              component,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # 5. 检查修改
      # ============================================================
      - name: 检查修改结果
        shell: bash
        run: |
          set -e

          echo
          echo "========= 修改文件 ========="
          git status --short

          echo
          echo "========= 修改统计 ========="
          git diff --stat

          echo
          echo "========= Gopeed 调用 ========="

          grep -R -n \
            "ACTION_SEND\|ACTION_VIEW\|com.gopeed.gopeed\|Gopeed" \
            app/src/main/kotlin/com/yunx/app/data/download \
            app/src/main/kotlin/com/yunx/app/ui/resolve \
            | head -150

          echo
          echo "========= 下载分类 ========="

          grep -n \
            "DownloadCategoryBar\|进行中\|已完成" \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt \
            | head -100

          echo
          echo "========= diff check ========="

          git diff --check

      # ============================================================
      # 6. 单元测试
      # ============================================================
      - name: 运行单元测试
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-gopeed-test-9005" \
            -PVERSION_CODE="9005" \
            testDebugUnitTest

      # ============================================================
      # 7. Lint
      # ============================================================
      - name: 运行 Android Lint
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-gopeed-test-9005" \
            -PVERSION_CODE="9005" \
            lintDebug

      # ============================================================
      # 8. 构建 APK
      # ============================================================
      - name: 构建测试 APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-gopeed-test-9005" \
            -PVERSION_CODE="9005" \
            assembleDebug

      # ============================================================
      # 9. 整理 APK
      # ============================================================
      - name: 整理 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p output

          cp \
            "$APK" \
            "output/StarAssistant-Gopeed-Test-9005.apk"

          ls -lh output/

      # ============================================================
      # 10. 上传 APK
      # ============================================================
      - name: 上传测试 APK
        uses: actions/upload-artifact@v7
        with:
          name: StarAssistant-Gopeed-Test-9005
          path: output/StarAssistant-Gopeed-Test-9005.apk
          if-no-files-found: error
          retention-days: 7
