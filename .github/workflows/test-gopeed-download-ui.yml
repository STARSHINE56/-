name: 测试版 - Gopeed入口 + 本地下载页优化 9012

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starassistant-download-ui-9012
  cancel-in-progress: true

env:
  YUNX_USE_MIRROR: "false"

jobs:
  build:
    name: 构建下载体验 9012 测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. 检出源码
      # ============================================================
      - name: 检出源码
        uses: actions/checkout@v7

      # ============================================================
      # 2. Java
      # ============================================================
      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 构建组件
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. Gradle
      # ============================================================
      - name: 配置 Gradle
        shell: bash
        run: |
          set -e

          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 5. 添加一次性 Gopeed 调度状态
      # ============================================================
      - name: 添加 Gopeed 调度状态
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadDispatchMode.kt \
            <<'EOF'
          package com.yunx.app.data.download

          import java.util.concurrent.atomic.AtomicLong

          /**
           * 标记“下一次 enqueue 交给 Gopeed”。
           *
           * 只在短时间内有效，防止异常流程污染之后的本地下载。
           */
          object DownloadDispatchMode {

              private const val EXPIRE_MS = 15_000L

              private val gopeedRequestedAt =
                  AtomicLong(0L)

              fun requestGopeed() {
                  gopeedRequestedAt.set(
                      System.currentTimeMillis()
                  )
              }

              fun consumeGopeed(): Boolean {
                  val requestedAt =
                      gopeedRequestedAt.getAndSet(0L)

                  if (requestedAt <= 0L) {
                      return false
                  }

                  return (
                      System.currentTimeMillis() -
                          requestedAt
                      ) <= EXPIRE_MS
              }

              fun clear() {
                  gopeedRequestedAt.set(0L)
              }
          }
          EOF

      # ============================================================
      # 6. Gopeed 调度器
      #
      # 优先：
      # gopeed:///create?params=...
      #
      # 携带：
      # URL
      # 文件名
      # Headers
      #
      # 失败回退：
      # ACTION_SEND
      # ACTION_VIEW
      # ============================================================
      - name: 添加 Gopeed 调度器
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/data/download/GopeedDispatcher.kt \
            <<'EOF'
          package com.yunx.app.data.download

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.util.Base64
          import android.util.Log
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          object GopeedDispatcher {

              private const val TAG =
                  "StarAssistant-Gopeed"

              private const val GOPEED_PACKAGE =
                  "com.gopeed.gopeed"

              fun dispatch(
                  context: Context,
                  url: String,
                  fileName: String,
                  headers: Map<String, String>,
                  platform: String = ""
              ): Boolean {

                  if (url.isBlank()) {
                      showToast(
                          context,
                          "下载链接为空"
                      )

                      return false
                  }

                  if (
                      openDeepLink(
                          context = context,
                          url = url,
                          fileName = fileName,
                          headers = headers,
                          platform = platform
                      )
                  ) {
                      return true
                  }

                  if (
                      openShare(
                          context,
                          url
                      )
                  ) {
                      return true
                  }

                  if (
                      openView(
                          context,
                          url
                      )
                  ) {
                      return true
                  }

                  showToast(
                      context,
                      "无法打开 Gopeed，请确认已经安装",
                      true
                  )

                  return false
              }

              private fun openDeepLink(
                  context: Context,
                  url: String,
                  fileName: String,
                  headers: Map<String, String>,
                  platform: String
              ): Boolean {

                  return try {
                      val headerJson =
                          JSONObject()

                      headers.forEach {
                          (key, value) ->

                          headerJson.put(
                              key,
                              value
                          )
                      }

                      /*
                       * Gopeed ReqExtraHttp
                       */
                      val httpExtra =
                          JSONObject().apply {
                              put(
                                  "method",
                                  "GET"
                              )

                              put(
                                  "header",
                                  headerJson
                              )

                              put(
                                  "body",
                                  ""
                              )
                          }

                      /*
                       * Gopeed Request
                       */
                      val request =
                          JSONObject().apply {
                              put(
                                  "url",
                                  url
                              )

                              put(
                                  "extra",
                                  httpExtra
                              )

                              put(
                                  "skipVerifyCert",
                                  false
                              )
                          }

                      /*
                       * HTTP 下载选项
                       *
                       * connections=8：
                       * 不强行开太高并发，
                       * 避免部分网盘 CDN 对大量 Range 请求不友好。
                       */
                      val optsExtra =
                          JSONObject().apply {
                              put(
                                  "connections",
                                  8
                              )

                              put(
                                  "archivePassword",
                                  ""
                              )

                              put(
                                  "deleteAfterExtract",
                                  false
                              )
                          }

                      val options =
                          JSONObject().apply {
                              put(
                                  "name",
                                  fileName
                              )

                              put(
                                  "path",
                                  ""
                              )

                              put(
                                  "asDefaultPath",
                                  false
                              )

                              put(
                                  "selectFiles",
                                  JSONArray()
                              )

                              put(
                                  "extra",
                                  optsExtra
                              )
                          }

                      /*
                       * Gopeed CreateTask
                       */
                      val createTask =
                          JSONObject().apply {
                              put(
                                  "req",
                                  request
                              )

                              put(
                                  "opts",
                                  options
                              )
                          }

                      val base64 =
                          Base64.encodeToString(
                              createTask
                                  .toString()
                                  .toByteArray(
                                      Charsets.UTF_8
                                  ),
                              Base64.NO_WRAP
                          )

                      /*
                       * Gopeed 官方当前使用 path 型 deep link：
                       *
                       * gopeed:///create
                       *
                       * 不是 gopeed://create
                       */
                      val deepLink =
                          Uri.parse(
                              "gopeed:///create"
                          )
                              .buildUpon()
                              .appendQueryParameter(
                                  "params",
                                  base64
                              )
                              .build()

                      Log.d(
                          TAG,
                          "deepLink platform=$platform headers=${headers.keys}"
                      )

                      val intent =
                          Intent(
                              Intent.ACTION_VIEW,
                              deepLink
                          ).apply {
                              setPackage(
                                  GOPEED_PACKAGE
                              )

                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              )
                          }

                      context.startActivity(
                          intent
                      )

                      showToast(
                          context,
                          "已发送到 Gopeed"
                      )

                      true
                  } catch (
                      e: Exception
                  ) {
                      Log.w(
                          TAG,
                          "deep link failed",
                          e
                      )

                      false
                  }
              }

              private fun openShare(
                  context: Context,
                  url: String
              ): Boolean {

                  return try {
                      val intent =
                          Intent(
                              Intent.ACTION_SEND
                          ).apply {
                              type =
                                  "text/plain"

                              putExtra(
                                  Intent.EXTRA_TEXT,
                                  url
                              )

                              setPackage(
                                  GOPEED_PACKAGE
                              )

                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              )
                          }

                      context.startActivity(
                          intent
                      )

                      showToast(
                          context,
                          "已发送到 Gopeed"
                      )

                      true
                  } catch (
                      e: Exception
                  ) {
                      Log.w(
                          TAG,
                          "ACTION_SEND failed",
                          e
                      )

                      false
                  }
              }

              private fun openView(
                  context: Context,
                  url: String
              ): Boolean {

                  return try {
                      val intent =
                          Intent(
                              Intent.ACTION_VIEW
                          ).apply {
                              setDataAndType(
                                  Uri.parse(url),
                                  "*/*"
                              )

                              setPackage(
                                  GOPEED_PACKAGE
                              )

                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              )
                          }

                      context.startActivity(
                          intent
                      )

                      showToast(
                          context,
                          "已发送到 Gopeed"
                      )

                      true
                  } catch (
                      e: Exception
                  ) {
                      Log.w(
                          TAG,
                          "ACTION_VIEW failed",
                          e
                      )

                      false
                  }
              }

              private fun showToast(
                  context: Context,
                  message: String,
                  long: Boolean = false
              ) {
                  android.os.Handler(
                      context.mainLooper
                  ).post {
                      Toast.makeText(
                          context,
                          message,
                          if (long) {
                              Toast.LENGTH_LONG
                          } else {
                              Toast.LENGTH_SHORT
                          }
                      ).show()
                  }
              }
          }
          EOF

      # ============================================================
      # 7. DownloadManager 接入 Gopeed
      #
      # 只在用户明确点 Gopeed 时截获 enqueue。
      #
      # 普通本地下载保持原样。
      # ============================================================
      - name: DownloadManager 接入 Gopeed
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          marker = """): Long {
                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳"""

          replacement = """): Long {

                  /*
                   * 用户在下载确认弹窗选择 Gopeed：
                   *
                   * 不创建本地任务，
                   * 直接把当前真实 URL / Headers / 文件名交给 Gopeed。
                   */
                  if (
                      DownloadDispatchMode.consumeGopeed()
                  ) {
                      GopeedDispatcher.dispatch(
                          context = context,
                          url = url,
                          fileName = fileName,
                          headers = headers,
                          platform = platform
                      )

                      return -1L
                  }

                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳"""

          if marker not in text:
              raise RuntimeError(
                  "找不到 DownloadManager.enqueue 函数入口"
              )

          text = text.replace(
              marker,
              replacement,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadManager Gopeed 接入完成"
          )
          PY

      # ============================================================
      # 8. 下载确认弹窗
      #
      # Gopeed 在“下载前”选择。
      #
      # 不再在已经创建的本地任务卡中显示 Gopeed。
      # ============================================================
      - name: 更新下载确认弹窗
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt \
            <<'EOF'
          /*
           * YunX (云析) - A network drive share-link parser and high-speed downloader for Android.
           * Copyright (C) 2026 CYQawa
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU Affero General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           */

          package com.yunx.app.ui.resolve

          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.layout.width
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.Download
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import com.yunx.app.data.download.DownloadDispatchMode
          import com.yunx.app.data.network.model.DownloadLink

          @Composable
          fun DownloadLinkDialog(
              link: DownloadLink,
              onDownload: () -> Unit,
              onDismiss: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              AlertDialog(
                  onDismissRequest = {
                      DownloadDispatchMode.clear()
                      onDismiss()
                  },

                  title = {
                      Text(
                          text = link.filename,
                          style =
                              MaterialTheme.typography.titleMedium,
                          maxLines = 2,
                          overflow =
                              TextOverflow.Ellipsis
                      )
                  },

                  text = {
                      Column {
                          Text(
                              text =
                                  "文件已准备好，请选择下载方式。",
                              style =
                                  MaterialTheme.typography.bodyMedium,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )

                          if (link.size > 0L) {
                              Text(
                                  text =
                                      "大小：${formatFileSize(link.size)}",
                                  modifier =
                                      Modifier.padding(
                                          top = 8.dp
                                      ),
                                  style =
                                      MaterialTheme.typography.bodySmall,
                                  color =
                                      MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }

                          Text(
                              text =
                                  "本地下载兼容性更高；Gopeed 适合兼容的普通直链。",
                              modifier =
                                  Modifier.padding(
                                      top = 12.dp
                                  ),
                              style =
                                  MaterialTheme.typography.bodySmall,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  },

                  confirmButton = {
                      Row {
                          TextButton(
                              onClick = {
                                  DownloadDispatchMode
                                      .requestGopeed()

                                  onDownload()
                              }
                          ) {
                              Text(
                                  "Gopeed"
                              )
                          }

                          Spacer(
                              modifier =
                                  Modifier.width(
                                      6.dp
                                  )
                          )

                          Button(
                              onClick = {
                                  DownloadDispatchMode
                                      .clear()

                                  onDownload()
                              }
                          ) {
                              Icon(
                                  imageVector =
                                      Icons.Outlined.Download,
                                  contentDescription =
                                      null,
                                  modifier =
                                      Modifier.size(
                                          16.dp
                                      )
                              )

                              Spacer(
                                  modifier =
                                      Modifier.width(
                                          6.dp
                                      )
                              )

                              Text(
                                  "本地下载"
                              )
                          }
                      }
                  },

                  dismissButton = {
                      TextButton(
                          onClick = {
                              DownloadDispatchMode
                                  .clear()

                              onDismiss()
                          }
                      ) {
                          Text(
                              "关闭"
                          )
                      }
                  },

                  modifier =
                      modifier
              )
          }

          private fun formatFileSize(
              bytes: Long
          ): String {

              if (bytes <= 0L) {
                  return "未知"
              }

              val units =
                  arrayOf(
                      "B",
                      "KB",
                      "MB",
                      "GB",
                      "TB"
                  )

              var value =
                  bytes.toDouble()

              var unit =
                  0

              while (
                  value >= 1024.0 &&
                  unit < units.lastIndex
              ) {
                  value /= 1024.0
                  unit++
              }

              return if (unit == 0) {
                  "$bytes ${units[unit]}"
              } else {
                  String.format(
                      java.util.Locale.US,
                      "%.2f %s",
                      value,
                      units[unit]
                  )
              }
          }
          EOF

      # ============================================================
      # 9. Gopeed 风格本地下载页
      #
      # 只改 UI：
      #
      # 进行中 / 已完成
      # 总实时速度
      # 分类空状态
      # 更紧凑任务卡
      #
      # 不修改实际下载核心。
      # ============================================================
      - name: 优化本地下载页面
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # 1. FilterChip
          # ========================================================
          if (
              "import androidx.compose.material3.FilterChip"
              not in text
          ):
              marker = (
                  "import androidx.compose.material3.FloatingActionButton\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "找不到 FloatingActionButton import"
                  )

              text = text.replace(
                  marker,
                  marker
                  +
                  "import androidx.compose.material3.FilterChip\n",
                  1
              )

          # ========================================================
          # 2. 下载分类 + 总速度
          # ========================================================
          state_marker = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }"""

          state_new = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }

              // 下载分类：
              // 0 = 进行中
              // 1 = 已完成
              var downloadCategory by remember
