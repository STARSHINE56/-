name: 测试版 - Gopeed 下载选择 + 下载页优化

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starassistant-gopeed-download-test
  cancel-in-progress: true

env:
  YUNX_USE_MIRROR: "false"

jobs:
  build:
    name: 构建 Gopeed 下载选择测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 构建组件
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置 Gradle
        shell: bash
        run: |
          set -e

          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 下载方式临时调度
      # ============================================================
      - name: 添加 Gopeed 下载调度
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadDispatchMode.kt \
            <<'EOF'
          package com.yunx.app.data.download

          import java.util.concurrent.atomic.AtomicLong

          /**
           * 临时记录下一次下载是否交给 Gopeed。
           *
           * 点击下载确认弹窗中的 Gopeed 后，
           * 下一次 enqueue() 不进入本地下载数据库，
           * 而是交给 Gopeed。
           */
          object DownloadDispatchMode {

              private const val EXPIRE_MS =
                  15_000L

              private val gopeedRequestedAt =
                  AtomicLong(0L)

              fun requestGopeed() {
                  gopeedRequestedAt.set(
                      System.currentTimeMillis()
                  )
              }

              fun consumeGopeed(): Boolean {
                  val requestedAt =
                      gopeedRequestedAt.getAndSet(0L)

                  if (requestedAt <= 0L) {
                      return false
                  }

                  return (
                      System.currentTimeMillis() -
                          requestedAt
                      ) <= EXPIRE_MS
              }

              fun clear() {
                  gopeedRequestedAt.set(0L)
              }
          }
          EOF

      # ============================================================
      # DownloadManager 接入 Gopeed
      # ============================================================
      - name: 接入 Gopeed
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          marker = """    /** 入队并立即开始下载 */
              suspend fun enqueue("""

          if marker not in text:
              raise RuntimeError(
                  "没有找到 DownloadManager.enqueue"
              )

          helper = r'''    /**
               * 将下载链接交给 Gopeed。
               */
              private fun sendToGopeed(
                  url: String
              ): Boolean {
                  if (url.isBlank()) {
                      return false
                  }

                  val intent =
                      android.content.Intent(
                          android.content.Intent.ACTION_VIEW,
                          android.net.Uri.parse(url)
                      ).apply {
                          setPackage(
                              "com.gopeed.gopeed"
                          )

                          addFlags(
                              android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                          )
                      }

                  return try {
                      context.startActivity(intent)

                      android.os.Handler(
                          context.mainLooper
                      ).post {
                          android.widget.Toast.makeText(
                              context,
                              "已发送到 Gopeed",
                              android.widget.Toast.LENGTH_SHORT
                          ).show()
                      }

                      true
                  } catch (
                      e: android.content.ActivityNotFoundException
                  ) {
                      android.os.Handler(
                          context.mainLooper
                      ).post {
                          android.widget.Toast.makeText(
                              context,
                              "未检测到 Gopeed，请先安装 Gopeed",
                              android.widget.Toast.LENGTH_LONG
                          ).show()
                      }

                      false
                  } catch (
                      e: Exception
                  ) {
                      android.os.Handler(
                          context.mainLooper
                      ).post {
                          android.widget.Toast.makeText(
                              context,
                              "无法打开 Gopeed",
                              android.widget.Toast.LENGTH_SHORT
                          ).show()
                      }

                      false
                  }
              }


              /** 入队并立即开始下载 */
              suspend fun enqueue('''

          text = text.replace(
              marker,
              helper,
              1
          )

          old = """): Long {
                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳
                  val safeName = fileName.ifBlank {"""

          new = """): Long {

                  /*
                   * 如果用户刚刚选择 Gopeed，
                   * 则不创建 StarAssistant 本地下载任务。
                   */
                  if (
                      DownloadDispatchMode.consumeGopeed()
                  ) {
                      sendToGopeed(url)

                      return -1L
                  }

                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳
                  val safeName = fileName.ifBlank {"""

          if old not in text:
              raise RuntimeError(
                  "没有找到 enqueue 函数体入口"
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadManager Gopeed 接入完成"
          )
          PY

      # ============================================================
      # 下载确认弹窗：
      #
      # 原：
      # 关闭    开始下载
      #
      # 改：
      # 关闭    Gopeed    本地下载
      # ============================================================
      - name: 把 Gopeed 按钮加入下载确认弹窗
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if (
              "import androidx.compose.foundation.layout.Row"
              not in text
          ):
              marker = (
                  "import androidx.compose.foundation.layout.Column\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "无法找到 Column import"
                  )

              text = text.replace(
                  marker,
                  marker
                  +
                  "import androidx.compose.foundation.layout.Row\n",
                  1
              )

          old_tip = (
              'text = "点击「开始下载」后，将保存到 Download 目录。",'
          )

          new_tip = (
              'text = "请选择使用 Gopeed 或星辰助手本地下载。",'
          )

          if old_tip in text:
              text = text.replace(
                  old_tip,
                  new_tip,
                  1
              )

          old = '''        confirmButton = {
              Button(
                  onClick = onDownload
              ) {
                  Icon(
                      imageVector = Icons.Outlined.Download,
                      contentDescription = null,
                      modifier = Modifier.size(16.dp)
                  )

                  Spacer(
                      modifier = Modifier.width(6.dp)
                  )

                  Text("开始下载")
              }
          },'''

          new = '''        confirmButton = {
              Row {
                  TextButton(
                      onClick = {
                          com.yunx.app.data.download.DownloadDispatchMode
                              .requestGopeed()

                          onDownload()
                      }
                  ) {
                      Text("Gopeed")
                  }

                  Spacer(
                      modifier = Modifier.width(6.dp)
                  )

                  Button(
                      onClick = {
                          com.yunx.app.data.download.DownloadDispatchMode
                              .clear()

                          onDownload()
                      }
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.Download,
                          contentDescription = null,
                          modifier = Modifier.size(16.dp)
                      )

                      Spacer(
                          modifier = Modifier.width(6.dp)
                      )

                      Text("本地下载")
                  }
              }
          },'''

          if old not in text:
              raise RuntimeError(
                  "无法找到 DownloadLinkDialog 原始下载按钮"
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadLinkDialog 修改成功"
          )
          PY

      # ============================================================
      # 下载页增加「进行中 / 已完成」
      # ============================================================
      - name: 优化本地下载页面
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # FilterChip import
          if (
              "import androidx.compose.material3.FilterChip"
              not in text
          ):
              marker = (
                  "import androidx.compose.material3.FloatingActionButton\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "无法找到 FloatingActionButton import"
                  )

              text = text.replace(
                  marker,
                  marker
                  +
                  "import androidx.compose.material3.FilterChip\n",
                  1
              )

          old = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }"""

          new = """    var showAddDialog by remember { mutableStateOf(false) }
              var pendingDelete by remember { mutableStateOf<DownloadTaskEntity?>(null) }
              var showDeleteAllConfirm by remember { mutableStateOf(false) }

              // 0 = 进行中
              // 1 = 已完成
              var downloadCategory by remember {
                  mutableStateOf(0)
              }

              val activeTasks = tasks.filter {
                  it.status != DownloadTaskEntity.STATUS_COMPLETED
              }

              val completedTasks = tasks.filter {
                  it.status == DownloadTaskEntity.STATUS_COMPLETED
              }

              val visibleTasks =
                  if (downloadCategory == 0) {
                      activeTasks
                  } else {
                      completedTasks
                  }"""

          if old not in text:
              raise RuntimeError(
                  "无法找到 DownloadScreen 状态区域"
              )

          text = text.replace(
              old,
              new,
              1
          )

          old = """            Column(modifier = Modifier.fillMaxSize()) {
                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          new = """            Column(modifier = Modifier.fillMaxSize()) {

                          DownloadCategoryBar(
                              selectedCategory = downloadCategory,
                              activeCount = activeTasks.size,
                              completedCount = completedTasks.size,
                              onCategoryChange = {
                                  downloadCategory = it
                              }
                          )

                          // 批量操作栏：全部暂停 / 全部开始 / 删除全部
                          DownloadBatchBar("""

          if old not in text:
              raise RuntimeError(
                  "无法找到 DownloadBatchBar 插入位置"
              )

          text = text.replace(
              old,
              new,
              1
          )

          text = text.replace(
              """val rootTasks = tasks.filter { !it.fileName.contains('/') }""",
              """val rootTasks = visibleTasks.filter { !it.fileName.contains('/') }""",
              1
          )

          text = text.replace(
              """val folderGroups = tasks.filter { it.fileName.contains('/') }""",
              """val folderGroups = visibleTasks.filter { it.fileName.contains('/') }""",
              1
          )

          marker = """@Composable
          private fun DownloadBatchBar("""

          component = r'''@Composable
          private fun DownloadCategoryBar(
              selectedCategory: Int,
              activeCount: Int,
              completedCount: Int,
              onCategoryChange: (Int) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          start = 16.dp,
                          end = 16.dp,
                          top = 8.dp,
                          bottom = 4.dp
                      )
              ) {
                  Row(
                      modifier =
                          Modifier.fillMaxWidth(),
                      verticalAlignment =
                          Alignment.CenterVertically
                  ) {
                      Column(
                          modifier =
                              Modifier.weight(1f)
                      ) {
                          Text(
                              text = "下载任务",
                              style =
                                  MaterialTheme.typography.titleLarge,
                              fontWeight =
                                  FontWeight.SemiBold
                          )

                          Spacer(
                              modifier =
                                  Modifier.height(2.dp)
                          )

                          Text(
                              text =
                                  if (activeCount > 0) {
                                      "$activeCount 个任务正在等待或下载"
                                  } else {
                                      "当前没有进行中的下载"
                                  },
                              style =
                                  MaterialTheme.typography.bodySmall,
                              color =
                                  MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }

                      if (activeCount > 0) {
                          Surface(
                              shape =
                                  RoundedCornerShape(50),
                              color =
                                  MaterialTheme.colorScheme.primaryContainer
                          ) {
                              Text(
                                  text =
                                      "$activeCount",
                                  style =
                                      MaterialTheme.typography.labelMedium,
                                  fontWeight =
                                      FontWeight.SemiBold,
                                  color =
                                      MaterialTheme.colorScheme.onPrimaryContainer,
                                  modifier =
                                      Modifier.padding(
                                          horizontal = 10.dp,
                                          vertical = 5.dp
                                      )
                              )
                          }
                      }
                  }

                  Spacer(
                      modifier =
                          Modifier.height(12.dp)
                  )

                  Row(
                      horizontalArrangement =
                          Arrangement.spacedBy(8.dp)
                  ) {
                      FilterChip(
                          selected =
                              selectedCategory == 0,
                          onClick = {
                              onCategoryChange(0)
                          },
                          label = {
                              Text(
                                  "进行中 $activeCount"
                              )
                          }
                      )

                      FilterChip(
                          selected =
                              selectedCategory == 1,
                          onClick = {
                              onCategoryChange(1)
                          },
                          label = {
                              Text(
                                  "已完成 $completedCount"
                              )
                          }
                      )
                  }
              }
          }


          @Composable
          private fun DownloadBatchBar('''

          if marker not in text:
              raise RuntimeError(
                  "无法找到 DownloadBatchBar"
              )

          text = text.replace(
              marker,
              component,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadScreen 优化完成"
          )
          PY

      # ============================================================
      # 检查修改结果
      # ============================================================
      - name: 检查修改结果
        shell: bash
        run: |
          set -e

          echo
          echo "======================================"
          echo "修改文件"
          echo "======================================"
          git status --short

          echo
          echo "======================================"
          echo "修改统计"
          echo "======================================"
          git diff --stat

          echo
          echo "======================================"
          echo "Gopeed 相关"
          echo "======================================"
          grep -R -n \
            "Gopeed" \
            app/src/main/kotlin \
            | head -100

          echo
          echo "======================================"
          echo "下载弹窗相关"
          echo "======================================"
          grep -R -n \
            "本地下载\|请选择使用 Gopeed" \
            app/src/main/kotlin \
            | head -100

          echo
          echo "======================================"
          echo "下载分类相关"
          echo "======================================"
          grep -R -n \
            "DownloadCategoryBar\|进行中" \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt \
            | head -100

          echo
          echo "======================================"
          echo "diff 检查"
          echo "======================================"
          git diff --check

      # ============================================================
      # 单元测试
      # ============================================================
      - name: 运行单元测试
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-gopeed-test" \
            -PVERSION_CODE="9003" \
            testDebugUnitTest

      # ============================================================
      # Lint
      # ============================================================
      - name: 运行 Android Lint
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-gopeed-test" \
            -PVERSION_CODE="9003" \
            lintDebug

      # ============================================================
      # 构建 APK
      # ============================================================
      - name: 构建测试 APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -PVERSION_NAME="1.0.0-gopeed-test" \
            -PVERSION_CODE="9003" \
            assembleDebug

      # ============================================================
      # 整理 APK
      # ============================================================
      - name: 整理 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p output

          cp \
            "$APK" \
            "output/StarAssistant-Gopeed-Choice-Test.apk"

          echo
          echo "======================================"
          echo "APK 构建成功"
          echo "======================================"

          ls -lh output/

      # ============================================================
      # 上传 APK
      # ============================================================
      - name: 上传测试 APK
        uses: actions/upload-artifact@v7
        with:
          name: StarAssistant-Gopeed-Choice-Test
          path: output/StarAssistant-Gopeed-Choice-Test.apk
          if-no-files-found: error
          retention-days: 7
