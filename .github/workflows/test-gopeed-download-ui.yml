                                  1
                              )
                          },
                          label = {
                              Text(
                                  "已完成 $completedCount"
                              )
                          }
                      )
                  }
              }
          }


          @Composable
          private fun DownloadBatchBar('''

          if marker not in text:
              raise RuntimeError(
                  "无法找到 DownloadBatchBar"
              )

          text = text.replace(
              marker,
              component,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
