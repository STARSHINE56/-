name: 测试版 - Gopeed 全平台下载 9006

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starassistant-gopeed-download-test
  cancel-in-progress: true

env:
  YUNX_USE_MIRROR: "false"

jobs:
  build:
    name: 构建 Gopeed 全平台测试版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 构建组件
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置 Gradle
        shell: bash
        run: |
          set -e

          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      # ============================================================
      # 1. 下载方式临时状态
      # ============================================================
      - name: 添加 Gopeed 下载调度
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/data/download/DownloadDispatchMode.kt \
            <<'EOF'
          package com.yunx.app.data.download

          import java.util.concurrent.atomic.AtomicLong

          /**
           * 标记下一次下载是否交给 Gopeed。
           *
           * 只在短时间内有效，避免异常流程污染后续下载。
           */
          object DownloadDispatchMode {

              private const val EXPIRE_MS =
                  15_000L

              private val gopeedRequestedAt =
                  AtomicLong(0L)

              fun requestGopeed() {
                  gopeedRequestedAt.set(
                      System.currentTimeMillis()
                  )
              }

              fun consumeGopeed(): Boolean {
                  val requestedAt =
                      gopeedRequestedAt.getAndSet(0L)

                  if (requestedAt <= 0L) {
                      return false
                  }

                  return (
                      System.currentTimeMillis() -
                          requestedAt
                      ) <= EXPIRE_MS
              }

              fun clear() {
                  gopeedRequestedAt.set(0L)
              }
          }
          EOF

      # ============================================================
      # 2. 全平台 Gopeed 调度器
      #
      # 优先：
      # gopeed:///create?params=BASE64_JSON
      #
      # JSON 中包含：
      # - URL
      # - HTTP headers
      # - 文件名
      # - 连接数
      #
      # 回退：
      # ACTION_SEND
      # ACTION_VIEW
      # ============================================================
      - name: 创建 Gopeed 调度器
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/data/download/GopeedDispatcher.kt \
            <<'EOF'
          package com.yunx.app.data.download

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.util.Base64
          import android.util.Log
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          object GopeedDispatcher {

              private const val TAG =
                  "StarAssistant-Gopeed"

              private const val GOPEED_PACKAGE =
                  "com.gopeed.gopeed"

              /**
               * 把完整 HTTP 下载任务交给 Gopeed。
               */
              fun dispatch(
                  context: Context,
                  url: String,
                  fileName: String,
                  headers: Map<String, String>,
                  platform: String = ""
              ): Boolean {

                  if (url.isBlank()) {
                      toast(
                          context,
                          "下载链接为空"
                      )

                      return false
                  }

                  /*
                   * 第一优先：
                   *
                   * Gopeed 官方 deep link：
                   *
                   * gopeed:///create?params=...
                   *
                   * params 是 Base64 JSON。
                   */
                  if (
                      openByDeepLink(
                          context = context,
                          url = url,
                          fileName = fileName,
                          headers = headers,
                          platform = platform
                      )
                  ) {
                      return true
                  }

                  /*
                   * 第二优先：
                   * ACTION_SEND。
                   */
                  if (
                      openByShare(
                          context,
                          url
                      )
                  ) {
                      return true
                  }

                  /*
                   * 第三优先：
                   * ACTION_VIEW。
                   */
                  if (
                      openByView(
                          context,
                          url
                      )
                  ) {
                      return true
                  }

                  toast(
                      context,
                      "无法打开 Gopeed，请确认已安装最新版 Gopeed",
                      long = true
                  )

                  return false
              }

              private fun openByDeepLink(
                  context: Context,
                  url: String,
                  fileName: String,
                  headers: Map<String, String>,
                  platform: String
              ): Boolean {

                  return try {
                      val headerJson =
                          JSONObject()

                      headers.forEach {
                          (key, value) ->

                          headerJson.put(
                              key,
                              value
                          )
                      }

                      val httpExtra =
                          JSONObject().apply {
                              put(
                                  "method",
                                  "GET"
                              )

                              put(
                                  "header",
                                  headerJson
                              )

                              put(
                                  "body",
                                  ""
                              )
                          }

                      /*
                       * Gopeed Request
                       */
                      val request =
                          JSONObject().apply {
                              put(
                                  "url",
                                  url
                              )

                              put(
                                  "extra",
                                  httpExtra
                              )

                              put(
                                  "skipVerifyCert",
                                  false
                              )
                          }

                      /*
                       * Gopeed Options
                       */
                      val optsExtra =
                          JSONObject().apply {
                              put(
                                  "connections",
                                  16
                              )

                              put(
                                  "archivePassword",
                                  ""
                              )

                              put(
                                  "deleteAfterExtract",
                                  false
                              )
                          }

                      val options =
                          JSONObject().apply {
                              put(
                                  "name",
                                  fileName
                              )

                              put(
                                  "path",
                                  ""
                              )

                              put(
                                  "asDefaultPath",
                                  true
                              )

                              put(
                                  "selectFiles",
                                  JSONArray()
                              )

                              put(
                                  "extra",
                                  optsExtra
                              )
                          }

                      /*
                       * 完整 CreateTask
                       */
                      val createTask =
                          JSONObject().apply {
                              put(
                                  "req",
                                  request
                              )

                              put(
                                  "opts",
                                  options
                              )
                          }

                      val json =
                          createTask.toString()

                      val base64 =
                          Base64.encodeToString(
                              json.toByteArray(
                                  Charsets.UTF_8
                              ),
                              Base64.NO_WRAP
                          )

                      val encoded =
                          Uri.encode(
                              base64
                          )

                      val deepLink =
                          Uri.parse(
                              "gopeed:///create?params=$encoded"
                          )

                      Log.d(
                          TAG,
                          "dispatch deep link platform=$platform headers=${headers.keys}"
                      )

                      val intent =
                          Intent(
                              Intent.ACTION_VIEW,
                              deepLink
                          ).apply {
                              setPackage(
                                  GOPEED_PACKAGE
                              )

                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              )
                          }

                      context.startActivity(
                          intent
                      )

                      toast(
                          context,
                          "已发送到 Gopeed"
                      )

                      true
                  } catch (
                      e: Exception
                  ) {
                      Log.w(
                          TAG,
                          "deep link failed: ${e.message}"
                      )

                      false
                  }
              }

              private fun openByShare(
                  context: Context,
                  url: String
              ): Boolean {

                  return try {
                      val intent =
                          Intent(
                              Intent.ACTION_SEND
                          ).apply {
                              type =
                                  "text/plain"

                              putExtra(
                                  Intent.EXTRA_TEXT,
                                  url
                              )

                              setPackage(
                                  GOPEED_PACKAGE
                              )

                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              )
                          }

                      context.startActivity(
                          intent
                      )

                      toast(
                          context,
                          "已发送到 Gopeed"
                      )

                      true
                  } catch (
                      e: Exception
                  ) {
                      Log.w(
                          TAG,
                          "ACTION_SEND failed: ${e.message}"
                      )

                      false
                  }
              }

              private fun openByView(
                  context: Context,
                  url: String
              ): Boolean {

                  return try {
                      val intent =
                          Intent(
                              Intent.ACTION_VIEW
                          ).apply {

                              setDataAndType(
                                  Uri.parse(url),
                                  "*/*"
                              )

                              setPackage(
                                  GOPEED_PACKAGE
                              )

                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              )
                          }

                      context.startActivity(
                          intent
                      )

                      toast(
                          context,
                          "已发送到 Gopeed"
                      )

                      true
                  } catch (
                      e: Exception
                  ) {
                      Log.w(
                          TAG,
                          "ACTION_VIEW failed: ${e.message}"
                      )

                      false
                  }
              }

              private fun toast(
                  context: Context,
                  message: String,
                  long: Boolean = false
              ) {
                  android.os.Handler(
                      context.mainLooper
                  ).post {
                      Toast.makeText(
                          context,
                          message,
                          if (long) {
                              Toast.LENGTH_LONG
                          } else {
                              Toast.LENGTH_SHORT
                          }
                      ).show()
                  }
              }
          }
          EOF

      # ============================================================
      # 3. 修改 DownloadManager
      #
      # 所有平台最终都会走 enqueue()
      #
      # 因此这里可以统一截获：
      #
      # 夸克
      # UC
      # 迅雷
      # 百度
      # 移动云盘
      # 123
      # 普通直链
      #
      # 并且 headers 参数就是各平台已经准备好的真实请求头。
      # ============================================================
      - name: DownloadManager 接入全平台 Gopeed
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          old = """): Long {
                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳
                  val safeName = fileName.ifBlank {"""

          new = """): Long {

                  /*
                   * 如果下载确认页选择了 Gopeed，
                   * 则把当前平台已经生成好的：
                   *
                   * URL
                   * 文件名
                   * Headers
                   * 平台
                   *
                   * 全部交给 Gopeed。
                   *
                   * 不创建本地下载任务。
                   */
                  if (
                      DownloadDispatchMode.consumeGopeed()
                  ) {
                      GopeedDispatcher.dispatch(
                          context = context,
                          url = url,
                          fileName = fileName,
                          headers = headers,
                          platform = platform
                      )

                      return -1L
                  }

                  // 文件名兜底：空白时从 URL 推导，避免保存时变成时间戳
                  val safeName = fileName.ifBlank {"""

          if old not in text:
              raise RuntimeError(
                  "没有找到 DownloadManager.enqueue 函数体"
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "DownloadManager 全平台 Gopeed 接入完成"
          )
          PY

      # ============================================================
      # 4. 直接覆盖下载确认弹窗
      # ============================================================
      - name: 更新下载确认弹窗
        shell: bash
        run: |
          set -e

          cat > \
            app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt \
            <<'EOF'
          /*
           * YunX (云析) - A network drive share-link parser and high-speed downloader for Android.
