name: Apply public release optimizations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply prepared changes
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/xingchen-public-release.patch
          git apply --check /tmp/xingchen-public-release.patch
          git apply /tmp/xingchen-public-release.patch
          git rm -f YunX-1.2.6.zip
          git rm -f .github/workflows/apply-public-release-optimizations.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare XingChen Assistant for public release"
          git push origin main

