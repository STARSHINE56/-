name: 保存与下载图标测试

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Modify icons
        run: |
          FILE="app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"

          python3 -c '
          from pathlib import Path

          p = Path("'"$FILE"'")
          s = p.read_text(encoding="utf-8")

          old_import = "import androidx.compose.material.icons.outlined.ChevronRight\n"
          new_import = old_import + "import androidx.compose.material.icons.outlined.CloudUpload\n"

          if "icons.outlined.CloudUpload" not in s:
              if old_import not in s:
                  raise SystemExit("CloudUpload import insertion point not found")
              s = s.replace(old_import, new_import, 1)

          old_save = """            if (onSave != null) {
                  IconButton(onClick = onSave, modifier = Modifier.size(36.dp)) {
                      Icon(
                          imageVector = Icons.Outlined.SaveAlt,
                          contentDescription = "转存",
                          modifier = Modifier.size(18.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }"""

          new_save = """            if (onSave != null) {
                  IconButton(
                      onClick = onSave,
                      modifier = Modifier.size(40.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.CloudUpload,
                          contentDescription = "保存到网盘",
                          modifier = Modifier.size(21.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }"""

          if old_save not in s:
              raise SystemExit("Save button block not found")

          s = s.replace(old_save, new_save, 1)

          old_tail = """            Icon(
                  imageVector = Icons.Outlined.ChevronRight,
                  contentDescription = null,
                  tint = MaterialTheme.colorScheme.outline
              )
          }
      }
      }

      internal fun formatSize"""

          new_tail = """            if (file.isdir) {
                  Icon(
                      imageVector = Icons.Outlined.ChevronRight,
                      contentDescription = "进入文件夹",
                      tint = MaterialTheme.colorScheme.outline
                  )
              } else {
                  IconButton(
                      onClick = onClick,
                      modifier = Modifier.size(40.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.Download,
                          contentDescription = "下载",
                          modifier = Modifier.size(21.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }
          }
      }
      }

      internal fun formatSize"""

          if old_tail not in s:
              raise SystemExit("Trailing icon block not found")

          s = s.replace(old_tail, new_tail, 1)

          p.write_text(s, encoding="utf-8")
          print("Icon modification completed")
          '

      - name: Check changes
        run: |
          git diff -- app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" output/StarAssistant-icon-test.apk
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarAssistant-icon-test
          path: output/StarAssistant-icon-test.apk
          retention-days: 7
