name: 保存与下载图标

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 修改图标并构建测试 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 检查 Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager || true
          sdkmanager --version

      - name: 安装 Android 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: 修改保存与下载图标
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"
          )

          if not path.exists():
              raise RuntimeError(
                  f"找不到源码文件: {path}"
              )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------
          # 1. 增加 CloudUpload import
          # --------------------------------------------------
          if (
              "import androidx.compose.material.icons.outlined.CloudUpload"
              not in text
          ):
              marker = (
                  "import androidx.compose.material.icons.outlined."
                  "ChevronRight\n"
              )

              if marker not in text:
                  raise RuntimeError(
                      "找不到 ChevronRight import"
                  )

              text = text.replace(
                  marker,
                  marker
                  + "import androidx.compose.material.icons.outlined."
                    "CloudUpload\n",
                  1
              )

          # --------------------------------------------------
          # 2. ShareFileRow 增加 onDownload
          # --------------------------------------------------
          old = '''    /** 非空时行尾显示「转存」按钮 */
              onSave: (() -> Unit)? = null,
              /** 非空时行尾显示「更多」按钮（打开文件操作菜单） */'''

          new = '''    /** 非空时行尾显示「转存」按钮 */
              onSave: (() -> Unit)? = null,
              /** 非空时行尾显示下载按钮 */
              onDownload: (() -> Unit)? = null,
              /** 非空时行尾显示「更多」按钮（打开文件操作菜单） */'''

          if "onDownload: (() -> Unit)? = null" not in text:
              if old not in text:
                  raise RuntimeError(
                      "找不到 ShareFileRow onSave 参数"
                  )

              text = text.replace(old, new, 1)

          # --------------------------------------------------
          # 3. ShareFileRow 调用处增加下载回调
          # --------------------------------------------------
          if "onDownload = if (!viewModel.multiSelectMode" not in text:

              old = '''                    onSave = if (!viewModel.multiSelectMode && viewModel.canSave) {
                              { viewModel.requestSave(file) }
                          } else {
                              null
                          },
                          onLongClick = if (!viewModel.multiSelectMode) {'''

              new = '''                    onSave = if (!viewModel.multiSelectMode && viewModel.canSave) {
                              { viewModel.requestSave(file) }
                          } else {
                              null
                          },
                          onDownload = if (!viewModel.multiSelectMode && !file.isdir) {
                              {
                                  checkBaiduLimit(file) {
                                      viewModel.fetchDownloadLink(file)
                                  }
                              }
                          } else {
                              null
                          },
                          onLongClick = if (!viewModel.multiSelectMode) {'''

              if old not in text:
                  raise RuntimeError(
                      "找不到 ShareFileRow 调用位置"
                  )

              text = text.replace(old, new, 1)

          # --------------------------------------------------
          # 4. 转存按钮换成 CloudUpload
          # --------------------------------------------------
          old = '''            if (onSave != null) {
                  IconButton(onClick = onSave, modifier = Modifier.size(36.dp)) {
                      Icon(
                          imageVector = Icons.Outlined.SaveAlt,
                          contentDescription = "转存",
                          modifier = Modifier.size(18.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }'''

          new = '''            if (onSave != null) {
                  IconButton(
                      onClick = onSave,
                      modifier = Modifier.size(40.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.CloudUpload,
                          contentDescription = "保存到网盘",
                          modifier = Modifier.size(21.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }'''

          if "contentDescription = \"保存到网盘\"" not in text:
              if old not in text:
                  raise RuntimeError(
                      "找不到原来的转存按钮代码"
                  )

              text = text.replace(old, new, 1)

          # --------------------------------------------------
          # 5. 文件夹保留 >
          #    文件显示下载按钮
          # --------------------------------------------------
          old = '''            Icon(
                  imageVector = Icons.Outlined.ChevronRight,
                  contentDescription = null,
                  tint = MaterialTheme.colorScheme.outline
              )
          }
      }
      }

      internal fun formatSize'''

          new = '''            if (file.isdir) {
                  Icon(
                      imageVector = Icons.Outlined.ChevronRight,
                      contentDescription = "进入文件夹",
                      tint = MaterialTheme.colorScheme.outline
                  )
              } else if (onDownload != null) {
                  IconButton(
                      onClick = onDownload,
                      modifier = Modifier.size(40.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.Download,
                          contentDescription = "下载",
                          modifier = Modifier.size(21.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }
          }
      }
      }

      internal fun formatSize'''

          if 'contentDescription = "进入文件夹"' not in text:
              if old not in text:
                  raise RuntimeError(
                      "找不到列表末尾 ChevronRight"
                  )

              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("================================")
          print("图标修改完成")
          print("保存到网盘 = CloudUpload")
          print("文件下载   = Download")
          print("文件夹     = ChevronRight")
          print("================================")
          PY

      - name: 检查修改结果
        shell: bash
        run: |
          FILE="app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"

          echo "===== CloudUpload ====="
          grep -n "CloudUpload" "$FILE"

          echo ""
          echo "===== onDownload ====="
          grep -n "onDownload" "$FILE"

          echo ""
          echo "===== Download ====="
          grep -n "Icons.Outlined.Download" "$FILE"

          echo ""
          echo "===== Git Diff ====="
          git diff -- "$FILE"

      - name: 设置 Gradle 权限
        run: chmod +x gradlew

      - name: Gradle 环境检查
        run: |
          java -version
          ./gradlew --version

      - name: 编译测试 APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: 整理 APK
        shell: bash
        run: |
          mkdir -p output

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "没有找到生成的 APK"
            find app/build/outputs -type f || true
            exit 1
          fi

          cp "$APK" \
            output/StarAssistant-save-download-icons-test.apk

          echo "生成成功："
          ls -lh output/

      - name: 上传测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: StarAssistant-save-download-icons-test
          path: output/StarAssistant-save-download-icons-test.apk
          if-no-files-found: error
          retention-days: 7
