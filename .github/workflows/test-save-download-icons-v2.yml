name: 保存与下载图标测试

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Modify icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"
          )

          text = path.read_text(encoding="utf-8")

          # 1. 增加 CloudUpload import
          marker = (
              "import androidx.compose.material.icons.outlined."
              "ChevronRight\n"
          )

          cloud_import = (
              "import androidx.compose.material.icons.outlined."
              "CloudUpload\n"
          )

          if cloud_import not in text:
              if marker not in text:
                  raise RuntimeError("找不到 ChevronRight import")

              text = text.replace(
                  marker,
                  marker + cloud_import,
                  1
              )

          # 2. ShareFileRow 增加 onDownload 参数
          old = '''    /** 非空时行尾显示「转存」按钮 */
              onSave: (() -> Unit)? = null,
              /** 非空时行尾显示「更多」按钮（打开文件操作菜单） */'''

          new = '''    /** 非空时行尾显示「转存」按钮 */
              onSave: (() -> Unit)? = null,
              /** 普通文件右侧下载按钮 */
              onDownload: (() -> Unit)? = null,
              /** 非空时行尾显示「更多」按钮（打开文件操作菜单） */'''

          if "onDownload: (() -> Unit)? = null" not in text:
              if old not in text:
                  raise RuntimeError("找不到 ShareFileRow 参数位置")

              text = text.replace(old, new, 1)

          # 3. ShareFileRow 调用处传入下载动作
          old = '''                    onSave = if (!viewModel.multiSelectMode && viewModel.canSave) {
                              { viewModel.requestSave(file) }
                          } else {
                              null
                          },
                          onLongClick = if (!viewModel.multiSelectMode) {'''

          new = '''                    onSave = if (!viewModel.multiSelectMode && viewModel.canSave) {
                              { viewModel.requestSave(file) }
                          } else {
                              null
                          },
                          onDownload = if (!viewModel.multiSelectMode && !file.isdir) {
                              {
                                  checkBaiduLimit(file) {
                                      viewModel.fetchDownloadLink(file)
                                  }
                              }
                          } else {
                              null
                          },
                          onLongClick = if (!viewModel.multiSelectMode) {'''

          if "onDownload = if (!viewModel.multiSelectMode" not in text:
              if old not in text:
                  raise RuntimeError("找不到 ShareFileRow 调用位置")

              text = text.replace(old, new, 1)

          # 4. 保存到网盘图标：SaveAlt -> CloudUpload
          old = '''            if (onSave != null) {
                  IconButton(onClick = onSave, modifier = Modifier.size(36.dp)) {
                      Icon(
                          imageVector = Icons.Outlined.SaveAlt,
                          contentDescription = "转存",
                          modifier = Modifier.size(18.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }'''

          new = '''            if (onSave != null) {
                  IconButton(
                      onClick = onSave,
                      modifier = Modifier.size(40.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.CloudUpload,
                          contentDescription = "保存到网盘",
                          modifier = Modifier.size(21.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }'''

          if 'contentDescription = "保存到网盘"' not in text:
              if old not in text:
                  raise RuntimeError("找不到原转存按钮")

              text = text.replace(old, new, 1)

          # 5. 最右边：
          #    文件夹仍显示 >
          #    普通文件显示 Download
          old = '''            Icon(
                  imageVector = Icons.Outlined.ChevronRight,
                  contentDescription = null,
                  tint = MaterialTheme.colorScheme.outline
              )
          }
      }
      }

      internal fun formatSize'''

          new = '''            if (file.isdir) {
                  Icon(
                      imageVector = Icons.Outlined.ChevronRight,
                      contentDescription = "进入文件夹",
                      tint = MaterialTheme.colorScheme.outline
                  )
              } else if (onDownload != null) {
                  IconButton(
                      onClick = onDownload,
                      modifier = Modifier.size(40.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Outlined.Download,
                          contentDescription = "下载",
                          modifier = Modifier.size(21.dp),
                          tint = MaterialTheme.colorScheme.primary
                      )
                  }
              }
          }
      }
      }

      internal fun formatSize'''

          if 'contentDescription = "进入文件夹"' not in text:
              if old not in text:
                  raise RuntimeError("找不到列表末尾 ChevronRight")

              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("修改完成")
          PY

      - name: Show diff
        run: |
          git diff -- \
            app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          mkdir -p output

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" \
            output/StarAssistant-save-download-icons-test.apk

          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarAssistant-save-download-icons-test
          path: output/StarAssistant-save-download-icons-test.apk
          retention-days: 7
