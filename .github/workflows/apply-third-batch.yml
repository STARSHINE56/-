name: Apply Third Batch Optimizations

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: apply-third-batch-optimizations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply third batch optimizations
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, found {count}"
                  )

              print(f"OK: {label}")

              return text.replace(
                  old,
                  new,
                  1
              )

          def replace_count(
              text,
              old,
              new,
              label,
              expected
          ):
              count = text.count(old)

              if count != expected:
                  raise RuntimeError(
                      f"{label}: expected {expected} matches, "
                      f"found {count}"
                  )

              print(
                  f"OK: {label} ({count})"
              )

              return text.replace(
                  old,
                  new
              )

          def replace_regex(
              text,
              pattern,
              replacement,
              label,
              expected=1,
              flags=0
          ):
              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  flags=flags
              )

              if count != expected:
                  raise RuntimeError(
                      f"{label}: expected {expected} matches, "
                      f"found {count}"
                  )

              print(
                  f"OK: {label} ({count})"
              )

              return updated

          # ============================================================
          # 1. 下载页清理
          #    删除两个“复制直链”
          # ============================================================

          download_screen_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "DownloadScreen.kt"
          )

          download_screen = download_screen_path.read_text(
              encoding="utf-8"
          )

          copy_button = '''                        TextButton(onClick = {
                                      showMenu = false
                                      copyToClipboard(context, task.url)
                                      SnackbarController.show("直链已复制")
                                  }) {
                                      Icon(Icons.Outlined.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text("复制直链")
                                  }
          '''

          download_screen = replace_count(
              download_screen,
              copy_button,
              "",
              "Remove direct-link copy buttons",
              2
          )

          for old_import in [
              "import android.content.ClipData\n",
              "import android.content.ClipboardManager\n",
              "import androidx.compose.material.icons.outlined.ContentCopy\n",
          ]:
              if old_import in download_screen:
                  download_screen = (
                      download_screen.replace(
                          old_import,
                          ""
                      )
                  )

                  print(
                      "OK: removed "
                      + old_import.strip()
                  )

          clipboard_helper = '''private fun copyToClipboard(context: Context, text: String) {
              val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText("yunx_url", text))
          }

          '''

          download_screen = replace_once(
              download_screen,
              clipboard_helper,
              "",
              "Remove clipboard helper"
          )

          download_screen = download_screen.replace(
              "（复制直链 / 重新下载 / 删除）",
              "（重新下载 / 删除）"
          )

          download_screen_path.write_text(
              download_screen,
              encoding="utf-8"
          )

          # ============================================================
          # 2. 下载链接失效文案
          # ============================================================

          download_vm_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
              "DownloadViewModel.kt"
          )

          download_vm = download_vm_path.read_text(
              encoding="utf-8"
          )

          download_vm = download_vm.replace(
              "重新下载：校验直链有效性后新建任务（直链过期时提示）",
              "重新下载：校验下载链接有效性后新建任务（链接失效时提示）"
          )

          download_vm = replace_once(
              download_vm,
              'SnackbarController.show(if (ok) "已重新加入下载" else "直链已过期，请重新获取下载链接")',
              'SnackbarController.show(if (ok) "已重新加入下载" else "下载链接已失效，请重新解析后下载")',
              "Improve expired link message"
          )

          download_vm_path.write_text(
              download_vm,
              encoding="utf-8"
          )

          # ============================================================
          # 3. 账号状态增加 NETWORK_ERROR
          # ============================================================

          quota_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
              "DriveQuotaViewModel.kt"
          )

          quota = quota_path.read_text(
              encoding="utf-8"
          )

          quota = replace_once(
              quota,
              "import kotlinx.coroutines.launch\n",
              "import kotlinx.coroutines.launch\n"
              "import java.io.IOException\n",
              "Import IOException"
          )

          quota = replace_once(
              quota,
              '''enum class DriveLoginState {
              LOGGED_OUT,
              CHECKING,
              HEALTHY,
              SUSPECT
          }''',
              '''enum class DriveLoginState {
              LOGGED_OUT,
              CHECKING,
              HEALTHY,
              NETWORK_ERROR,
              SUSPECT
          }''',
              "Add NETWORK_ERROR"
          )

          quota = replace_regex(
              quota,
              r'\.onFailure\s*\{',
              '.onFailure { error ->',
              "Capture quota errors",
              expected=6
          )

          suspect_count = quota.count(
              "DriveLoginState.SUSPECT"
          )

          if suspect_count != 6:
              raise RuntimeError(
                  "Expected 6 quota failure states, "
                  f"found {suspect_count}"
              )

          quota = quota.replace(
              "DriveLoginState.SUSPECT",
              "classifyLoginFailure(error)"
          )

          print(
              "OK: six failures now classified"
          )

          factory_marker = '''
              class Factory(
          '''

          classifier = '''
              private fun classifyLoginFailure(
                  error: Throwable
              ): DriveLoginState {
                  var current: Throwable? =
                      error

                  while (current != null) {
                      if (current is IOException) {
                          return DriveLoginState.NETWORK_ERROR
                      }

                      current =
                          current.cause
                  }

                  return DriveLoginState.SUSPECT
              }

          '''

          quota = replace_once(
              quota,
              factory_marker,
              classifier + factory_marker,
              "Add failure classifier"
          )

          quota = quota.replace(
              "SUSPECT 表示接口检测失败。",
              "NETWORK_ERROR 表示网络访问失败；"
              "SUSPECT 表示接口或认证检测失败。"
          )

          quota_path.write_text(
              quota,
              encoding="utf-8"
          )

          # ============================================================
          # 4. DriveScreen
          #
          # 这里不再依赖固定缩进
          # ============================================================

          drive_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "DriveScreen.kt"
          )

          drive = drive_path.read_text(
              encoding="utf-8"
          )

          status_pattern = r'''
              (?P<indent>[ \t]*)
              DriveLoginState\.SUSPECT
              \s*->\s*
              "●\s*登录可能已失效"
          '''

          status_replacement = (
              r'\g<indent>DriveLoginState.NETWORK_ERROR ->'
              '\n'
              r'\g<indent>    "● 网络检测失败"'
              '\n\n'
              r'\g<indent>DriveLoginState.SUSPECT ->'
              '\n'
              r'\g<indent>    "● 登录可能已失效"'
          )

          drive = replace_regex(
              drive,
              status_pattern,
              status_replacement,
              "Add network error status",
              expected=1,
              flags=re.VERBOSE
          )

          color_pattern = r'''
              (?P<indent>[ \t]*)
              DriveLoginState\.SUSPECT
              \s*->\s*
              MaterialTheme
              \s*\.colorScheme
              \s*\.error
          '''

          color_replacement = (
              r'\g<indent>DriveLoginState.SUSPECT ->'
              '\n'
              r'\g<indent>    MaterialTheme'
              '\n'
              r'\g<indent>        .colorScheme'
              '\n'
              r'\g<indent>        .error'
              '\n\n'
              r'\g<indent>DriveLoginState.NETWORK_ERROR ->'
              '\n'
              r'\g<indent>    MaterialTheme'
              '\n'
              r'\g<indent>        .colorScheme'
              '\n'
              r'\g<indent>        .tertiary'
          )

          drive = replace_regex(
              drive,
              color_pattern,
              color_replacement,
              "Add network error color",
              expected=1,
              flags=re.VERBOSE
          )

          drive_path.write_text(
              drive,
              encoding="utf-8"
          )

          # ============================================================
          # 5. 最近解析增加相对时间
          # ============================================================

          resolve_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "ResolveScreen.kt"
          )

          resolve = resolve_path.read_text(
              encoding="utf-8"
          )

          history_marker = '''/**
           * 最近解析单条卡片
           */
          @Composable
          private fun HistoryCard(
          '''

          history_helper = '''/**
           * 将解析时间转换为简短的相对时间。
           */
          private fun formatHistoryTime(
              timestamp: Long,
              now: Long = System.currentTimeMillis()
          ): String {
              if (timestamp <= 0L) {
                  return ""
              }

              val diff =
                  (now - timestamp)
                      .coerceAtLeast(0L)

              val minute =
                  60_000L

              val hour =
                  60L * minute

              val day =
                  24L * hour

              return when {
                  diff < minute ->
                      "刚刚"

                  diff < hour ->
                      "${diff / minute} 分钟前"

                  diff < day ->
                      "${diff / hour} 小时前"

                  diff < 2L * day ->
                      "昨天"

                  diff < 7L * day ->
                      "${diff / day} 天前"

                  else ->
                      "较早"
              }
          }

          /**
           * 最近解析单条卡片
           */
          @Composable
          private fun HistoryCard(
          '''

          resolve = replace_once(
              resolve,
              history_marker,
              history_helper,
              "Add history time formatter"
          )

          history_link_pattern = r'''
              (?P<block>
              [ \t]*Text\(
              \s*text\s*=\s*
              item\.link,
              \s*style\s*=\s*
              MaterialTheme
              \s*\.typography
              \s*\.bodySmall,
              \s*color\s*=\s*
              MaterialTheme
              \s*\.colorScheme
              \s*\.onSurfaceVariant,
              \s*maxLines\s*=\s*1,
              \s*overflow\s*=\s*
              TextOverflow\.Ellipsis
              \s*\)
              )
          '''

          def add_history_time(match):
              block = match.group("block")

              indent_match = re.match(
                  r'([ \t]*)',
                  block
              )

              indent = (
                  indent_match.group(1)
                  if indent_match
                  else ""
              )

              extra = f'''

          {indent}val historyTime =
          {indent}    formatHistoryTime(
          {indent}        item.timestamp
          {indent}    )

          {indent}if (historyTime.isNotBlank()) {{
          {indent}    Text(
          {indent}        text =
          {indent}            historyTime,

          {indent}        style =
          {indent}            MaterialTheme
          {indent}                .typography
          {indent}                .labelSmall,

          {indent}        color =
          {indent}            MaterialTheme
          {indent}                .colorScheme
          {indent}                .onSurfaceVariant
          {indent}    )
          {indent}}}'''

              return block + extra

          resolve, history_count = re.subn(
              history_link_pattern,
              add_history_time,
              resolve,
              count=1,
              flags=re.VERBOSE
          )

          if history_count != 1:
              raise RuntimeError(
                  "History link block: expected 1, "
                  f"found {history_count}"
              )

          print(
              "OK: recent history displays time"
          )

          resolve_path.write_text(
              resolve,
              encoding="utf-8"
          )

          # ============================================================
          # 6. Test Build APK 增加 lintDebug
          # ============================================================

          test_path = Path(
              ".github/workflows/test-build.yml"
          )

          test_workflow = test_path.read_text(
              encoding="utf-8"
          )

          if "lintDebug" not in test_workflow:
              build_marker = '''      - name: Build debug APK
                  shell: bash
                  run: |
                    ./gradlew \\
                      --no-daemon \\
                      --console=plain \\
                      -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
                      assembleDebug
          '''

              lint_build = '''      - name: Run Android lint
                  shell: bash
                  run: |
                    ./gradlew \\
                      --no-daemon \\
                      --console=plain \\
                      -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
                      lintDebug

                - name: Build debug APK
                  shell: bash
                  run: |
                    ./gradlew \\
                      --no-daemon \\
                      --console=plain \\
                      -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
                      assembleDebug
          '''

              test_workflow = replace_once(
                  test_workflow,
                  build_marker,
                  lint_build,
                  "Add lintDebug to Test Build"
              )

          else:
              print(
                  "OK: lintDebug already exists"
              )

          test_path.write_text(
              test_workflow,
              encoding="utf-8"
          )

          # ============================================================
          # 7. 文案和注释清理
          #
          # 不改 C139Api / c139Cookie 等内部代码标识符
          # ============================================================

          roots = [
              Path("app/src"),
              Path("README.md"),
          ]

          extensions = {
              ".kt",
              ".xml",
              ".md",
          }

          replacements = {
              "139 网盘": "移动云盘",
              "139网盘": "移动云盘",
              "139 云盘": "移动云盘",
              "139云盘": "移动云盘",
              "移动云盘云盘": "移动云盘",
              '"UC网盘"': '"UC 网盘"',
              '"123云盘"': '"123 云盘"',
          }

          cleanup_count = 0

          for root in roots:
              if root.is_file():
                  files = [root]

              elif root.is_dir():
                  files = [
                      path
                      for path in root.rglob("*")
                      if (
                          path.is_file()
                          and path.suffix in extensions
                      )
                  ]

              else:
                  continue

              for path in files:
                  original = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

                  updated = original

                  for old, new in replacements.items():
                      updated = updated.replace(
                          old,
                          new
                      )

                  if updated != original:
                      path.write_text(
                          updated,
                          encoding="utf-8"
                      )

                      cleanup_count += 1

          print(
              f"OK: wording cleanup changed "
              f"{cleanup_count} files"
          )

          # ============================================================
          # 8. Python 自检
          # ============================================================

          download_check = (
              download_screen_path.read_text(
                  encoding="utf-8"
              )
          )

          forbidden_download = [
              "复制直链",
              "直链已复制",
              "ContentCopy",
              "copyToClipboard(",
          ]

          for value in forbidden_download:
              if value in download_check:
                  raise RuntimeError(
                      "DownloadScreen still contains: "
                      + value
                  )

          download_vm_check = (
              download_vm_path.read_text(
                  encoding="utf-8"
              )
          )

          if (
              "下载链接已失效，请重新解析后下载"
              not in download_vm_check
          ):
              raise RuntimeError(
                  "New link-expired text missing"
              )

          quota_check = quota_path.read_text(
              encoding="utf-8"
          )

          for value in [
              "NETWORK_ERROR",
              "classifyLoginFailure",
              "IOException",
          ]:
              if value not in quota_check:
                  raise RuntimeError(
                      "Quota health code missing: "
                      + value
                  )

          drive_check = drive_path.read_text(
              encoding="utf-8"
          )

          if (
              "● 网络检测失败"
              not in drive_check
          ):
              raise RuntimeError(
                  "Network failure UI missing"
              )

          if (
              "DriveLoginState.NETWORK_ERROR"
              not in drive_check
          ):
              raise RuntimeError(
                  "NETWORK_ERROR branch missing "
                  "from DriveScreen"
              )

          resolve_check = resolve_path.read_text(
              encoding="utf-8"
          )

          if (
              "formatHistoryTime"
              not in resolve_check
          ):
              raise RuntimeError(
                  "History time formatter missing"
              )

          if (
              "item.timestamp"
              not in resolve_check
          ):
              raise RuntimeError(
                  "History timestamp UI missing"
              )

          test_check = test_path.read_text(
              encoding="utf-8"
          )

          if "lintDebug" not in test_check:
              raise RuntimeError(
                  "lintDebug missing"
              )

          print(
              "Third batch source patch completed."
          )
          PY

      - name: Clean whitespace and inspect diff
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/screens/"
                  "DownloadScreen.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
                  "DownloadViewModel.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
                  "DriveQuotaViewModel.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/screens/"
                  "DriveScreen.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/screens/"
                  "ResolveScreen.kt"
              ),
              Path(
                  ".github/workflows/test-build.yml"
              ),
          ]

          for path in targets:
              if not path.exists():
                  continue

              original = path.read_text(
                  encoding="utf-8"
              )

              cleaned = "\n".join(
                  line.rstrip()
                  for line in original.splitlines()
              )

              if original.endswith("\n"):
                  cleaned += "\n"

              path.write_text(
                  cleaned,
                  encoding="utf-8"
              )

              print(
                  f"Cleaned: {path}"
              )
          PY

          git status --short

          echo
          echo "----- DIFF STAT -----"
          git diff --stat

          echo
          echo "----- DIFF CHECK -----"
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure debug build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Debug APK verified:"
          ls -lh "$APK"

      - name: Final source checks
        shell: bash
        run: |
          echo "Checking removed direct-link UI..."

          if grep -n \
            -E '复制直链|直链已复制|ContentCopy|copyToClipboard' \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt
          then
            echo "Old direct-link UI still exists."
            exit 1
          fi

          echo
          echo "Checking account status..."

          grep -q \
            'NETWORK_ERROR' \
            app/src/main/kotlin/com/yunx/app/ui/viewmodel/DriveQuotaViewModel.kt

          grep -q \
            '网络检测失败' \
            app/src/main/kotlin/com/yunx/app/ui/screens/DriveScreen.kt

          echo
          echo "Checking history time..."

          grep -q \
            'formatHistoryTime' \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

          echo
          echo "Checking lint workflow..."

          grep -q \
            'lintDebug' \
            .github/workflows/test-build.yml

          echo
          echo "Checking Mobile Cloud wording..."

          if grep -RIn \
            --include='*.kt' \
            --include='*.xml' \
            -E '139 网盘|139网盘|139 云盘|139云盘' \
            app/src
          then
            echo "Old 139 wording still exists."
            exit 1
          fi

          echo
          echo "All final checks passed."

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-third-batch.yml

      - name: Commit verified changes
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat: improve stability and polish app experience"

          git push \
            origin \
            HEAD:main
