name: Apply Third Batch Optimizations

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: apply-third-batch-optimizations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply third batch optimizations
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, found {count}"
                  )

              print(f"OK: {label}")

              return text.replace(
                  old,
                  new,
                  1
              )

          def replace_count(
              text,
              old,
              new,
              label,
              expected
          ):
              count = text.count(old)

              if count != expected:
                  raise RuntimeError(
                      f"{label}: expected {expected} matches, found {count}"
                  )

              print(
                  f"OK: {label} ({count})"
              )

              return text.replace(
                  old,
                  new
              )

          def replace_regex(
              text,
              pattern,
              replacement,
              label,
              expected=1,
              flags=0
          ):
              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  flags=flags
              )

              if count != expected:
                  raise RuntimeError(
                      f"{label}: expected {expected} matches, found {count}"
                  )

              print(
                  f"OK: {label} ({count})"
              )

              return updated

          # ============================================================
          # 1. 下载页
          #    - 删除两个“复制直链”
          #    - 保留“重新下载 / 删除任务”
          #    - 删除 Clipboard 相关代码
          # ============================================================

          download_screen_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "DownloadScreen.kt"
          )

          download_screen = download_screen_path.read_text(
              encoding="utf-8"
          )

          copy_button = '''                        TextButton(onClick = {
                                      showMenu = false
                                      copyToClipboard(context, task.url)
                                      SnackbarController.show("直链已复制")
                                  }) {
                                      Icon(Icons.Outlined.ContentCopy, contentDescription = null, modifier = Modifier.size(16.dp))
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text("复制直链")
                                  }
          '''

          download_screen = replace_count(
              download_screen,
              copy_button,
              "",
              "Remove direct-link copy buttons",
              2
          )

          imports_to_remove = [
              "import android.content.ClipData\n",
              "import android.content.ClipboardManager\n",
              "import androidx.compose.material.icons.outlined.ContentCopy\n",
          ]

          for old_import in imports_to_remove:
              if old_import in download_screen:
                  download_screen = download_screen.replace(
                      old_import,
                      ""
                  )

                  print(
                      f"OK: removed import {old_import.strip()}"
                  )

          clipboard_helper = '''private fun copyToClipboard(context: Context, text: String) {
              val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText("yunx_url", text))
          }

          '''

          download_screen = replace_once(
              download_screen,
              clipboard_helper,
              "",
              "Remove copyToClipboard helper"
          )

          download_screen = download_screen.replace(
              "（复制直链 / 重新下载 / 删除）",
              "（重新下载 / 删除）"
          )

          download_screen_path.write_text(
              download_screen,
              encoding="utf-8"
          )

          # ============================================================
          # 2. 下载失败/链接失效提示优化
          # ============================================================

          download_vm_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
              "DownloadViewModel.kt"
          )

          download_vm = download_vm_path.read_text(
              encoding="utf-8"
          )

          download_vm = download_vm.replace(
              "重新下载：校验直链有效性后新建任务（直链过期时提示）",
              "重新下载：校验下载链接有效性后新建任务（链接失效时提示）"
          )

          download_vm = replace_once(
              download_vm,
              '''SnackbarController.show(if (ok) "已重新加入下载" else "直链已过期，请重新获取下载链接")''',
              '''SnackbarController.show(if (ok) "已重新加入下载" else "下载链接已失效，请重新解析后下载")''',
              "Improve expired download message"
          )

          download_vm_path.write_text(
              download_vm,
              encoding="utf-8"
          )

          # ============================================================
          # 3. 账号状态检测细分
          #
          # HEALTHY       正常
          # NETWORK_ERROR 网络检测失败
          # SUSPECT       登录可能已失效
          #
          # 网络错误不会删除账号
          # ============================================================

          quota_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
              "DriveQuotaViewModel.kt"
          )

          quota = quota_path.read_text(
              encoding="utf-8"
          )

          quota = replace_once(
              quota,
              "import kotlinx.coroutines.launch\n",
              "import kotlinx.coroutines.launch\n"
              "import java.io.IOException\n",
              "Import IOException"
          )

          old_enum = '''enum class DriveLoginState {
              LOGGED_OUT,
              CHECKING,
              HEALTHY,
              SUSPECT
          }'''

          new_enum = '''enum class DriveLoginState {
              LOGGED_OUT,
              CHECKING,
              HEALTHY,
              NETWORK_ERROR,
              SUSPECT
          }'''

          quota = replace_once(
              quota,
              old_enum,
              new_enum,
              "Add NETWORK_ERROR state"
          )

          quota = replace_regex(
              quota,
              r'\.onFailure\s*\{',
              '.onFailure { error ->',
              "Capture account check errors",
              expected=6
          )

          failure_assignment = '''DriveLoginState.SUSPECT'''

          if quota.count(
              failure_assignment
          ) != 6:
              raise RuntimeError(
                  "Expected 6 SUSPECT failure assignments, "
                  f"found {quota.count(failure_assignment)}"
              )

          quota = quota.replace(
              failure_assignment,
              "classifyLoginFailure(error)"
          )

          print(
              "OK: classify six account check failures"
          )

          factory_marker = '''
              class Factory(
          '''

          classifier = '''
              private fun classifyLoginFailure(
                  error: Throwable
              ): DriveLoginState {
                  var current: Throwable? =
                      error

                  while (current != null) {
                      if (current is IOException) {
                          return DriveLoginState.NETWORK_ERROR
                      }

                      current =
                          current.cause
                  }

                  return DriveLoginState.SUSPECT
              }

          '''

          quota = replace_once(
              quota,
              factory_marker,
              classifier + factory_marker,
              "Add account failure classifier"
          )

          quota = quota.replace(
              "SUSPECT 表示接口检测失败。",
              "NETWORK_ERROR 表示网络访问失败；SUSPECT 表示接口或认证检测失败。"
          )

          quota_path.write_text(
              quota,
              encoding="utf-8"
          )

          # ============================================================
          # 4. 网盘账号卡片新增“网络检测失败”
          # ============================================================

          drive_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "DriveScreen.kt"
          )

          drive = drive_path.read_text(
              encoding="utf-8"
          )

          old_health_text = '''                        DriveLoginState.SUSPECT ->
                              "● 登录可能已失效"

                          DriveLoginState.LOGGED_OUT ->
                              "● 未登录"'''

          new_health_text = '''                        DriveLoginState.NETWORK_ERROR ->
                              "● 网络检测失败"

                          DriveLoginState.SUSPECT ->
                              "● 登录可能已失效"

                          DriveLoginState.LOGGED_OUT ->
                              "● 未登录"'''

          drive = replace_once(
              drive,
              old_health_text,
              new_health_text,
              "Add network failure status text"
          )

          old_health_color = '''                            DriveLoginState.SUSPECT ->
                                  MaterialTheme
                                      .colorScheme
                                      .error

                              else ->'''

          new_health_color = '''                            DriveLoginState.SUSPECT ->
                                  MaterialTheme
                                      .colorScheme
                                      .error

                              DriveLoginState.NETWORK_ERROR ->
                                  MaterialTheme
                                      .colorScheme
                                      .tertiary

                              else ->'''

          drive = replace_once(
              drive,
              old_health_color,
              new_health_color,
              "Add network failure status color"
          )

          drive_path.write_text(
              drive,
              encoding="utf-8"
          )

          # ============================================================
          # 5. 最近解析增加相对时间
          # ============================================================

          resolve_path = Path(
              "app/src/main/kotlin/com/yunx/app/ui/screens/"
              "ResolveScreen.kt"
          )

          resolve = resolve_path.read_text(
              encoding="utf-8"
          )

          history_marker = '''/**
           * 最近解析单条卡片
           */
          @Composable
          private fun HistoryCard(
          '''

          time_helper = '''/**
           * 将解析时间转换为简短的相对时间。
           */
          private fun formatHistoryTime(
              timestamp: Long,
              now: Long = System.currentTimeMillis()
          ): String {
              if (timestamp <= 0L) {
                  return ""
              }

              val diff =
                  (now - timestamp)
                      .coerceAtLeast(0L)

              val minute =
                  60_000L

              val hour =
                  60L * minute

              val day =
                  24L * hour

              return when {
                  diff < minute ->
                      "刚刚"

                  diff < hour ->
                      "${diff / minute} 分钟前"

                  diff < day ->
                      "${diff / hour} 小时前"

                  diff < 2L * day ->
                      "昨天"

                  diff < 7L * day ->
                      "${diff / day} 天前"

                  else ->
                      "较早"
              }
          }

          /**
           * 最近解析单条卡片
           */
          @Composable
          private fun HistoryCard(
          '''

          resolve = replace_once(
              resolve,
              history_marker,
              time_helper,
              "Add history relative time helper"
          )

          old_link_text = '''                Text(
                      text =
                          item.link,

                      style =
                          MaterialTheme
                              .typography
                              .bodySmall,

                      color =
                          MaterialTheme
                              .colorScheme
                              .onSurfaceVariant,

                      maxLines = 1,

                      overflow =
                          TextOverflow.Ellipsis
                  )
          '''

          new_link_text = old_link_text + '''
                  val historyTime =
                      formatHistoryTime(
                          item.timestamp
                      )

                  if (
                      historyTime.isNotBlank()
                  ) {
                      Text(
                          text =
                              historyTime,

                          style =
                              MaterialTheme
                                  .typography
                                  .labelSmall,

                          color =
                              MaterialTheme
                                  .colorScheme
                                  .onSurfaceVariant
                      )
                  }
          '''

          resolve = replace_once(
              resolve,
              old_link_text,
              new_link_text,
              "Show time in recent history"
          )

          resolve_path.write_text(
              resolve,
              encoding="utf-8"
          )

          # ============================================================
          # 6. Test Build APK 永久增加 lintDebug
          # ============================================================

          test_workflow_path = Path(
              ".github/workflows/test-build.yml"
          )

          test_workflow = test_workflow_path.read_text(
              encoding="utf-8"
          )

          build_marker = '''      - name: Build debug APK
                  shell: bash
                  run: |
                    ./gradlew \\
                      --no-daemon \\
                      --console=plain \\
                      -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
                      assembleDebug
          '''

          lint_and_build = '''      - name: Run Android lint
                  shell: bash
                  run: |
                    ./gradlew \\
                      --no-daemon \\
                      --console=plain \\
                      -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
                      lintDebug

                - name: Build debug APK
                  shell: bash
                  run: |
                    ./gradlew \\
                      --no-daemon \\
                      --console=plain \\
                      -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \\
                      assembleDebug
          '''

          test_workflow = replace_once(
              test_workflow,
              build_marker,
              lint_and_build,
              "Add lintDebug to test workflow"
          )

          test_workflow_path.write_text(
              test_workflow,
              encoding="utf-8"
          )

          # ============================================================
          # 7. 清理用户可见的旧网盘文案
          #
          # 不修改：
          # C139Api
          # c139Cookie
          # C139Account
          # 等内部代码标识
          # ============================================================

          roots = [
              Path("app/src"),
              Path("README.md"),
          ]

          extensions = {
              ".kt",
              ".xml",
              ".md",
          }

          replacements = {
              "139 网盘": "移动云盘",
              "139网盘": "移动云盘",
              "139 云盘": "移动云盘",
              "139云盘": "移动云盘",
              "移动云盘云盘": "移动云盘",
              '"UC网盘"': '"UC 网盘"',
              '"123云盘"': '"123 云盘"',
          }

          cleanup_count = 0

          for root in roots:
              if root.is_file():
                  files = [root]

              elif root.is_dir():
                  files = [
                      item
                      for item in root.rglob("*")
                      if (
                          item.is_file() and
                          item.suffix in extensions
                      )
                  ]

              else:
                  continue

              for path in files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

                  updated = text

                  for old, new in replacements.items():
                      updated = updated.replace(
                          old,
                          new
                      )

                  if updated != text:
                      path.write_text(
                          updated,
                          encoding="utf-8"
                      )

                      cleanup_count += 1

          print(
              f"OK: wording cleanup changed "
              f"{cleanup_count} files"
          )

          # ============================================================
          # 8. Python 阶段自检
          # ============================================================

          download_check = (
              download_screen_path.read_text(
                  encoding="utf-8"
              )
          )

          for forbidden in [
              "复制直链",
              "直链已复制",
              "ContentCopy",
              "copyToClipboard(",
          ]:
              if forbidden in download_check:
                  raise RuntimeError(
                      f"DownloadScreen still contains: "
                      f"{forbidden}"
                  )

          download_vm_check = (
              download_vm_path.read_text(
                  encoding="utf-8"
              )
          )

          if (
              "下载链接已失效，请重新解析后下载"
              not in download_vm_check
          ):
              raise RuntimeError(
                  "New expired-link message missing"
              )

          quota_check = quota_path.read_text(
              encoding="utf-8"
          )

          for required in [
              "NETWORK_ERROR",
              "classifyLoginFailure",
              "IOException",
          ]:
              if required not in quota_check:
                  raise RuntimeError(
                      f"Account status code missing: "
                      f"{required}"
                  )

          drive_check = drive_path.read_text(
              encoding="utf-8"
          )

          if "● 网络检测失败" not in drive_check:
              raise RuntimeError(
                  "DriveScreen network failure text missing"
              )

          resolve_check = resolve_path.read_text(
              encoding="utf-8"
          )

          if "formatHistoryTime" not in resolve_check:
              raise RuntimeError(
                  "History relative time helper missing"
              )

          test_check = test_workflow_path.read_text(
              encoding="utf-8"
          )

          if "lintDebug" not in test_check:
              raise RuntimeError(
                  "lintDebug missing from test-build.yml"
              )

          print(
              "Third batch patch applied successfully."
          )
          PY

      - name: Clean whitespace and show changed files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/screens/"
                  "DownloadScreen.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
                  "DownloadViewModel.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/viewmodel/"
                  "DriveQuotaViewModel.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/screens/"
                  "DriveScreen.kt"
              ),
              Path(
                  "app/src/main/kotlin/com/yunx/app/ui/screens/"
                  "ResolveScreen.kt"
              ),
              Path(
                  ".github/workflows/test-build.yml"
              ),
          ]

          for path in targets:
              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              cleaned = "\n".join(
                  line.rstrip()
                  for line in text.splitlines()
              )

              if text.endswith("\n"):
                  cleaned += "\n"

              path.write_text(
                  cleaned,
                  encoding="utf-8"
              )

              print(
                  f"Cleaned: {path}"
              )
          PY

          git status --short

          echo
          echo "----- DIFF STAT -----"
          git diff --stat

          echo
          echo "----- DIFF CHECK -----"
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure debug build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Debug APK:"
          ls -lh "$APK"

      - name: Final source checks
        shell: bash
        run: |
          echo "Checking old direct-link UI..."

          if grep -RIn \
            --include='*.kt' \
            -E '复制直链|直链已复制' \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt
          then
            echo "Old direct-link copy UI still exists."
            exit 1
          fi

          echo
          echo "Checking old Mobile Cloud wording..."

          if grep -RIn \
            --include='*.kt' \
            --include='*.xml' \
            -E '139 网盘|139网盘|139 云盘|139云盘' \
            app/src
          then
            echo "Old Mobile Cloud wording still exists."
            exit 1
          fi

          echo
          echo "Checking account network state..."

          grep -q \
            'NETWORK_ERROR' \
            app/src/main/kotlin/com/yunx/app/ui/viewmodel/DriveQuotaViewModel.kt

          grep -q \
            '网络检测失败' \
            app/src/main/kotlin/com/yunx/app/ui/screens/DriveScreen.kt

          echo
          echo "Checking history time..."

          grep -q \
            'formatHistoryTime' \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

          echo
          echo "Checking permanent lint workflow..."

          grep -q \
            'lintDebug' \
            .github/workflows/test-build.yml

          echo
          echo "All final source checks passed."

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-third-batch.yml

      - name: Commit verified changes
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat: improve stability and polish app experience"

          git push \
            origin \
            HEAD:main
