name: 下载优化第三批

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  optimize:
    name: 下载优化第三批
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 恢复被 MT 插件误删的资源文件
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable

          if [ ! -f app/src/main/res/drawable/icon.png ]; then
            echo "检测到 drawable/icon.png 缺失，正在从历史提交恢复..."
            git show 7fb9999cbea4:app/src/main/res/drawable/icon.png > app/src/main/res/drawable/icon.png
          fi

          if [ ! -f app/src/main/res/drawable/icon2.png ]; then
            echo "检测到 drawable/icon2.png 缺失，正在从历史提交恢复..."
            git show 21b9b079802d:app/src/main/res/drawable/icon2.png > app/src/main/res/drawable/icon2.png
          fi

          if [ ! -f app/src/main/res/drawable/weixin.png ]; then
            echo "检测到 drawable/weixin.png 缺失，正在从历史提交恢复..."
            git show 09401ce2bebd:app/src/main/res/drawable/weixin.png > app/src/main/res/drawable/weixin.png
          fi

          test -s app/src/main/res/drawable/icon.png
          test -s app/src/main/res/drawable/icon2.png
          test -s app/src/main/res/drawable/weixin.png

      - name: 检查并恢复第一、二批基础
        shell: bash
        run: |
          if [ ! -f app/src/main/kotlin/com/yunx/app/data/download/CloudDownloadSource.kt ] || \
             ! grep -q "sourceFileId" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskEntity.kt || \
             ! grep -q "version = 15" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt; then
            echo "检测到前两批下载优化已被后续提交覆盖，正在自动恢复第一批..."
            python3 .github/scripts/apply-download-batch1.py

            echo "继续恢复第二批..."
            python3 .github/scripts/apply-download-batch2.py
          else
            echo "第一、二批基础仍然存在，无需恢复"
          fi

          test -f app/src/main/kotlin/com/yunx/app/data/download/CloudDownloadSource.kt
          grep -q "sourceFileId" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskEntity.kt
          grep -q "sourceType" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskEntity.kt
          grep -q "version = 15" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt

      - name: 应用第三批下载优化
        shell: bash
        run: python3 .github/scripts/apply-download-batch3.py

      - name: 检查修改
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat

          grep -q "version = 16" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt
          grep -q "sourceContext" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskEntity.kt
          grep -q "updateRefreshedSource" app/src/main/kotlin/com/yunx/app/data/db/DownloadTaskDao.kt
          grep -q "consumeSourceExpiryFailure" app/src/main/kotlin/com/yunx/app/data/download/ChunkDownloader.kt
          grep -q "sourceRefresher" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "DownloadPlatform.PAN123" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: 生成结果说明
        shell: bash
        run: |
          mkdir -p batch3-result
          cp app/build/outputs/apk/debug/app-debug.apk batch3-result/星辰助手-下载优化第三批-test.apk

          cat > batch3-result/REPORT.md <<'EOF'
          # 星辰助手下载优化第三批

          本批实现个人网盘下载临时直链自动刷新基础：

          - 自动恢复第一、二批基础，避免后续提交覆盖导致工作流直接失败
          - 识别 HTTP 401 / 403 / 404 / 410
          - HTML 过期/错误页也标记为临时直链失效
          - 根据 platform + sourceFileId 调用当前登录账号的网盘 API 重新取链
          - 夸克 / UC / 迅雷 / 百度 / 移动云 / 123 云盘个人盘均接入
          - 123 云盘额外持久化 fidToken 所需 sourceContext
          - 新直链写回 Room，refreshCount 有上限
          - 新旧文件大小不一致时拒绝续传，避免文件损坏
          - 刷新后保留已有 part/seg，继续断点下载

          注意：
          - 本批只对 sourceType=cloud 的个人网盘文件自动刷新。
          - 分享链接 sourceType=share 暂不自动重建。
          - 单元测试 / Lint / Debug APK 构建全部通过后才会提交。
          EOF

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Download-Optimization-Batch3
          path: batch3-result/**
          if-no-files-found: error
          retention-days: 14

      - name: 提交修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main app/src/test

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "feat: restore download metadata and refresh expired cloud URLs"
          git push origin HEAD:main
