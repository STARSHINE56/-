name: 正式应用保存与下载图标优化

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  apply:
    name: Test and commit changes
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply tested patch
        run: python3 .github/scripts/patch_save_download_icons.py

      - name: Show changes
        run: |
          git diff -- \
            app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure build
        shell: bash
        run: |
          sed -i \
            '/aapt2FromMavenOverride/d' \
            gradle.properties

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > local.properties

          chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: Verify expected changes
        shell: bash
        run: |
          FILE="app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt"

          grep -q \
            'Icons.Outlined.CloudUpload' \
            "$FILE"

          grep -q \
            'contentDescription = "保存到网盘"' \
            "$FILE"

          grep -q \
            'contentDescription = "下载"' \
            "$FILE"

          grep -q \
            'contentDescription = "进入文件夹"' \
            "$FILE"

          echo "Verified."

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/kotlin/com/yunx/app/ui/resolve/ShareDetailScreen.kt

          git commit \
            -m "优化保存到网盘和下载按钮图标"

          git push origin HEAD:main
