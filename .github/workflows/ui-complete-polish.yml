name: 星辰助手 UI 全面优化

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  ui-polish:
    name: UI 全面优化
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 配置构建环境
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: 检查第六批下载基础仍完整
        shell: bash
        run: |
          test -f app/src/main/kotlin/com/yunx/app/data/download/DownloadFailurePolicy.kt
          grep -q "recoverInterruptedTasks" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "wifiOnlyProvider" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "等待队列" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "等待 Wi-Fi" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "cleanupOrphanTempFiles" app/src/main/kotlin/com/yunx/app/data/download/DownloadManager.kt
          grep -q "notifyCompleted" app/src/main/kotlin/com/yunx/app/data/download/DownloadService.kt
          grep -q "version = 16" app/src/main/kotlin/com/yunx/app/data/db/AppDatabase.kt

      - name: 检查 UI 源码基线
        shell: bash
        run: |
          test -f app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt
          test -f app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt
          test -f app/src/main/kotlin/com/yunx/app/ui/screens/SettingsScreen.kt
          test -f app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          test -f app/src/main/kotlin/com/yunx/app/ui/screens/DownloadHistoryScreen.kt

          grep -q "private fun DownloadTaskCard" app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt
          grep -q "private fun SettingsItem" app/src/main/kotlin/com/yunx/app/ui/screens/SettingsScreen.kt
          grep -q "isFetchingDownloadLink" app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          grep -q "MainTab.Resolve" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt

      - name: 检查关键资源
        shell: bash
        run: |
          test -s app/src/main/res/drawable/icon.png
          test -s app/src/main/res/drawable/icon2.png
          test -s app/src/main/res/drawable/weixin.png

      - name: 应用 UI 全面优化
        shell: bash
        run: python3 .github/scripts/apply-ui-complete-polish.py

      - name: 确认未修改核心下载与网盘 API
        shell: bash
        run: |
          if git diff --name-only | grep -E '^app/src/main/kotlin/com/yunx/app/(data/network|data/download|data/db)/'; then
            echo "错误：UI 工作流不允许修改下载核心、数据库或网盘 API"
            exit 1
          fi

      - name: UI 静态检查
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat

          grep -q "MainTab.Download ->" app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt
          grep -q "已完成 ·" app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt
          grep -q "正在获取下载链接…" app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          grep -q "MaterialTheme.typography.titleSmall" app/src/main/kotlin/com/yunx/app/ui/screens/SettingsScreen.kt

      - name: 单元测试
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            lintDebug

      - name: 构建 Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            assembleDebug

      - name: 生成结果说明
        shell: bash
        run: |
          mkdir -p ui-polish-result
          cp app/build/outputs/apk/debug/app-debug.apk \
            ui-polish-result/星辰助手-UI全面优化-test.apk

          cat > ui-polish-result/REPORT.md <<'EOF'
          # 星辰助手 UI 全面优化

          本工作流只优化 UI，不修改下载核心、数据库和六个网盘 API。

          已包含：
          - 下载页任务卡瘦身
          - 状态/速度/剩余时间合并，避免重复信息
          - 完成态突出“已完成 + 文件大小”
          - 普通任务卡删除入口移入长按菜单
          - 下载页批量操作栏和空状态收紧
          - 下载历史入口移动到下载页顶部栏
          - 解析页顶部栏只保留收藏入口
          - 获取下载链接改为非阻塞式轻量状态卡
          - 解析输入区高度、按钮圆角和粘贴按钮统一
          - 设置页卡片内部密度、字号、间距和分组标题统一
          - 保留横屏 NavigationRail 和竖屏底部导航
          - 保留 Material 3 和深色模式配色体系

          安全措施：
          - 先确认第六批下载优化仍然存在
          - UI 源码结构不符合预期时立即失败
          - 禁止修改 data/network、data/download、data/db
          - git diff --check、单元测试、Lint、Debug APK 全部通过后才提交
          - 普通 git push，不使用 force
          EOF

      - name: 上传 UI 测试 APK
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-UI-Complete-Polish
          path: ui-polish-result/**
          if-no-files-found: error
          retention-days: 14

      - name: 提交 UI 修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/kotlin/com/yunx/app/ui/MainScreen.kt \
            app/src/main/kotlin/com/yunx/app/ui/screens/DownloadScreen.kt \
            app/src/main/kotlin/com/yunx/app/ui/screens/SettingsScreen.kt \
            app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

          if git diff --cached --quiet; then
            echo "没有需要提交的 UI 修改"
            exit 0
          fi

          git commit -m "feat: polish app UI and simplify download experience"
          git push origin HEAD:main
