name: Apply Share UX Improvements

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

jobs:
  apply:
    name: Improve share parsing UX
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Add resolve history repository
        shell: bash
        run: |
          cat > app/src/main/kotlin/com/yunx/app/data/prefs/ResolveHistoryRepository.kt <<'KOTLIN'
          /*
           * 星辰助手 - 基于 YunX 二次开发
           * 本文件随项目依据 GNU AGPL v3.0 或更高版本发布。
           */
          package com.yunx.app.data.prefs

          import android.content.Context
          import com.yunx.app.data.network.ShareLinkParser
          import com.yunx.app.data.network.SharePlatform
          import org.json.JSONArray
          import org.json.JSONObject

          data class ResolveHistoryItem(
              val link: String,
              val password: String,
              val platformName: String,
              val shareId: String,
              val timestamp: Long
          )

          class ResolveHistoryRepository(context: Context) {
              private val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun load(): List<ResolveHistoryItem> {
                  val raw = prefs.getString(KEY_HISTORY, null) ?: return emptyList()
                  return runCatching {
                      val array = JSONArray(raw)
                      buildList {
                          for (index in 0 until array.length()) {
                              val obj = array.optJSONObject(index) ?: continue
                              val link = obj.optString("link")
                              val shareId = obj.optString("shareId")
                              if (link.isBlank() || shareId.isBlank()) continue
                              add(
                                  ResolveHistoryItem(
                                      link = link,
                                      password = obj.optString("password"),
                                      platformName = obj.optString("platformName", "网盘"),
                                      shareId = shareId,
                                      timestamp = obj.optLong("timestamp", 0L)
                                  )
                              )
                          }
                      }
                  }.getOrDefault(emptyList())
              }

              fun add(text: String, password: String?): List<ResolveHistoryItem> {
                  val parsed = ShareLinkParser.parse(text) ?: return load()
                  val url = URL_REGEX.find(text.trim())?.value
                      ?.trimEnd('。', '，', ',', '；', ';', ')', ']', '}', '"', '\'')
                      ?: text.trim()

                  val item = ResolveHistoryItem(
                      link = url,
                      password = password?.trim().orEmpty().ifBlank { parsed.pwd.orEmpty() },
                      platformName = platformLabel(parsed.platform),
                      shareId = parsed.shareId,
                      timestamp = System.currentTimeMillis()
                  )

                  val updated = buildList {
                      add(item)
                      addAll(
                          load().filterNot {
                              it.platformName == item.platformName && it.shareId == item.shareId
                          }
                      )
                  }.take(MAX_HISTORY)

                  save(updated)
                  return updated
              }

              fun clear() {
                  prefs.edit().remove(KEY_HISTORY).apply()
              }

              private fun save(items: List<ResolveHistoryItem>) {
                  val array = JSONArray()
                  items.forEach { item ->
                      array.put(
                          JSONObject()
                              .put("link", item.link)
                              .put("password", item.password)
                              .put("platformName", item.platformName)
                              .put("shareId", item.shareId)
                              .put("timestamp", item.timestamp)
                      )
                  }
                  prefs.edit().putString(KEY_HISTORY, array.toString()).apply()
              }

              private fun platformLabel(platform: SharePlatform): String = when (platform) {
                  SharePlatform.QUARK -> "夸克网盘"
                  SharePlatform.UC -> "UC 网盘"
                  SharePlatform.XUNLEI -> "迅雷网盘"
                  SharePlatform.BAIDU -> "百度网盘"
                  SharePlatform.C139 -> "移动云盘"
                  SharePlatform.PAN123 -> "123 云盘"
              }

              private companion object {
                  const val PREFS_NAME = "resolve_history"
                  const val KEY_HISTORY = "history"
                  const val MAX_HISTORY = 10
                  val URL_REGEX = Regex("""https?://[^\s]+""")
              }
          }
          KOTLIN

      - name: Patch ResolveScreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise RuntimeError(f"Patch target not found: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              "import com.yunx.app.data.network.SharePlatform\n",
              """import com.yunx.app.data.network.SharePlatform
          import com.yunx.app.data.prefs.ResolveHistoryItem
          import com.yunx.app.data.prefs.ResolveHistoryRepository
          """,
              "history imports",
          )

          replace_once(
              """    val downloadError = viewModel.downloadError
              val context = LocalContext.current
          """,
              """    val downloadError = viewModel.downloadError
              val context = LocalContext.current

              // 最近解析记录：仅保存在本机 SharedPreferences，最多 10 条。
              val historyRepository = remember {
                  ResolveHistoryRepository(context.applicationContext)
              }
              var recentHistory by remember {
                  mutableStateOf(historyRepository.load())
              }

              fun resolveAndRemember(rawLink: String, password: String?) {
                  val parsed = ShareLinkParser.parse(rawLink)
                  if (parsed != null) {
                      recentHistory = historyRepository.add(rawLink, password ?: parsed.pwd)
                  }
                  viewModel.startResolve(rawLink, password)
              }
          """,
              "history state",
          )

          # ResolveInputContent 调用处可能因源码格式化产生不同缩进，使用正则稳健匹配。
          pattern = re.compile(
              r'onClearPwd = \{ pwd = "" \}\s*\n\s*\)',
              re.MULTILINE,
          )
          replacement = """onClearPwd = { pwd = "" },
                    recentHistory = recentHistory,
                    onStartResolve = { rawLink, password ->
                        resolveAndRemember(rawLink, password)
                    },
                    onHistorySelect = { item ->
                        link = item.link
                        pwd = item.password
                        pwdEdited = true
                        resolveAndRemember(item.link, item.password.ifBlank { null })
                    },
                    onClearHistory = {
                        historyRepository.clear()
                        recentHistory = emptyList()
                    }
                )"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError("Patch target not found: ResolveInputContent call")

          # 剪贴板提示也记入历史。
          replace_once(
              "                    viewModel.startResolve(suggestion, parsed?.pwd)\n",
              "                    resolveAndRemember(suggestion, parsed?.pwd)\n",
              "clipboard resolve",
          )

          replace_once(
              """    onClearLink: () -> Unit,
              onClearPwd: () -> Unit
          ) {
          """,
              """    onClearLink: () -> Unit,
              onClearPwd: () -> Unit,
              recentHistory: List<ResolveHistoryItem>,
              onStartResolve: (String, String?) -> Unit,
              onHistorySelect: (ResolveHistoryItem) -> Unit,
              onClearHistory: () -> Unit
          ) {
          """,
              "ResolveInputContent signature",
          )

          replace_once(
              """        Button(
                  onClick = { viewModel.startResolve(link, pwd) },
          """,
              """        Button(
                  onClick = { onStartResolve(link, pwd.ifBlank { null }) },
          """,
              "parse button",
          )

          marker = """        if (state is ResolveUiState.Error) {
          """

          history_ui = """        if (recentHistory.isNotEmpty()) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(
                      containerColor = MaterialTheme.colorScheme.surfaceContainerLow
                  )
              ) {
                  Column(
                      modifier = Modifier.padding(12.dp),
                      verticalArrangement = Arrangement.spacedBy(4.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = "最近解析",
                              modifier = Modifier.weight(1f),
                              style = MaterialTheme.typography.titleSmall
                          )
                          TextButton(onClick = onClearHistory) {
                              Text("清空")
                          }
                      }

                      recentHistory.forEach { item ->
                          TextButton(
                              onClick = { onHistorySelect(item) },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalAlignment = Alignment.Start
                              ) {
                                  Text(
                                      text = buildString {
                                          append(item.platformName)
                                          if (item.password.isNotBlank()) {
                                              append(" · 提取码 ")
                                              append(item.password)
                                          }
                                      },
                                      style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.primary
                                  )
                                  Text(
                                      text = item.link,
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      maxLines = 1
                                  )
                              }
                          }
                      }
                  }
              }
          }

          """

          replace_once(marker, history_ui + marker, "recent history UI")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Improve download link copy actions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise RuntimeError(f"Patch target not found: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              "import androidx.compose.foundation.layout.Column\n",
              """import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          """,
              "Row import",
          )

          replace_once(
              """                            .combinedClickable(
                                      onClick = {},
                                      onLongClick = {
                                          copyToClipboard(context, link.downloadUrl)
                                          SnackbarController.show("下载链接已复制")
                                      }
                                  ),
          """,
              """                            .combinedClickable(
                                      onClick = {
                                          copyToClipboard(context, "download_url", link.downloadUrl)
                                          SnackbarController.show("下载直链已复制")
                                      },
                                      onLongClick = {
                                          copyToClipboard(context, "download_url", link.downloadUrl)
                                          SnackbarController.show("下载直链已复制")
                                      }
                                  ),
          """,
              "link click copy",
          )

          target = """                Text(
                      text = "点击「开始下载」将分片多线程下载并保存到 Download 目录",
          """

          buttons = """                Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.End
                  ) {
                      TextButton(
                          onClick = {
                              copyToClipboard(context, "download_url", link.downloadUrl)
                              SnackbarController.show("下载直链已复制")
                          }
                      ) {
                          Text("复制直链")
                      }
                      TextButton(
                          onClick = {
                              val info = buildString {
                                  appendLine("文件名：${link.filename}")
                                  appendLine("文件大小：${formatFileSize(link.size)}")
                                  append("下载直链：${link.downloadUrl}")
                              }
                              copyToClipboard(context, "file_info", info)
                              SnackbarController.show("文件信息已复制")
                          }
                      ) {
                          Text("复制文件信息")
                      }
                  }

          """

          replace_once(target, buttons + target, "copy buttons")

          replace_once(
              """private fun copyToClipboard(context: Context, text: String) {
              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              clipboard.setPrimaryClip(ClipData.newPlainText("download_url", text))
          }
          """,
              """private fun copyToClipboard(context: Context, label: String, text: String) {
              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              clipboard.setPrimaryClip(ClipData.newPlainText(label, text))
          }

          private fun formatFileSize(bytes: Long): String {
              if (bytes <= 0L) return "未知"
              val units = arrayOf("B", "KB", "MB", "GB", "TB")
              var value = bytes.toDouble()
              var unit = 0
              while (value >= 1024.0 && unit < units.lastIndex) {
                  value /= 1024.0
                  unit++
              }
              return if (unit == 0) {
                  "${bytes} ${units[unit]}"
              } else {
                  String.format(java.util.Locale.US, "%.2f %s", value, units[unit])
              }
          }
          """,
              "clipboard helper",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify source changes
        shell: bash
        run: |
          test -f app/src/main/kotlin/com/yunx/app/data/prefs/ResolveHistoryRepository.kt
          grep -q "最近解析" app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
          grep -q "复制文件信息" app/src/main/kotlin/com/yunx/app/ui/resolve/DownloadLinkDialog.kt
          grep -q "ResolveHistoryRepository" app/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt

      - name: Configure debug build
        shell: bash
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build verification
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest \
            assembleDebug

      - name: Commit improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/apply-share-ux.yml
          rm -f local.properties

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: improve share parsing experience"
          git push origin HEAD:main
